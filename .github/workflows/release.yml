name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # required to create the release

jobs:
  # Do not release a tag that does not compile: reuse the hosted build-check (every supported architecture).
  build:
    uses: ./.github/workflows/ci.yml

  # ...nor one that was not validated whole: the full GPU suite on the GB10 with the cache off, every test run
  # whatever passed before, then the known-red gates held to their registered failures (gpu-full.yml). A tag is
  # pushed by a maintainer, so this runs trusted code on the self-hosted runner.
  validate:
    uses: ./.github/workflows/gpu-full.yml
    with:
      no_cache: true

  publish:
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # full history so the notes span since the last tag
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand-written notes at docs/releases/<tag>.md win; without one, fall back to the commit list.
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "brae $GITHUB_REF_NAME" --notes-file "$notes"
          else
              echo "no $notes, generating notes from commits"
              gh release create "$GITHUB_REF_NAME" --title "brae $GITHUB_REF_NAME" --generate-notes
          fi
