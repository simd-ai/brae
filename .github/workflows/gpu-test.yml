name: gpu-test

# Full ctest on the self-hosted GB10 (Grace-Blackwell, sm_121).
# SECURITY: a self-hosted runner must never execute untrusted code, so this runs ONLY on
# pushes to main and manual dispatch, never on pull requests from forks. Keep untrusted PRs
# on the GitHub-hosted build-check (ci.yml) instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Run every test, whatever passed before (do this before a release tag)'
        type: boolean
        default: false

# One GPU job at a time (kernels would contend for the single device).
concurrency:
  group: gpu-test
  cancel-in-progress: false

jobs:
  ctest:
    runs-on: [self-hosted, ARM64]        # matches the GB10 runner (self-hosted, Linux, ARM64)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and GPU
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"   # ensure nvcc is found even if the runner is a systemd service
          cmake --version | head -1
          /usr/local/cuda/bin/nvcc --version | tail -1
          nvidia-smi --query-gpu=name,compute_cap,memory.total --format=csv,noheader

      - name: Configure
        # the test suite is built only on request (BRAE_BUILD_TESTS, CMakeLists.txt)
        run: cmake -B build -DCMAKE_CUDA_ARCHITECTURES=native -DBRAE_BUILD_TESTS=ON

      - name: Build
        # -j WITH A NUMBER, for the reason ci.yml spells out: a bare `-j` is unbounded and each nvcc
        # peaks at ~0.5 GB. This job builds ALL targets, so it has more TUs in flight than the
        # compile-check does, and the same OOM is one busy runner away.
        run: cmake --build build -j "$(nproc)"   # all targets: brae + the ctest unit-test executables

      - name: Test (ctest, leaving out what already passed on the same inputs)
        # tools/ctest_cached.py fingerprints every test's inputs -- the loaded bytes of each binary it runs,
        # its scripts and fixtures, OpenFOAM, the GPU driver -- and hands ctest only the tests with no recorded
        # pass for that fingerprint. The store is in the runner's home, so it outlives this fresh checkout,
        # and a binary rebuilt from unchanged sources keeps its fingerprint (the tool's header has the
        # measurement). A change to shared code still runs everything that links it; only passes are kept.
        # -LE known-red: a test whose red is understood and decided (CMakeLists.txt says which and why) is left out here
        run: |
          python3 tools/ctest_cached.py --test-dir build \
              ${{ inputs.no_cache && '--no-cache' || '' }} --output-on-failure -j4 -LE known-red

      - name: Known-red rhoCentralFoam gates (red must be exactly the registered open checks)
        # The step above leaves `known-red` out. Six rhoCentralFoam gates carry it: they are red by decision, with 24
        # analysed FAILs registered in tests/data/rho_central_open_checks.tsv and printed by the gates as FAILs with
        # their category. This runs those six and fails on any difference from tests/data/rho_central_known_red.tsv:
        # a FAIL no registry row names, a registered row matching more or fewer FAILs, a gate passing a different
        # number of checks. It changes no threshold and turns no FAIL into a pass; the gates' output is in the log.
        # (tutorial_motorbike's known-red is not a registry item and stays out of both steps.)
        if: ${{ !cancelled() }}
        run: python3 tools/known_red_check.py --test-dir build -j 2
