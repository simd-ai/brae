name: gpu-full

# Tiers 3 and 4 of the CI (docs/ci/branch-rules.md): the whole ctest suite on the self-hosted GB10 (Grace-Blackwell,
# sm_121), `slow` included. Nightly on main and by hand, leaving out what already passed on the same inputs; before
# a release (release.yml calls it with no_cache) every test runs, whatever passed before. Then the known-red gates,
# which must fail exactly as registered. Pull requests and pushes to main run the short tier (gpu-smoke.yml).
#
# Measured: the GB10's run of main 2b26cdd6 on 2026-11-20 (gpu-test.yml, the same selection, -j4) ran 805 tests
# in 2 h 41 min with 105 held from earlier runs; 33,096 s of test time in all.
#
# SECURITY: a self-hosted runner must never execute untrusted code, so this runs ONLY on the schedule (which
# GitHub runs on the default branch), on manual dispatch and from release.yml (a pushed tag), never on a pull
# request.
on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC, 02:00 on the GB10's clock (CET), when nobody is working on it
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Run every test, whatever passed before (do this before a release tag)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      no_cache:
        description: 'Run every test, whatever passed before'
        type: boolean
        default: true

permissions:
  contents: read

# One full run at a time: one that arrives while another is in progress waits instead of cancelling it (GitHub
# keeps one waiting run per group, the newest).
concurrency:
  group: gpu-full
  cancel-in-progress: false

jobs:
  ctest:
    name: gpu-full
    runs-on: [self-hosted, ARM64]        # matches the GB10 runner (self-hosted, Linux, ARM64)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and GPU
        run: |
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"   # ensure nvcc is found even if the runner is a systemd service
          cmake --version | head -1
          /usr/local/cuda/bin/nvcc --version | tail -1
          nvidia-smi --query-gpu=name,compute_cap,memory.total --format=csv,noheader

      - name: Configure
        run: cmake --preset dev -DCMAKE_CUDA_ARCHITECTURES=native   # the test suite is off by default

      - name: Build
        # -j WITH A NUMBER, for the reason ci.yml spells out: a bare `-j` is unbounded and each nvcc
        # peaks at ~0.5 GB. This job builds ALL targets, so it has more TUs in flight than the
        # compile-check does, and the same OOM is one busy runner away.
        run: cmake --build build -j "$(nproc)"   # all targets: the solvers + the ctest executables

      - name: Test (ctest, leaving out what already passed on the same inputs unless no_cache)
        # tools/ctest_cached.py fingerprints every test's inputs -- the loaded bytes of each binary it runs,
        # its scripts and fixtures, OpenFOAM, the GPU driver -- and hands ctest only the tests with no recorded
        # pass for that fingerprint. The store is in the runner's home, so it outlives this fresh checkout,
        # and a binary rebuilt from unchanged sources keeps its fingerprint (the tool's header has the
        # measurement). A change to shared code still runs everything that links it; only passes are kept.
        # -LE known-red: a test whose red is understood and decided (tests/cmake/ says which and why) is left out
        # here and judged by the next step. -LE diagnostic: a test whose result depends on the compiler or GPU target
        # by design runs in the last step instead. The same selection as `ctest --preset full-validation`.
        run: |
          python3 tools/ctest_cached.py --test-dir build \
              ${{ inputs.no_cache && '--no-cache' || '' }} --output-on-failure -j4 -LE 'known-red|diagnostic'

      - name: Known-red rhoCentralFoam gates (red must be exactly the registered open checks)
        # The step above leaves `known-red` out. Six rhoCentralFoam gates carry it: they are red by decision, with 24
        # analysed FAILs registered in tests/data/rho_central_open_checks.tsv and printed by the gates as FAILs with
        # their category. This runs those six and fails on any difference from tests/data/rho_central_known_red.tsv:
        # a FAIL no registry row names, a registered row matching more or fewer FAILs, a gate passing a different
        # number of checks. It changes no threshold and turns no FAIL into a pass; the gates' output is in the log.
        # (tutorial_motorbike's known-red is not a registry item and stays out of both steps.)
        if: ${{ !cancelled() }}
        run: python3 tools/known_red_check.py --test-dir build -j 2

      - name: Diagnostic tests (reported, never failing the job)
        # The tests labelled `diagnostic` (tests/cmake/tiers.cmake): kept to show where two builds round differently,
        # not to gate one. A red here is in the log and the run's annotations; it does not fail the run. The same
        # selection as `ctest --preset diagnostic`.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 tools/ctest_cached.py --test-dir build \
              ${{ inputs.no_cache && '--no-cache' || '' }} --output-on-failure -L diagnostic
