  dispatch:
    openfoam:
      symbol: controlDict application
      file: applications/solvers/incompressible/simpleFoam/simpleFoam.C
    classification: DISPATCH
    brae_status: REIMPLEMENT
    brae_cuda: src/applications/solvers/simpleFoam/simpleFoamV2.cu
    brae_target: src/applications/solvers/simpleFoam/simpleFoamV2.cu
    validation: "CONVERGENCE GATE tests/simplefoam_v2_convergence.sh (ctest: simplefoam_v2_convergence, ~90 s) -- the rebuilt path runs pitzDailyTurb from 0/ to convergence (1713 iterations; OpenFOAM took 1576) and its converged fields are compared with OpenFOAM's own 1576/: U 1.257e-01, p 1.922e-01, k 1.187e-02, epsilon 2.512e-02, nut 6.686e-03. The bounds are what brae's ESTABLISHED solver reaches against the same reference in the passing simple_turbulent_full gate (U 1.311e-01, p 1.989e-01, ...) -- the rebuilt path is marginally better on every field. The disagreement is localised (6 of 12225 cells above 0.5 m/s, worst at the step corner) and is a property of the comparison, not of the rebuild. Carries a control requiring the INITIAL field to exceed the bound. ALSO tests/simplefoam_v2_dispatch.sh (ctest: simplefoam_v2_dispatch) -- drives the real binary on real cases: OFF changes nothing and stays silent; ON+supported runs to endTime and writes; ON+unsupported REFUSES with the reason and exits 1 for each of MRF, fvOptions, SIMPLEC, a non-upwind div(phi,U), a transient ddtScheme and RAS; the GAMG->AMG-PCG substitution is announced; RAS/kEpsilon RUNS and writes k/epsilon/nut with a control that nut changed. Negative control: the guard admits the supported case, so it is not refusing unconditionally."
    note: "OPT-IN via BRAE_SIMPLEFOAM_V2=1 while the envelope is small, and there is deliberately NO try/catch around it: selected-but-unsupported must stop, never fall through to the old solver. A user who asked for the new path and silently got the old one cannot tell from the output which algorithm produced the answer. ENVELOPE TODAY: steady, laminar, upwind or linearUpwind div(phi,U), orthogonal or `corrected` laplacian, SIMPLE or SIMPLEC, no MRF/fvOptions, no fixedFluxPressure, no coupled patches -- stock pitzDaily and pitzDailyTurb (RAS/kEpsilon) is inside it. The non-orthogonal check reads laplacianSchemes ONLY: `laplacianSchemes Gauss linear orthogonal` builds an orthogonal laplacian whatever snGradSchemes says, since snGradSchemes governs explicit fvc::snGrad which in simpleFoam appears only in the refused SIMPLEC branch. NON-ORTHOGONAL CORRECTION: implemented on the _cpp reference exactly as OpenFOAM defines it -- BOTH halves, which is the part that is easy to miss: the implicit face coefficient switches to nonOrthDeltaCoeffs = 1/max(n.delta, 0.05|delta|) (correctedSnGrad.H:108-119, basicFvGeometryScheme.C:266) AND an explicit deferred source -V*div(gamma*magSf*(corrVecs & interpolate(grad(vf)))) is added (gaussLaplacianScheme.C), with corrVecs zero on boundary faces. VALIDATED against REAL OpenFOAM (ctest: nonorth_vs_openfoam, which generates the reference by running simpleFoam itself): on validation/shearedChannel -- genuinely non-orthogonal and using only implemented schemes -- U 6.92e-04 and p 3.75e-04 vs OpenFOAM WITH the correction, against U 8.47e-02 and p 1.37e-01 without it, i.e. 122x and 365x. The control requiring the uncorrected path to be >=20x worse is the substance of that gate: on a near-orthogonal mesh like pitzDaily every brae path agrees to 4 digits whether or not the term is applied, so a gate there would pass with the code deleted. A SIGN ERROR was found by this measurement -- divDevReff returns MINUS the laplacian, so its source contribution is +V*div(...) while the pressure laplacian keeps OpenFOAM's own sign; writing the laplacian sign in both places made U worse with the correction on (1.69e-01) while p improved, and that asymmetry is what localised it. THE CUDA SIDE IS NOW DONE TOO and carries both halves: deviceLaplacianCoeffs(..., nonOrth=true) for the implicit coefficient and deviceLaplacianCorr for the deferred source, in UEqn.cu (momentum, sign -1 because divDevReff carries minus the laplacian) and pEqn.cu (pressure, sign +1). Matched to the reference at 2.9e-16 on the relaxed diag and <=9.2e-16 on every source component, with controls asserting BOTH halves move something (implicit 2.0e-03, explicit 1.7e-03 on U; 3.5e-03 and 7.0e-02 on p) so the machine-precision agreement is not vacuous. The nonorth_vs_openfoam gate gained a CUDA column that reproduces the reference against real OpenFOAM digit for digit: U 6.9193e-04 and p 3.7529e-04, versus 8.4713e-02 / 1.3702e-01 uncorrected. TWO ORDERING TRAPS, both of which built and ran clean while being wrong: (1) deviceDivDevReff ASSIGNS the momentum source (device_divdevreff.cu, `dX[c] = d[0]`) rather than accumulating, so the correction must be added AFTER it -- added before, it is silently discarded; (2) in the diagnostic the GPU flags were copied from the host struct at the point `gin` is filled in, which runs BEFORE those host flags are assigned, so the device got the struct defaults and the CUDA column reproduced the uncorrected answer to five digits. Both were caught by the gate's control, not by the build. `limited <coeff>` is REFUSED separately: limitedSnGrad caps the correction and only `limited 1` equals `corrected`, so accepting the whole family would over-correct. STILL OPEN for stock pitzDaily: linearUpwind and SIMPLEC (`consistent yes`), which is what that case ships -- both remain blockers. KNOWN NARROW GAP: on COUPLED patches OpenFOAM passes the corrected deltaCoeffs to gradientInternalCoeffs (gaussLaplacianScheme.C, the pvf.coupled() branch) while uncoupled patches use the plain ones; neither brae path does the coupled variant, which is unreachable today because coupled patches are refused outright, and must be revisited when they are added. ENVELOPE WIDENING: `bounded` (-fvm::Sp(fvc::div(phi),U)) is DONE on both paths and matched to 2.9e-16 (tests/test_ueqn_cuda.cu), with a control asserting the term actually contributes -- it is ~2e-08 of the diagonal on a converged case because it vanishes exactly at convergence, which is why agreement alone cannot prove it was applied. The kernel sequence is the existing GPU driver's (device_simple_foam.cu:1150) minus the cyclic/AMI additions. An earlier report that the CUDA term was a NO-OP was wrong: the test's struct is `gi` and the patch set `gmi`, so the flag was never enabled. linearUpwind IS DONE on both paths. linearUpwind derives from `upwind`, so the MATRIX is unchanged and the entire scheme is a deferred source correction corr_f = (Cf - C_up) & grad(vf)_up, entering as `fvm += fvc::surfaceIntegrate(phi*corr)` -- which is `source -= faceSum(...)`, since fvMatrix::operator+=(DimensionedField) is `source() -= V*su` (fvMatrix.C:1855). Boundary faces contribute NOTHING on uncoupled patches: linearUpwind::correction fills only the pvf.coupled() branch, so that is the scheme, not an omission. OpenFOAM's `vector` SPECIALISATION uses one tensor grad(U) rather than three scalar grads; the device does it per component, which is the same field under grad(U)_ij = d(U_j)/dx_i, not an approximation. CUDA matches the reference at 6.4e-16/8.8e-16 on the source with a control asserting the term moves the source (3.5e-03) AND leaves the matrix EXACTLY alone -- a diagonal that moved would mean the implicit weights had been changed, which is not what OpenFOAM does. The named gradient is GUARDED: `linearUpwind grad(U)` resolves grad(U) through gradSchemes (linearUpwind.H gradSchemeName_ -> mesh.gradScheme(name)), and anything but Gauss linear -- cellLimited, leastSquares -- is REFUSED, because this correction does not vanish at convergence and a different gradient is a different answer. GATE: ctest linearupwind_vs_openfoam generates the oracle by running simpleFoam on pitzDaily's own discretisation and CONTROLS with a plain-upwind brae run: linearUpwind lands 1.9x (U), 3.2x (k), 2.4x (epsilon), 2.0x (nut) closer to OpenFOAM than upwind does, measured in L2 -- pitzDaily's MAX-norm error sits in a few cells at the step corner and is ~9.3e-02 whatever the scheme is, so the max norm cannot see this term at all. Proven to FAIL with the correction disabled (every ratio collapses to exactly 1.00x). SIMPLEC (`consistent`) IS DONE on both paths: rAtU = 1/(1/rAU - UEqn.H1()), with phiHbyA += interpolate(rAtU-rAU)*snGrad(p)*magSf and HbyA -= (rAU-rAtU)*grad(p), placed AFTER adjustPhi as pEqn.H places them. matrixH1 (lduMatrixATmul.C) and fvc::snGrad (snGradScheme.C + correctedSnGrad.C) were added for it. On the device the flux term is written as a LAPLACIAN FLUX plus its non-orth part rather than as an explicit snGrad, because fvm::laplacian(gamma,p).flux() IS gamma_f*magSf_f*snGrad(p)_f -- that keeps the correction consistent with the equation it corrects by construction. What is still refused is constrainPressure, i.e. a fixedFluxPressure patch: brae maps that type to zeroGradient, which is the same BC only when the imposed flux is zero. A REAL DEFECT WAS FOUND BY THIS WORK, in the non-orthogonal correction rather than in SIMPLEC. fvMatrix::flux() adds faceFluxCorrectionPtr_ (fvMatrix.C:1688), which gaussLaplacianScheme stores alongside the source correction (gaussLaplacianScheme.C:186-199). brae had the correction in the pressure equation's SOURCE and NOT in pEqn.flux(), so `phi = phiHbyA - pEqn.flux()` dropped it and phi was not conservative on a non-orthogonal mesh -- silently, because the pressure equation still solved and every per-stage test still passed at 1e-16. It was exposed by a control that has nothing to do with fluxes: SIMPLEC and plain SIMPLE must converge to the SAME fixed point, since SIMPLEC changes the iteration and not the discrete system, and brae's differed by 5.3e-03 (U, L2). FIXED by porting faceFluxCorrection onto FvMatrix and PressureMatrix, with the per-cell source now computed FROM the face flux so the two cannot drift apart. Effect: SIMPLEC-vs-SIMPLE 5.3e-03 -> 2.8e-04; the nonorth gate on shearedChannel U 6.92e-04 -> 3.12e-05 and p 3.75e-04 -> 2.69e-06 against real OpenFOAM, its discriminating ratio 122x -> 2716x, and its bound tightened 5e-03 -> 1e-04 accordingly. STOCK pitzDaily NOW RUNS AND IS GATED (ctest stock_pitzdaily_vs_openfoam): SIMPLEC + bounded Gauss linearUpwind grad(U) + Gauss linear corrected + RAS/kEpsilon, unmodified apart from tightening residualControl from the stock `p 1e-2` (at which both solvers stop early at different states, so the comparison would measure where each stopped). vs real OpenFOAM, L2: U 5.18e-03, p 2.25e-02, k 1.85e-02, epsilon 3.82e-02, nut 2.75e-02, and brae is settled -- iteration 749 vs 2000 differs by 1.8e-08. The gate also asserts every feature is REPORTED as applied, so a silent skip fails it. PERFORMANCE, measured on GB10 vs OpenFOAM v2412 on 20 cores, 100 SIMPLE iterations on scaled pitzDaily (12k/110k/440k/1.22M): the rebuilt path was NOT reading the case's fvSolution solver settings at all -- StepInput hardcoded tolerance 1e-10 / relTol 0 while pitzDaily asks for relTol 0.1 -- so every inner solve ran to near machine precision every outer iteration. nsys: 614 fine-grid SpMV per SIMPLE iteration against the existing GPU driver's 62. FIXED by reading solvers/p and solvers/U (subDict resolves OpenFOAM regex keys, so `\"(U|k|epsilon|omega|f|v2)\"` is found by \"U\"); maxIter is read too, since an `maxIter 10` caps the answer. Effect: 2.3-2.6x faster at every mesh size (1.22M: 166s -> 67s) with the converged answer UNCHANGED -- U L2 vs OpenFOAM is 5.1790e-03 before and after, which is the point: the inner tolerance changes the path, not the fixed point. Side effect on the gate: brae now plateaus like OpenFOAM (U ~9e-06, p ~2e-04, flat from iteration ~700) instead of reaching a tight residualControl, so stock_pitzdaily_vs_openfoam now ASSERTS settledness by re-running to half the endTime rather than trusting a residual. REMAINING GAP to the existing GPU driver is ~2.3x and is now dominated by the MOMENTUM solve: the rebuilt path uses Jacobi-BiCGStab (~42 iterations per component per outer step, ~90% of all linear-algebra time) where the case asks for smoothSolver/symGaussSeidel, which brae already implements and the old driver uses (gsColorT). Also unwired on this path: the AMG V-cycle CUDA-graph capture (deviceAMGPCG's captureVcycle defaults false; the old driver passes useGraph=true), the PCG residual-read cadence (checkEvery), and the turbulence hook's nuEff refresh, which round-trips nut to the HOST and does the face interpolation there every iteration when deviceInterpolate would keep it resident. The rebuilt driver also writes only its final time -- writeInterval is not honoured. FOLLOW-UP, all measured on the same sweep (100 iterations, seconds, 12k/110k/440k/1.22M). (a) The MOMENTUM solver was routed to smoothSolver/symGaussSeidel, which is what the case asks for and what the existing driver uses -- a real fidelity fix (it was a silent solver substitution) but PERFORMANCE-NEUTRAL: 6.99->6.49 / 11.95->11.05 / 28.52->30.11 / 67.05->69.44. An earlier reading of the profile had attributed ~90% of linear-algebra time to it; removing BiCGStab from U cut only ~7% of the SpMV, so that attribution was wrong and is retracted. (b) The ACTUAL cost was the same defect one level down: the turbulence hook passed a hardcoded tol=1e-10 with relTol 0 to deviceKEpsilonCorrect, so k and epsilon were solved to near machine precision every outer iteration. Phase timing found it -- the hook was 174.5 ms of a ~300 ms outer iteration at 440k, and only 6.1 ms of that was the nuEff host round-trip everyone would suspect. Reading solvers/k (tolerance, relTol, smoother) cut the hook to 48.7 ms and the run to 1.87/4.30/17.35/47.94. (c) The nuEff host round-trip is therefore NOT worth fixing on cost grounds (6 ms); it stays on the list only as an unnecessary host dependency. (d) CUDA GRAPH: deviceAMGPCG on CUDA>=13 already dispatches to a DEVICE-RESIDENT conditional-graph PCG (BRAE_PCG_DEVICE, default on) that captures the whole Krylov loop, measured A/B 17.9 s on vs 18.7 s off at 440k. The captureVcycle/checkEvery arguments this path now passes explicitly are ignored by that dispatch and reach only the host-driven fallback -- worth knowing before anyone else measures them and concludes graphs do nothing. (e) AMG SMOOTHED AGGREGATION cuts the pressure iteration count roughly in half (BRAE_AMG_SA=1 36->27, with BRAE_AMG_GS=1 36->19 AMG-PCG iterations for a 10x residual drop at 440k) but does NOT reduce wall time -- each cycle costs more than the halved count saves -- so neither is enabled by default. NET: 17.90->2.60 (12k), 28.05->4.83, 67.58->17.27, 165.84->47.19 (1.22M), i.e. 3.5-6.9x, with the answer unchanged (U L2 vs OpenFOAM 5.1790e-03 -> 5.1805e-03). Reference points on the same box: OpenFOAM v2412 on 20 cores 1.04/2.52/8.85/26.56 and brae's existing GPU driver 2.04/4.43/14.79/39.42. STILL OPEN: the GPU is busy 74 ms of a 173 ms outer iteration at 440k, the rest being blocking scalar convergence reads (188 per outer iteration); closing that needs the outer loop itself captured, not the inner solves. Also open as FIDELITY, not speed: div(phi,k)/div(phi,epsilon) are run as upwind while pitzDaily asks for `bounded Gauss limitedLinear 1`, and the envelope guard does not check them. AMG REUSE: the hierarchy is built ONCE per run and reused across every SIMPLE iteration (SolverWorkspace::amgBuilt); only the coarse-operator VALUES are re-Galerkined each iteration, which is required because the fine coefficients change. Across RUNS it was cold every time -- the rebuilt driver called buildAMG, not buildOrLoadAMG -- so the existing .brae_amgcache serialization of the agglomeration STRUCTURE was unreachable from this path. Now opt-in via BRAE_AMG_CACHE=1, which writes constant/polyMesh/.brae_amgcache and reloads it when it is newer than `owner`: startup at 1.22M cells 7.27 s cold -> 4.92 s warm (the whole run is ~47 s, so ~5%). SCALING to 4.89M cells, 100 iterations: OpenFOAM v2412 on 20 cores 125.4 s, brae's existing GPU driver 155.4 s, the rebuilt path 211.2 s. The OF-to-brae ratio narrows with mesh size but slowly -- 2.5x at 12k, 2.0x at 440k, 1.8x at 1.22M, 1.7x at 4.89M -- so on THIS hardware (GB10, a workstation part with modest FP64) brae does not overtake a 20-core CPU by extrapolation. AMG mode at 4.89M: SA+GS 202.8 s and SA 207.4 s beat the default 211.2 s by only 2-4%, while GS ALONE is clearly worse at 247.9 s (+17%). SA halves the pressure ITERATION count (36->19 at 440k) at every size but only starts paying for itself in wall time around 5M, so it stays off by default and GS-without-SA should be avoided. TUTORIAL SWEEP of all 17 incompressible/simpleFoam tutorials: 4 skipped (no mesh without snappyHexMesh/m4/extrude), 13 meshable, of which 2 run -- pitzDaily and pitzDailyExptInlet -- and 11 are refused with named reasons. Tally of what blocks them: turbulence model 5 (kOmegaSST x3, realizableKE, kOmegaSSTLM), div(phi,U) scheme 5 (LUST, linearUpwindV, limitedLinearV x2, fusedGauss), fvOptions 3, MRF 1, cyclicAMI 1, transient ddt 1, laplacian `limited` 1, and linearUpwind naming a cellLimited gradient 1. Nothing ran and gave a wrong answer; every refusal named its component. THAT SWEEP MEASURES THE REBUILD, NOT brae. Re-run offering each meshed tutorial to BOTH paths: the SHIPPED driver runs 9 of 9 -- backwardFacingStep2D, pipeCyclic, pitzDaily, pitzDailyExptInlet, rotatingCylinders, rotorDisk, simpleCar, T3A, and motorBike (353,784 cells, snappyHexMesh, kOmegaSST + linearUpwindV, producing Cd/Cl/Cm through its forceCoeffs functionObject) -- while the rebuilt path runs 2. The shipped path wires 13 turbulence models (kEpsilon, kOmega, kOmegaSST + DES/IDDES/LM, realizableKE, RNGkEpsilon, SpalartAllmaras + DDES/IDDES, Smagorinsky, WALE, laminar), MRF, fvOptions, cyclic/cyclicAMI/cyclicACMI, porosity. The gap is the REBUILD's by construction: this port admits a component only after it is validated against OpenFOAM, and refuses otherwise. Closing it is wiring plus gating, not new CUDA -- the device kernels for linearUpwindV, limitedLinear(+V), LUST, vanAlbada and the other turbulence models already exist and the shipped path drives them. MESHING is not and never was brae's: blockMesh/snappyHexMesh are OpenFOAM's, and the `no mesh` rows in the first sweep were the sweep harness failing to drive each tutorial's own workflow (geometry copied from tutorials/resources/geometry, m4, snappy), not a brae capability. motorBike is the proof: meshed with OpenFOAM's own tools, brae reads it and solves it. kOmegaSST IS NOW PORTED, and driven from ofscan rather than from tutorial refusals -- which was the wrong source of truth and is corrected: `ofscan impls incompressible::turbulenceModel` enumerates 26 models, and `ofscan schema kOmegaSSTBase` gives 17 dictionary keys with defaults and file:line. That enumeration immediately found a gap no tutorial exercises: brae reads 13 of the 17 and not decayControl/kInf/omegaInf. THE _cpp REFERENCE CAME FIRST, per the port discipline: kOmegaSST_cpp transcribes kOmegaSSTBase::correct() -- S2, GbyNu0, CDkOmega, F1, F2, the GbyNu production limiter, both transport equations, the omega wall function (blender BINOMIAL n=2 by default: omega = sqrt(omegaVis^2 + omegaLog^2)) and correctNut -- and REFUSES F3, decayControl, MRF and fvOptions. Two transcription subtleties it has to get right and which a fused port hides: the k equation takes G from the RAW GbyNu0 while the omega equation takes the LIMITED one (kOmegaSSTBase.C reassigns GbyNu0 only after G is formed), and correctNut(S2) at the end uses the OLD S2 but F23() re-read from the NEW post-solve k/omega. THE ORACLE IS THE EQUATION RESIDUAL, not a fixed point: at OpenFOAM's converged pitzDaily-kOmegaSST fields our assembled equations give omega 3.99e-03 and k 1.53e-02 in OpenFOAM's own normalisation, and a (k,omega)x1.5 perturbation raises them to 7.10e-02 / 7.70e-02 (the control). The tempting test -- run one correct() and check nothing moves -- was tried and is INVALID here, because OpenFOAM stops on a residual plateau rather than at an exact fixed point, so solving from its state to 1e-12 moves omega by 1.5e-01 in max norm with nothing wrong; that measurement is what localised the oracle, after first confirming the wall cells were fine (1.1e-03), the wall distance right (max 0.0252 m against a 0.0254 m half-height) and the solves converged (47 iterations to 3.6e-13). GbyNu0 and S2 agree to four digits on this field, which is the expected identity for divergence-free flow and an independent cross-check of two separate transcriptions. END TO END the CUDA path then runs the same case and agrees with real OpenFOAM at U 9.25e-03, p 1.81e-02, k 2.42e-02, nut 3.50e-02 (L2), comparable to the kEpsilon path's U 5.18e-03. STILL OPEN, and NOT started: linearUpwindV, limitedLinearV, limitedLinear, LUST, fvOptions, MRF, cyclicAMI, realizableKE and kOmegaSSTLM. kEpsilon also still has NO _cpp reference -- it was wired straight to CUDA earlier in this port, which is the gap this component avoided. LIMITED/BLENDED CONVECTION SCHEMES, _cpp reference: ofscan enumerates 78 surfaceInterpolationScheme implementations, of which this step ports the weight side of three -- LUST, limitedLinear and limitedLinearV. The classification is the part that matters and is easy to get silently wrong: `upwind` is weights only; `linearUpwind` derives from upwind so its weights are UNCHANGED and it is a deferred correction only; `limitedLinear`(+V) is weights only; `LUST` is BOTH (LUST.H overrides weights() as 0.75*linear + 0.25*upwind AND correction() as 0.25*linearUpwind's). A scheme ported as the wrong one of those three still converges to a plausible answer. Transcribed: weights = limiter*CDweights + (1-limiter)*pos0(phi) (limitedSurfaceInterpolationScheme.C), limiter = clamp(twoByk*r, 0, 1) with twoByk = 2/max(k,SMALL) (limitedLinear.H:82), r = 2*(gradcf/gradf) - 1 with OpenFOAM's own 1000x guard (NVDTVD.H), and for the V forms gradf = gradfV & gradfV with gradcf = gradfV & (d & gradc) (NVDVTVDV.H) -- ONE limiter shared across the three components. fvm::div gained a weights overload so `upwind` is just the pos0 special case and every existing call site is untouched. VALIDATED against exact properties of OpenFOAM's source rather than a stored field: LUST reproduces its blend identity to 0.0e+00, limitedLinear collapses to upwind as k->inf (4.0e-10, asymptotic not exact -- twoByk*r is ~1e-9 there, and an exact-equality assertion was wrong), reaches the linear limit on 22939 of 24170 faces at k->0, and all three stay inside the TVD bound [0,1]. THE CONTROL that earns the V variant: limitedLinearV differs from per-component limitedLinear by 5.49e-01, so limiting the components independently would have been a different scheme, not a rounding difference. NOT YET DONE for these schemes: the wiring into UEqn (scheme selection), the envelope acceptance, LUST's 0.25x linearUpwind correction at the call site, and the CUDA comparison -- so the envelope still REFUSES all of them, which is the correct state until they are gated. linearUpwindV is NOT started (deviceLinearUpwindVCorr exists on the device side). THE THREE SCHEMES ARE NOW WIRED AND GATED on both paths. fvm::div gained a weights overload; UEqn_cpp gained divWithScheme() branching on DivScheme, and a correctionFactor() that is a FACTOR rather than a flag because LUST carries 0.25 of linearUpwind's deferred correction as well as its own weights. The CUDA side branches the same way: deviceDivLimitedCoeffs (on magSqr(U)), deviceDivLimitedVCoeffs, and for LUST a 0.75/0.25 blend of the CENTRAL and UPWIND coefficient arrays -- exact, not an approximation, because the coefficients are linear in the weights. fvc::gaussGrad gained an array form so magSqr(U) does not need a synthetic GeometricField with invented boundary types. GATE (ctest divschemes_vs_openfoam): each scheme run in OpenFOAM AND in brae on pitzDaily, with a plain-upwind brae run against the same oracle as the CONTROL. U cannot discriminate -- every scheme including upwind lands within ~5.5e-03 of OpenFOAM -- so the gate asserts on k, where the convection scheme actually bites: limitedLinear 1.88e-02 vs upwind 5.39e-02 (2.87x), limitedLinearV 1.85e-02 vs 5.53e-02 (2.99x), LUST 1.88e-02 vs 5.69e-02 (3.03x). CUDA vs the reference with a limiter active is 5.5e-12 on the off-diagonals, NOT the 1e-16 the upwind path reaches, and that is the scheme's arithmetic rather than a defect: r = 2*(gradcf/gradf) - 1 divides by a face difference that approaches zero in smooth regions, so the ~1e-16 disagreement between the host and device Gauss gradients (different face summation order) is amplified. test_ueqn_cuda therefore carries a SCHEME-AWARE tolerance -- 1e-13 for upwind, 5e-11 with a limiter -- with a control asserting the limiter moves the off-diagonals by 4.4e-01, so the looser bound is not hiding an absent term. Envelope: five div(phi,U) schemes accepted by name, everything else refused; the scheme COEFFICIENT is read too, since `limitedLinear 0.2` is a materially different scheme from `limitedLinear 1`. linearUpwindV IS NOW PORTED TOO, and it is the fourth KIND: weights UNCHANGED (it derives from upwind like linearUpwind) but a DIFFERENT correction, not a scaled one, so it could not be folded into the LUST correction factor. linearUpwindV.C limits the correction against the owner-to-neighbour jump PROJECTED ON THE CORRECTION'S OWN DIRECTION: s = magSqr(corr), mx = corr & maxCorr, and then corr is zeroed when mx < 0 or scaled by mx/(s + VSMALL) when s > mx -- a test over the VECTOR, so it cannot be applied per component, the same trap limitedLinear/limitedLinearV sets. The face corrections are exposed (linearUpwindVFaceCorrection) and the per-cell sum computed FROM them, because the limiter has an exact postcondition that is only checkable per face: after limiting, either corr == 0 or 0 <= magSqr(corr) <= corr & maxCorr. On pitzDailyTurb that holds on all 24170 faces with 0 violations, 125 zeroed and 12557 at the limit, and the result differs from the UNLIMITED linearUpwind correction by 8.87e-01 -- the limiter is the scheme, not a detail. Gate: 2.90x closer to OpenFOAM than upwind on k (1.87e-02 vs 5.42e-02). CUDA-vs-REFERENCE AT MATRIX GRANULARITY for every ported scheme, one ctest each, and the numbers correct the earlier blanket tolerance: linearUpwindV 2.9e-16 diag / 0.0 upper and LUST 3.0e-16 / 1.1e-16 reach MACHINE PRECISION, while limitedLinearV is 1.4e-13 and limitedLinear 5.5e-12. Only the r-ratio limiters amplify, because only they divide by a face difference that approaches zero; giving LUST and linearUpwindV the loose 5e-11 bound would have hidden a real defect in them, so the tolerance is now per-scheme. linearUpwindV additionally asserts its matrix is EXACTLY upwind's (rel = 0.0) -- for a correction-only scheme, asserting the matrix MOVED would assert the opposite of the port. realizableKE IS NOW PORTED. ofscan's schema gives its four keys (A0 4.0, C2 1.9, sigmak 1.0, sigmaEps 1.2). Three things make it realizableKE rather than k-epsilon with different constants, and each is a place a port silently becomes the standard model: (1) Cmu IS NOT CONSTANT -- rCmu = 1/(A0 + As*Us*k/eps) with As from the strain invariants through W = 2*sqrt(2)*((S&S)&&S)/(magS*S2 + SMALL) and phis = acos(clamp(sqrt(6)*W,-1,1))/3; (2) S2 = 2*magSqr(devSymm(gradU)) -- devSymm, NOT the symm kOmegaSST uses a few directories away, and they differ by the trace term; (3) the EPSILON EQUATION IS A DIFFERENT EQUATION -- C1*magS*eps production with C1 = max(eta/(5+eta), 0.43) and C2*eps/(k + sqrt(nuLimited*eps)) destruction, with neither kEpsilon's C1*Cmu*k*GbyNu production nor its divU SuSp term. The k equation IS kEpsilon's shape. Wall functions keep Cmu = 0.09 regardless, because OpenFOAM's nutk/epsilon wall functions read it from their own patch dictionaries. _cpp reference validated on the same residual oracle as kOmegaSST: at OpenFOAM's converged pitzDaily-realizableKE fields our equations give epsilon 4.82e-03 and k 2.26e-05. The perturbation control had to be REDESIGNED: scaling k and epsilon TOGETHER barely moves the epsilon residual (4.82e-03 -> 8.48e-03, 1.8x) because the destruction term C2*eps/(k + sqrt(nu*eps)) is a ratio in which a common factor largely cancels -- so each equation is now probed by perturbing ITS OWN field, giving 26x on epsilon and 11x on k. Sharpening the probe was the right fix; loosening the threshold would have hidden the cancellation instead of exposing it. Two controls say WHICH model was ported: rCmu varies over [0.0239, 0.2500] (a constant 0.09 would be standard k-epsilon, which would still work and still converge) and devSymm-S2 differs from symm-S2 by 5.84e+05. CUDA needed no new kernel -- KEpsilonCoeffs::realizable already selects the variable Cmu, the strain production and the modified destruction inside the fused deviceKEpsilonCorrect -- so the wiring is a coefficient change, and the envelope now accepts kEpsilon, realizableKE and kOmegaSST. End to end vs real OpenFOAM: U 5.41e-03, p 2.80e-02, k 2.66e-02, epsilon 3.09e-02, nut 4.14e-02 (L2), in line with kEpsilon's U 5.18e-03. fvOptions is NOT started and is deliberately not half-started: ofscan counts 46 implementations, and the port splits into a FRAMEWORK (reading system/ or constant/fvOptions, the selectionMode cell selection, and the three hooks UEqn.H/pEqn.H use -- fvOptions(U) as a source, fvOptions.constrain(UEqn), fvOptions.correct(U)) plus individual sources. The three refused tutorials need three different ones: explicitPorositySource/DarcyForchheimer (simpleCar), rotorDiskSource (rotorDisk) and actuationDiskSource (turbineSiting), so the framework buys nothing on its own. THE FRAMEWORK AND explicitPorositySource ARE NOW PORTED. The framework reads system/ or constant/fvOptions, resolves the selection through the EXISTING cellSetOption port (cell_selection.cuh, written for MRF and reused rather than rewritten), and applies UEqn.H's `== fvOptions(U)`; fvOptions.constrain(UEqn) and fvOptions.correct(U) are NOT implemented for any option. Any option whose TYPE is not ported is refused BY NAME -- reading the framework as `fvOptions is supported` would be precisely the silent substitution this guard exists for, and ofscan counts 46 fv::option implementations. THE SIGN passes through two negations that cancel: explicitPorositySource does `eqn -= porosityEqn` and simpleFoam writes `UEqn == fvOptions(U)`, so the net effect is the porosity equation as written -- diag += V*tr(Cd), source -= V*((Cd - I*tr(Cd))&U) with Cd = nu*D + |U|*F. Applying one negation and not the other gives a porosity that ACCELERATES the flow, so the unit test asserts a positive diagonal explicitly. Other transcription points: the 0.5 lives in F (calcTransformModelData's forchCoeff), NOT in the resistance; and DarcyForchheimer looks up the field NAMED `nu`, the LAMINAR viscosity, not nuEff -- using nuEff would make the Darcy resistance scale with the turbulence model. On the device the coordinate system must be IDENTITY: the existing deviceFvoPorosity kernels take diagonal d/f, so a rotated coordinateSystem is REFUSED rather than having its off-diagonals dropped. UNIT (ctest fvoptions_cpp, on simpleCar's mesh): the cellZone resolves to exactly the 10 cells OpenFOAM's own topoSet reports (12750-12759), D.xx = 5e7 with d.y = -1000 keeping its sign, D diagonal under an identity system, and the resistance matches DarcyForchheimerTemplates.C to 6.8e-18 on the diagonal and 3.3e-21 on the source, with the 12930 cells outside the zone left untouched. END-TO-END (ctest fvoptions_vs_openfoam) IS NOT ON simpleCar, and the reason is a finding in itself: brae disagrees with OpenFOAM on simpleCar by U 5.05e-01 (L2) with the fvOptions file REMOVED FROM BOTH, and the SHIPPED driver disagrees identically (5.05e-01) -- so this is a pre-existing, brae-wide disagreement on that case, not something this port introduced, and simpleCar can say nothing about the porosity until it is understood. Its U boundary conditions (pressureInletOutletVelocity, surfaceNormalFixedValue, uniformNormalFixedValue) are all implemented and brae throws on genuinely unknown types, so silent BC substitution is ruled out; the cause is LOCALISED, and the elimination is worth keeping because most of it was cheap. NOT the porosity (the disagreement is identical with fvOptions removed from both). NOT the rebuild (the SHIPPED driver disagrees identically, 5.05e-01). NOT the mesh harness (simpleCar's Allrun runs createPatch -overwrite, which the first attempt skipped; meshing it properly gives the same 5.04e-01). NOT the `ramp` on surfaceNormalFixedValue, which brae deliberately ignores -- OpenFOAM with and without the ramp agree to 2.2e-04. NOT surfaceNormalFixedValue and NOT pressureInletOutletVelocity: replacing airIntake with a plain wall and the outlet with zeroGradient IN BOTH leaves 5.05e-01. NOT OpenFOAM being unconverged -- although it was: at t=2000 its Ux residual is 2.7e-05 and its own answer still moves 9.4e-02 by t=20000, where the residual reaches 1.5e-08; brae is 5.15e-01 from THAT. IT IS THE PRESSURE EQUATION. Restarting brae from OpenFOAM's t=20000 converged fields, the first-iteration residuals are p 1.2e-01 against U 2.6e-03, and brae moves 29% away within 50 iterations -- so OpenFOAM's solution is not a fixed point of brae's pressure equation on this mesh. THE MESH is what distinguishes the case: simpleCar is max non-orthogonality 44.6 degrees (average 11.9) with max skewness 2.30, against pitzDaily's 5.95/1.63 and skewness 0.26. The nonorth gate's shearedChannel is a UNIFORM 30.96 degrees with skewness 1.5 and brae matches OpenFOAM there to 3.1e-05, so plain non-orthogonality is not sufficient to reproduce it -- the untested regime is the combination of a high-angle TAIL (44.6 max over an 11.9 average) with skewness above 2, and `nNonOrthogonalCorrectors 0` means the deferred correction gets a single pass. RULED OUT as the cause: the geometry primitives, all four of which match OpenFOAM's formulas exactly -- weights SfdNei/(SfdOwn+SfdNei) with the Sf-projected distances (surfaceInterpolation::makeWeights), deltaCoeffs 1/|delta|, nonOrthDeltaCoeffs 1/max(n.delta, 0.05|delta|), and correction vectors n - delta*nonOrthDeltaCoeffs. STILL OPEN, and it affects the SHIPPED solver, not just this port. THE _cpp REFERENCE DISAGREES TOO, which redirects the search and which the first pass MISSED by chasing simpleCar entirely through the CUDA path: diag_simple_loop from OpenFOAM's converged fields gives _cpp U 6.13e-01, old-host 5.97e-01 and CUDA 5.96e-01, all three together. So the defect is in the TRANSCRIPTION of OpenFOAM into the _cpp reference, not in the CUDA port of it -- which is the order this port is supposed to establish first, since nothing downstream can be right if _cpp is not. THE MESH-ANGLE HYPOTHESIS IS REFUTED. Sweeping shearedChannel's shear (its top-edge offset over a 0.1 height, so the angle is one parameter) against a freshly-run OpenFOAM at each level, U on the _cpp path: 30.96 deg/skew 1.5 -> 3.12e-05, 45/2.5 -> 4.85e-05, 56.3/3.75 -> 5.38e-05, 63.4/4.0 -> 1.75e-04, 68.2/3.45 -> 1.26e-03. The error does grow with angle, but even at 68 degrees with skewness 3.4 it is 1.3e-03 -- about 400x smaller than simpleCar's 5e-01 on a 44.6 deg / 2.30 mesh. Uniform shear does not reproduce it, so `non-orthogonality plus skewness` is NOT the cause. The sweep also has _cpp and CUDA tracking to four digits at EVERY level (3.1195e-05 vs 3.1180e-05, and so on), independent confirmation that the CUDA port is faithful across the whole range. A LAMINAR simpleCar cannot isolate the turbulence either: at nu 1e-5 and 10 m/s the case is physically unsteady and OpenFOAM itself does not converge (p residual stuck at 0.24 after 3000 iterations); brae additionally goes NaN there, a robustness difference on an ill-posed case rather than a usable control. Ruled out so far: the porosity, the rebuild-vs-shipped split, the mesh harness, the ramp, surfaceNormalFixedValue, pressureInletOutletVelocity, OpenFOAM non-convergence, mesh angle and skewness, and the four geometry primitives. RETRACTION: the claim that the _cpp reference disagrees on simpleCar is WRONG and is withdrawn. diag_simple_loop runs LAMINAR by construction (dctl.turbulent = false, nuEff = nu everywhere -- it was built for the laminar shearedChannel non-orth work), so that measurement compared a laminar brae against a kEpsilon OpenFOAM reference. An unequal comparison, the same class of error the diagnostic's own header warns about. THE CAUSE IS THE TURBULENCE MODEL, established by removing it from the comparison rather than by reasoning about it. tests/resid_probe.cu takes OpenFOAM's converged fields INCLUDING ITS OWN nut, sets nuEff = nu + nut, and runs brae's _cpp SIMPLE loop with in.turb = nullptr so kepsilon::correct never executes. On simpleCar that converges BACK to OpenFOAM: U 2.76e-02 and p 3.14e-02 in the max norm after 300 iterations, against 5.9e-01 and 9.8e-01 when brae runs its own turbulence. So the momentum and pressure transcription is CORRECT on this mesh, including the non-orthogonal correction, and the disagreement is entirely in the k-epsilon model. Consistent with the converged fields: k, epsilon and nut are all ~97-99% different while U is 50%. A note on what does NOT diagnose this: the pressure equation's residual at a converged SIMPLE state is a cancellation and is LARGER on pitzDaily (3.70e-01), where brae agrees to 5e-03, than on simpleCar (1.82e-01), where it does not -- so that residual cannot be used to rank cases, only the frozen-nut experiment settles it. A kEpsilon _cpp REFERENCE NOW EXISTS (kEpsilon_cpp.cu, transcribed from kEpsilon.C) -- it was the one turbulence model wired straight to CUDA without one, and it is the one that turned out to be wrong. It carries a residuals out-parameter and a diagnostic term mask so a disagreement can be bisected. ONE REAL DEFECT FOUND AND FIXED: the epsilon/nut wall treatment was keyed on the MESH PATCH TYPE (fvp[pi].type == \"wall\") where OpenFOAM keys on the BC TYPE -- createAveragingWeights counts the faces whose epsilon field carries an epsilonWallFunction. The two coincide on pitzDaily, whose walls carry the wall function explicitly, which is why it survived this long. They do NOT coincide on simpleCar: its 0/epsilon sets \"(body|upperWall|lowerWall)\" to epsilonWallFunction and then a trailing \".*\" entry overrides it to zeroGradient. OpenFOAM resolves that the same way brae does -- last matching regex wins, confirmed by OpenFOAM's own written 20000/epsilon showing `type zeroGradient` on body -- so OpenFOAM applies NO epsilon wall function there and brae was applying one on three patches. Same story for nut, whose nutkWallFunction is overridden by a \".*\" calculated entry. Fixed by adding EpsilonWallFunctionPatchField and an isEpsilonWallFunction() discriminator (brae had mapped the type to plain zeroGradient, losing the distinction). 27/27 scoped tests still pass. Effect on simpleCar: 5.04e-01 -> 4.91e-01, so it is a genuine defect but NOT the dominant one. A SECOND GAP found and measured as inert here: the k and epsilon equations never had `bounded` wired, though simpleCar asks for `bounded Gauss upwind`; adding it changes the residual by nothing (4.2293e-02 either way), as expected for a term that vanishes where phi is conservative. THE BAD TERM IS NOT PINNED. A term bisect over the epsilon equation -- dropping the production, the divU SuSp, the destruction and the diffusion in turn -- makes the residual WORSE in every case on simpleCar (6.4e-01, 4.2e-02, 6.3e-01, 2.1e-01 against 4.2e-02), so every term is doing useful work and no single one is wrong. CAVEAT on the headline number: the probe runs UNRELAXED while OpenFOAM's logged residual is on the relaxed matrix, so the 4300x ratio against OpenFOAM's log is inflated; what is like-for-like is pitzDaily 9.3e-06 against simpleCar 4.2e-02 under identical probe settings. A THIRD DEFECT, found while chasing the second and worth its own line because it actively misleads: the field WRITER emits each boundary patch's INPUT specification rather than the computed boundary values. brae writes `nut ... value uniform 0` on pitzDaily's upperWall, where the nutkWallFunction certainly produced something else, and the same on simpleCar's body. That is not a solver error -- the momentum path takes its boundary nuEff from deviceBoundaryNut, not from the file -- but every written boundary field is unusable for comparison against OpenFOAM, and it cost a full investigation branch here: OpenFOAM's `calculated` nut on simpleCar's body carries 0.6-2.5 while brae's file said 0, which looked exactly like the defect being hunted. It is not: for a zeroGradient k and epsilon, OpenFOAM's assignment Cmu*k_b^2/eps_b reduces to the adjacent cell's nut, which is what deviceBoundaryNut already supplies for a non-wall face (and the kernel even carries calcMask/kBnd/epsBnd parameters for the general case). THE BAD TERM REMAINS UNPINNED after three defects found. The gate therefore BUILDS its case -- pitzDaily, which brae reproduces to ~5e-03 on U, with a topoSet porous cellZone cut out of the middle -- so the porosity is the only variable. Result: U 5.29e-03 and p 2.72e-02 with the porosity against 1.62e-02 and 1.66e-01 without it, i.e. 3.1x and 6.1x, which is the control. RAS/kEpsilon passes the envelope check and the hook IS now wired to deviceKEpsilonCorrect: the hook also owns the nuEff refresh (nu + nut, boundary value from deviceBoundaryNut's wall function, never the owner cell), which is what makes the lagged coupling work without the driver knowing the model. CONVERGENCE GAP -- FOUND AND FIXED. The CUDA driver allocated its PressureMatrix and folded diagonal fresh every iteration while the AMG hierarchy -- and the V-cycle/PCG graph caches keyed on that fine matrix -- persisted across iterations. Iteration 1 was exact (dU 8.2e-14 from identical inputs) and iteration 2 was wrong by 1.3e-01, with EVERY per-stage test still passing at 1e-16. Fixed by holding the pressure buffers in SolverWorkspace, matching how device_simple_foam.cu keeps them as members. All four drivers (old host, old GPU, _cpp, CUDA) now agree over 60 iterations (iter 59: 2.9136e-02 / 2.914e-02 / 2.91e-02 / 2.91e-02) and the rebuilt solver converges end-to-end: 1.0 -> 0.391 -> 0.0615 -> 0.0284 over 60 iterations. Regression: tests/test_simple_step_cuda.cu gained a multi-iteration mode (ctest simple_step_cuda_loop, 10 iterations, tight solves) -- verified to FAIL (U 1.5e-01, p 3.7e-01) when the buffers are made transient again. TWO EARLIER DIAGNOSES IN THIS INVESTIGATION WERE WRONG and are retracted: the host-vs-GPU 'convergence gap' was a sampling artifact (reading lines 1/5/10/20 of an oscillating series), and the 'HbyA wrong by 42%' was a reference rebuilt without the momentum predictor. Ruled out on the way: bounded, the non-orthogonal correction, solver tolerances, deviceGaussGrad (4e-15), AMG face-weight slicing (no effect -- internal faces already come first). Found and fixed as genuine silent-substitution holes in the envelope guard: `bounded` and the non-orthogonal laplacian correction."

  cuda_vs_reference:
    openfoam:
      symbol: (brae-specific)
      file: "-"
    classification: GPU_REQUIRED
    brae_status: REVALIDATE_EXISTING
    brae_existing: "src/cuda/device_simple.cu, src/cuda/device_fvm.cu"
    brae_target: src/applications/solvers/simpleFoam/
    validation: "tests/test_gpu_vs_cpp.cu -- CUDA against the _cpp reference at STAGE granularity, run on BOTH a laminar case (matrixDumpAsym/282) and a TURBULENT one (pitzDailyTurb/1576, nuEff varying per cell and per boundary face). PRESSURE: rAU 1.5e-16, laplacian upper/lower 0 diag 1.4e-16, pEqn.flux() 0, setReference 0. MOMENTUM: div(phi,U) upper/lower 0 diag 4.6e-18, divDevReff source 4.8e-15/5.6e-16/2.4e-16, H(U) 3.8e-16/2.3e-16/2.4e-16, phiHbyA 0, corrector 0. TURBULENCE: GbyNu 7.6e-17, nut 0. Three controls fire."
    note: "Closes the chain OpenFOAM -> _cpp -> CUDA. Every other GPU test compares the device against CPU code written inline in that same test, which proves consistency but not correctness. Running on a turbulent case as well is what makes it load-bearing: with constant nuEff a kernel that mishandles a per-face diffusivity, or reads the owner cell's value on a wall instead of the patch value, still agrees perfectly. NOT yet compared this way: the linear solves themselves, the wall functions (G0/eps0), and the k/epsilon transport assembly."

  deterministic_assembly:
    openfoam:
      symbol: (brae-specific)
      file: "-"
    classification: GPU_REQUIRED
    brae_status: REUSE_EXISTING
    brae_existing: src/matrices/lduMatrix/lduMatrix/reductions.cu
    brae_target: src/matrices/lduMatrix/lduMatrix/
    validation: "tests/determinism_gate.sh -- pitzDaily (kEpsilon) and pitzDailyKOmega bit-identical over two runs; verified to 200 iterations, plus airfoil and backwardFacingStep2D. Carries a 1-ULP negative control."
    note: "DONE for the incompressible simpleFoam path. Was 3.6e-02 after 20 iterations, now 0. Three scatter sites, all converted to fixed-order gathers: AMG restriction (rc[map[c]] += r[c], hit every level of every V-cycle of every PCG iteration), the turbulence wall functions (cells with >1 wall face), and the eps setValues constraint (cells with >1 constrained face). The last two are RARE -- bit-identical at 1/5/8/10/15 iterations and different at 12 -- so intermittency, not just a systematic offset, is what the gate has to catch. STILL OPEN: the opt-in BRAE_AMG_SA path still scatters, and the cyclic/AMI (42 sites) and distributed (device_halo) paths are untouched."

validation_cases:
  pitzDaily:
    path: /usr/lib/openfoam/openfoam2412/tutorials/incompressible/simpleFoam/pitzDaily
    derived_selection_sites: 47
    derived_unresolved: 0
    derived_required_implementations:
      - {category: boundary, keyword: calculated, resolves_to: calculated}
      - {category: boundary, keyword: empty, resolves_to: emptyPolyPatch}
