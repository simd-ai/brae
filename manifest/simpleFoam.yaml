    note: "All 12 coefficients are read via dimensioned<scalar>::getOrAddToDict -- see the derived schema below. nut = nuTilda*fv1 on `calculated` patches was a past defect. THE DEFECT THAT MATTERED was not in the SA equation at all -- that was within 13% of OpenFOAM's residual from the first run. It was nut's WALL value: correctNut writes nut_ = nuTilda*fv1 as a FIELD ASSIGNMENT, nuTilda is fixedValue ZERO at a wall, so the assignment leaves nut_wall = 0 -- and OpenFOAM's correctBoundaryConditions() then lets nutUSpaldingWallFunction overwrite it with Spalding's law (~4.5e-03 here). Taking the assignment removes the wall's whole eddy viscosity and with it the wall shear; 25% of the momentum residual sat on 78 wall faces, and fixing it moved the end-to-end agreement 268x on U, 598x on p and 35x on nuTilda in ONE step. Two boundary defects were fixed on the way (the freestream valueFraction was never recomputed from the flow angle, and mixed evaluate() took refValue instead of OF's lerp blend), worth 372x -> 47x on momentum and 3551x -> 136x on pressure between them. RULED OUT along the way, each by measurement: the coefficients (OpenFOAM prints them, all match, ft2 inactive); Omega = sqrt(2)*mag(skew(gradU)) on a unit shear; the wall distance (meshWave against brute force, 1.0e-04 mean over 10720 cells); and the linearUpwind correction's sign (upwind 0.162, brae 0.250, flipped 1.72, OpenFOAM 0.380). CUDA: PORTED but NOT YET MATCHING the _cpp. Five modules, each measured on airFoil2D at OpenFOAM's converged 500 (OF: U 5.36e-06, p 7.51e-05, nuTilda 1.23e-03): (1) the model on the k slot -- U 4.56e-03, p 1.00e-01, nuTilda 1.85e-02; (2) linearUpwind on div(phi,nuTilda) -- nuTilda 7.67e-03; (3) the freestream valueFraction (deviceUpdateMixedFreestream) -- U 2.11e-03, p 1.35e-02; (4) the Spalding wall nut -- U 1.34e-04, p 1.88e-03; (5) inletOutlet resolved per iteration. END TO END it reaches U 1.2e-02, p 3.3e-02, nuTilda 3.4e-01 against the _cpp's 6.2e-05 / 7.5e-05 / 1.3e-02, so it is NOT gated yet. The SA terms themselves are NOT the cause: dumped cell by cell (BRAE_DUMP_SA vs BRAE_DUMP_SA_CPP), gradNt2 is identical to 2.4e-11 and every formula matches. CUDA IS NOW GATED (tests/sa_cuda_vs_openfoam.sh): END TO END from 0/ it reaches U 5.99e-05, p 5.24e-05, nuTilda and nut 1.22e-02 against OpenFOAM's converged 500 -- matching the _cpp reference (6.20e-05 / 7.54e-05 / 1.28e-02) -- with a laminar control that fails at 1.20e-01 / 3.54e-01. THE COLD START was the whole of it, and no fixed-point comparison could have found it: assembled at OpenFOAM's own fields the two momentum matrices are BIT-IDENTICAL (tests/ueqn_localize.cu, 6.904985e-05 on both with the same patch split, at t=0 as well as t=500), so the difference was never in the assembly but in the nuEff BOUNDARY handed to it. Three defects there: nut = nuTilda*fv1 is a FIELD ASSIGNMENT and the device took the adjacent cell instead (2.88e-01 out at the outlet); deviceBoundaryNutSpalding rewrites EVERY face and replaced the non-wall ones with the cell value unless handed `nutFile`; and deviceBoundaryNut overwrote the boundary buffer each iteration with cell values, DESTROYING the previous wall nut that Spalding's Newton warm-starts from. OpenFOAM seeds it from nut_ itself; a cold start with 10 iterations and a 1% early-out settled 14% low, and that alone took the run from U 1.20e-02 to 5.99e-05 -- from 200x worse than the _cpp to matching it. RULED OUT by measurement along the way: the solver tolerances (tightening every solve from the case's relTol 0.1 to relTol 0 leaves the answer bit-identical), the wall distance (nearWallDist and 1/deltaCoeffs coincide here at 9.027330e-02), and the linearUpwind correction (forcing upwind moves the momentum residual 1.34e-04 -> 7.99e-03, so it is applied)."
