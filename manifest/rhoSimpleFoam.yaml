    note: "OpenFOAM has ONE templated kEpsilon.C; the compressible instantiation supplies alpha=1, rho as a field, alphaRhoPhi as the MASS flux and a nu that varies with T. TWO FLUXES, not one: fvm::div takes the mass flux while divU takes the VOLUMETRIC one, because compressibleTurbulenceModel::phi() divides by interpolate(rho). Four defects were found by reading the instrumented model's numbers rather than by reasoning -- the closure never being given the flux (so fvc::grad(U) read a stale outlet face value), k and epsilon never having updateCoeffs called (so every flux-conditional patch contributed nothing), the turbulent inlets being frozen at the case file's `value` instead of recomputed from U and k, and the diffusion terms being assembled orthogonally while the case asked for `corrected`. See PORT.md."

