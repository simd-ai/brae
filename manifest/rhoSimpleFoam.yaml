    note: "fvm::div(phi,U) + MRF.DDt(rho,U) + turbulence->divDevRhoReff(U) == fvOptions(rho,U), solved against -fvc::grad(p). divDevRhoReff is the COMPRESSIBLE form (rho-weighted, dev2 transpose term) and is NOT the incompressible divDevReff that simpleFoam uses. TARGET IS rhoUEqn.cu, NOT UEqn.cu: brae puts every source directory on ONE include path, so a companion UEqn.cuh here would resolve to simpleFoam/UEqn.cuh or the reverse, whichever the compiler saw first. simpleFoam already owns UEqn.cuh and pEqn.cuh. The host references are already rhoUEqn_cpp/rhoPEqn_cpp/rhoEEqn_cpp for the same reason; the device targets follow them."

