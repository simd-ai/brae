    validation: "tests/leastsquares_grad_vs_openfoam.sh -- the GRADIENT itself, SCALAR and VECTOR arms on an orthogonal mesh AND a pitzDaily arm whose boundary faces are SKEWED (fvPatch::delta() is the patch-normal projection of Cf - Cn, not Cf - Cn: brae used the raw vector and an orthogonal mesh cannot tell the two apart -- 1.18e-01 vs 1.84e-12 on pitzDaily, 4.6e-15 either way on squareBend). Scalar and vector arms, against OpenFOAM's own grad(T) and grad(U) on validation/rhoSST, each a 2x2 with the other scheme as the control: brae leastSquares vs OF leastSquares 2.5e-13 (scalar) and 2.3e-13 (vector), against OF Gauss linear 2.5e-01, and OF leastSquares against brae Gauss 3.3e-01 (device scalar 2.5e-13, device-vs-host 1.6e-16; no device twin for the vector form yet). tests/rho_leastsquares_closure_vs_openfoam.sh -- the CONSUMERS, nine arms on the host arm end to end against real OpenFOAM: the closure's CDkOmega and corrected-laplacian gradients, the turbulence limiters' own gradient, grad(p) and grad(U), each restarted from OpenFOAM's own iteration 5 and each measured separately (before -> after: k 3.1e-06 -> 8.7e-12, 1.7e-05 -> 2.9e-12, 3.6e-06 -> 2.9e-12), with the shipped case as the control, a wrong-scheme control (brae's Gauss against OpenFOAM's leastSquares run must differ, 6.3e-08). Two fail-proofs, each watched: divDevRhoReff's flag removed, and the limiter's gradient back to Gauss -- different arms go red. CUDA, the CLOSURES' grad(k)/grad(epsilon|omega): test_rho_kepsilon_cuda's leastSquares arm against the host closure on pitzDaily (`corrected` laplacians, so the correction path is live) epsilon 7.9e-16, k 8.4e-16, nut 2.7e-15, with the Gauss device answer 3.36e-03 off the leastSquares reference (the control); rho_leastsquares_closure_vs_openfoam.sh's lsq arm now runs the CUDA arm against OpenFOAM, worst p 2.9e-12 (the same floor as the host and as the shipped control). CUDA, grad(p) at its five consumers (RhoStepInput::gradPLeastSq): the closure gate's lsqp arm (grad(p) leastSquares explicit on rhoSST) host 2.900e-12, CUDA 2.901e-12 vs OpenFOAM, the shipped Gauss run 1.42e-05 off the leastSquares oracle; tests/rho_step_cuda_lsq.sh (rhoKE and sbMatched, in-gate Gauss control 1.4e-05 / 4.7e-03); and tests/rho_gradp_lsq_simplec_vs_openfoam.sh, the SIMPLEC+transonic case nothing else covers: both arms 2e-11 of OpenFOAM at iterations 1-2 with the shipped control at the same floor and OpenFOAM's own two schemes 1.6e-02 apart. THAT GATE FOUND A HOST DEFECT: the device arm was 5.7e-12 of OpenFOAM and the host 1.98e-09, because fvc::snGrad's non-orthogonal correction (SIMPLEC's phiHbyA term, pcEqn.H:27) took a hardcoded Gauss gradient where correctedSnGrad.C:52-55 resolves grad(p)'s own entry -- invisible on rhoSST (not SIMPLEC) and at iteration 1 of sbMatched (p uniform). Fixed in fvc.cu (snGrad takes the field's scheme); 2.02e-11 after. CUDA, the VECTOR form (deviceLeastSquaresGradU: three scalar fits packed as grad(U), leastSquaresGrad.C's lsGrad += ownLs*deltaVsf): leastsquares_grad_vs_openfoam's device twin 9.4e-15 of OpenFOAM's own grad(U) on sbMatched and 4.2e-13 on pitzDaily, device-host 1.5e-16; its consumers -- divDevRhoReff's dev2 term, the corrected laplacian, the limitedLinearV limiter and the linearUpwind-named gradient (rho_ueqn_cuda_lsq, sources 8e-16 of the host), both closures' production (test_rho_kepsilon_cuda's grad(U) arm: GbyNu 5.5e-16, the Gauss GbyNu 5.0e-01 off as the control) -- and end to end rho_leastsquares_closure_vs_openfoam's restart arms now on BOTH mirror arms: lsq_none/CUDA p 2.85e-12, lsq_all/CUDA (`default leastSquares` with every limiter) omega 2.46e-11 against the host's 2.45e-11."
    note: "OpenFOAM's inverse-distance least-squares fit (leastSquaresVectors.C), not a Gauss sum; a case naming it gets it or is refused. fvc::grad(vf) resolves `grad(<name>)` through gradSchemes (fvcGrad.C:149), so `default leastSquares` reaches every consumer: the limitedLinear limiters' gradient in the energy equation (reached by default) and in both turbulence closures' divWithScheme (LimitedScheme.C:51-55), kOmegaSST's CDkOmega and the k/omega|epsilon corrected-laplacian corrections (gradKLeastSq), grad(p) (the velocity correction pEqn.H:86 / pcEqn.H:99, SIMPLEC's HbyA pcEqn.H:30,65, the non-orth corrections) and grad(U) (divDevRhoReff's dev2 term, the closures' production, validate()'s correctNut) -- the VECTOR form, lsGrad_ij = ownLs_i*deltaVsf_j, sharing one leastSquaresInvDd with the scalar one. Four of those consumers computed the Gauss gradient under the case's own scheme name until this. The DEVICE computes the scalar form (deviceLeastSquaresGrad): the energy limiters' gradient, both closures' limiter gradient, the closures' corrected-laplacian correction (turbulence_transport.cu, TransportScheme::gradFieldLeastSq) and kOmegaSST's CDkOmega (kOmegaSST.cu) take it under the case's scheme, and so do grad(p)'s five consumers (the momentum source, U = HbyA - rAtU*grad(p), SIMPLEC's HbyA correction, both pressure branches' non-orth corrections), the energy equation's non-orth correction (rhoEEqn.cu, grad(he)'s base and cellLimited coefficient) and grad(U)'s VECTOR form at divDevRhoReff, the corrected laplacian, the momentum limiters and both closures' production (deviceLeastSquaresGradU) -- the CUDA mirror arm refuses nothing of leastSquares any more; the linearUpwind-NAMED gradient under leastSquares is refused by the shared parse on both arms, and so is any limiter brae does not apply (cellMDLimited, faceLimited, faceMDLimited) on grad(U), grad(p), grad(magSqr(U)), grad(he) and grad(Ekp|K) -- the parse recorded it and the shared reader only warned, so the unlimited gradient ran under the case's scheme name (tests/eeqn_limitedlinear_vs_openfoam.sh's cellMDLimited arm). A cellLimited grad(p) (parseFieldGradScheme's cellLimitK for p, applied nowhere until this) now limits every grad(p) consumer on both arms, fvc::snGrad's correction included -- tests/rho_gradp_lsq_simplec_vs_openfoam.sh's lim arm, sbMatched with `grad(p) cellLimited Gauss linear 1`: host 2.02e-11, CUDA 2.48e-11 of OpenFOAM where OpenFOAM's own Gauss and cellLimited runs are 5.4e-02 apart (the limiter bites; the unlimited arms equal the Gauss run, so that number is the fail-proof). OPEN: the incompressible simpleFoam pEqn_cpp.cu calls fvc::snGrad without the scheme argument and so still builds SIMPLEC's correction from Gauss under a leastSquares grad(p). The non-orth corrections and the gradient linearUpwind NAMES are ported but not exercised by rhoSST (orthogonal laplacians, upwind divs). SPEED, FP-3 (bench/rhoSimpleFoam/FASTPATH.md, 2026-09-12), all three levers bit-identical end to end -- a reference binary with the FP-3 files at HEAD against the new one wrote byte-identical fields and residual lines on injectorPipe and squareBend: (1) THE INVERTED dd TENSOR IS THE MESH'S, not the gradient call's. OpenFOAM builds leastSquaresVectors once per mesh as a MeshObject and invalidates it on a move; brae rebuilt it inside every call -- on gasMixing/injectorPipe at 74,650 cells that was 10 lsqInvDdKernel launches and 1.99 of the iteration's 15.79 GPU ms. It now lives on the DeviceMesh (lsqInvDdFor, dropped in refreshDeviceMeshGeometry where OF invalidates its MeshObject), 0.01 ms/it; BRAE_LSQ_INVDD=recompute restores the rebuild. (2) THE FUSED FIT, deviceLeastSquaresGradFused, up to three fields in one launch -- the least-squares twin of deviceGaussGradFused, held to memcmp per field by tests/test_lsq_grad_fused.cu (ctest lsq_grad_fused; n=1,2,3, sheared and empty-patch meshes, one-ulp cross-contamination controls, the cache's per-mesh control; fail-proof RUN, 10 arms red). Its raw form writes into caller-owned slices, so deviceLeastSquaresGradU fills the 9*nC grad(U) tensor in ONE launch where it took three fits, nine device-to-device copies and three cudaStreamSynchronize. (3) ONE GRADIENT PER (base scheme, cellLimited coefficient) PAIR an assembly asks for: the limitedLinear limiter, linearUpwind's correction and the corrected laplacian all read the case's grad(<field>) entry, so the energy assembly fitted grad(he) twice and each closure its own field twice. Net on injectorPipe: 15.79 -> 13.73 GPU ms/it, four phases 19.1 -> 17.3 ms/it wall, EEqn 3.4 -> 2.8 and turbulence 4.5 -> 3.6. The row's UEqn target (40 ns/cell) is NOT met at 56: that case names grad(U) cellLimited Gauss linear 0.99, so the momentum phase runs no least-squares fit at all and its cost is cellLimitGradKernel (FP-4)."

  fvm_ddt_closure:
    openfoam:
      symbol: "Foam::fv::EulerDdtScheme<Type>::fvmDdt"
      file: src/finiteVolume/finiteVolume/ddtSchemes/EulerDdtScheme/EulerDdtScheme.C
