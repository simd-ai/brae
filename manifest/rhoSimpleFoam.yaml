  generalizedNewtonian_compressible:
    openfoam:
      symbol: "laminarModels::generalizedNewtonian<BasicMomentumTransportModel>::correct"
      file: src/TurbulenceModels/turbulenceModels/laminar/generalizedNewtonian/generalizedNewtonian.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/TurbulenceModels/turbulenceModels/laminar/generalizedNewtonian/generalizedNewtonian_cpp.cu
    brae_target: src/TurbulenceModels/turbulenceModels/laminar/generalizedNewtonian/generalizedNewtonian.cu
    validation: "tests/rho_generalized_newtonian_vs_openfoam.sh -- OpenFOAM's own squareBendLiqNoNewtonian, both arms, against OpenFOAM's WRITTEN generalizedNewtonian:nu as well as U, p, T and rho. A: from rest, iteration 1 only (the constructor's nu_, nuMax over the quiescent field). B: restart from OpenFOAM's iteration 5 with the tutorial's coefficients, iterations 6-8 (nu_ at nuMin in every cell). C: the same restart with nuMin 1e-9, the coefficients in generalizedNewtonianCoeffs { powerLawCoeffs { } } beside the flat ones, grad(U) cellLimited -- the unclamped branch in every cell and on every patch face. Bounds 1e-10 (T, rho 1e-11) except C's interior nu_ at 5e-9, which is OpenFOAM's own floor there (OpenFOAM against itself, p solver swapped: 2.2e-10..1.1e-09). NOT CLAIMED: the tutorial from rest past iteration 1 -- its first correct() reads the round-off of a plug (strain rate ~1e-9 1/s in 21120 cells) and OpenFOAM against itself differs by U 1.04e-03 at iteration 2; a converged comparison (nu_ = nuMin everywhere, a constant viscosity) is not run; viscosity models other than powerLaw are refused by name."
    note: "The model REPLACES the molecular viscosity: nuEff() is nu_ and linearViscousStress assembles rho_*nu_, cells and patch faces, with nu0 = mu/rho_ (the SOLVER's rho). nu_ is STORED: built by the constructor from the initial U, rebuilt only in correct() at the end of the iteration. Its patch values are the formula on the patch values of nu0 and strainRate, and strainRate's come from gaussGrad's boundary correction -- the wall shear. The gate found a generic restart defect before it could see the model: brae's inletOutlet/outletInlet/freestream took their construction value from inletValue where OpenFOAM keeps the file's `value`. See PORT.md, Stage S1 Half B. THE DEVICE ARM CARRIED THE SAME DEFECT until the gasMixing/injectorPipe restart gate reached it (tests/rho_gasmixing_vs_openfoam.sh): buildDeviceBoundary seeded an inletOutlet face as fixedValue(inletValue), so every evaluate before the first flux switch -- the closure's stored-patch-value reconstruction at its first step -- returned inletValue; measured as the epsilon equation's off-diagonals 1.6e-04 off the host with 100% of it on outlet-adjacent faces, and 8.8e-04 on the two turbulent inlets when seeded zeroGradient instead. DeviceBoundary::ioStored now carries the file's `value` (the host patch field's, extrapolated where absent) and ioFresh marks it until deviceUpdateInletOutlet first runs (inletOutletFvPatchField.C's dictionary constructor: valueFraction 0, readValueEntry or extrapolateInternal). Both boundary builders. After it the CUDA arm sits at 1.2e-11 of OpenFOAM's own restart over iterations 6-8, the host at 2.0e-11. The seed is taken by the CLOSURE boundaries (buildDeviceBoundary's storedIoSeed, dbK and dbEps in rhoCreateFields.cu) and is INERT on the solver fields: nothing evaluates U/p/he/T's inletOutlet faces before the step's first flux switch, and with BRAE_IO_STORED_SOLVER=1 neither mirror arm changes a digit. MEASURED CLOSED by tests/rho_naca_restart_vs_openfoam.sh (aerofoilNACA0012: kOmegaSST, inletOutlet T/k/omega, freestream U/p, restarted from OpenFOAM's iteration 100 under the gasMixing protocol): host and CUDA both 1.8e-09 of OpenFOAM's own restart (p at the first restarted iteration, <= 2.2e-10 elsewhere), CUDA vs host <= 5.2e-13; at the case's own tolerances the arms read 2.5e-05 apart, solver stopping points. The 1.16e-03 that validation/restart_vs_openfoam.sh once read with a seed was the PRE-MIRROR driver (which that gate runs, BRAE_RHOSIMPLEFOAM_MIRROR unset) under the outletInlet/freestreamPressure seed, no longer taken for any field. BRAE_IO_STORED=0 disables the seed everywhere (the control)."

  PatchFunction1Expression:
    openfoam:
      symbol: "PatchFunction1Types::PatchExprField<Type>::value"
      file: src/finiteVolume/expressions/PatchFunction1/PatchFunction1Expression.C
    classification: HOST_ONLY
    brae_status: PORTED
    brae_reference: src/finiteVolume/expressions/PatchFunction1/patchExprFunction1.cu
    brae_target: src/finiteVolume/expressions/PatchFunction1/patchExprFunction1.cu
    validation: "tests/rho_patch_expression_vs_openfoam.sh -- squareBendLiq's own T walls, `type expression` with its variables and functions<scalar> table verbatim, both mirror arms against OpenFOAM's WRITTEN wall values iteration by iteration and the cells alongside (solvers tightened to 1e-14 relTol 0 on both codes, since the expression reads |U_c| after the momentum solve). Walls at iteration 1: host 1.21e-13, CUDA 1.21e-13 (22400 distinct values around 500.003); iterations 2-3 exactly 0 (both 500); cells over 1-3 1.86e-12 on both arms. Bounds 1e-12 walls, 1e-11 cells. THE CONTROL is a `constant 500` wall on the host arm, which the same comparison rejects at 3.63e-07 -- six orders above the bound. Also asserted: the oracle is non-uniform and above 500 at iteration 1; brae's written T carries the dictionary and OpenFOAM restarts from it; six refusals by name (sqrt, a functions<scalar> entry referenced, an unregistered field, the expression on U, on p, and the entry-less form). tests/test_patch_expr.cu covers the grammar without OpenFOAM: precedence and associativity as operator-precedence.m4 declares them, lookups in OpenFOAM's order, Foam::max's NaN side, mag() of a vector, 17 refusals by name. tests/rho_tutorials_vs_openfoam.sh now RUNS squareBendLiq on both arms (1.9e-12)."
    note: "THE SUBSET, and nothing else: numbers, + - * /, unary minus, parentheses, identifiers that are `variables` entries or registered fields (the PATCH value, getField), internalField(x), snGrad(x) (the patch class's own virtual on the host; the fixedValue formula on the CUDA arm for the patch's own field only), mag(vector), max, min, time(), deltaT(), arg(), pi(). OpenFOAM's grammar has ~60 more rules; every other token -- another function, a comparison, ?:, .x component access, vector arithmetic, a functions<> entry referenced, name{where} remote variables -- is refused BY NAME at parse or first evaluation. WHERE IT IS EVALUATED is the port: uniformFixedValue::updateCoeffs runs inside fixedEnergy::updateCoeffs -> Tw.evaluate(), once per iteration (the first fvm:: term's fvMatrix constructor; later ones find updated()), over U AFTER the momentum solve and T's cells and T's own patch value from the previous iteration -- so both steps evaluate it immediately before energy_boundary's updateEnergyBoundaryCoeffs. On T ONLY: an expression on any other field is refused by name (that field's own updateCoeffs is where OpenFOAM would evaluate it, and no brae step reproduces that); the entry-less form (no `value`) is refused because OpenFOAM evaluates it at construction over fields brae has not built. The CUDA arm evaluates the same host code on the patch's cells downloaded at the assembly and pushes the result into dbT's refValue (operator==), which deviceBCValue then exposes -- the flowRate Function1's arrangement. Foam::max is (b < a) ? a : b, so max(NaN, 0) is 0 -- transcribed, not std::max; the walls reach exactly 500 from iteration 2 because max((500 - 500.003)/500, 0) is 0 and par1*T_c*0 is 0. heBoundaryTypes dispatches on the CLASS: uniformFixedValue is a fixedValueFvPatchField, so he gets fixedEnergy seeded from T's `value`; createFields_cpp now maps it so. THE WRITER echoes the dictionary (PatchExprField::writeData echoes dict_): the functions<> tokens are re-emitted with the tokenizer's single-character delimiters bare -- quoting them made OpenFOAM's reader fail at the functionObjectTrigger's `{`. SPEED, FP-7 (2026-09-13): those downloads were WHOLE FIELDS. Every accessor of the expression context called .host() on a 112,000-cell or 22,400-face array and sliced the patch out of it, once per field the expression names, once per patch, once per iteration -- measured on squareBendLiq as ONE gap of 3.15 ms per iteration inside an energy phase whose wall is 4.9 ms and whose GPU work is 1.9. The boundary slice is now a copy of the patch's own bytes (it is contiguous), the internal values are gathered on the DEVICE (deviceGatherIndexed) into a patch-sized buffer, and each field is fetched at most ONCE per evaluation. Sizing alone halved the bytes (142.3 -> 70.4 MB per 20 iterations) and changed nothing, because it turned five big blocking copies into 74 small ones and the cost is the ROUND TRIP. The cache took the energy phase 5.8 -> 4.7 ms/it, and BATCHING took it to 3.9: the first request fills the whole cache, every registered field gathered (scattered internal values) or sliced (contiguous boundary values) into ONE device buffer read back in a single copy. Blocking copies in that phase went 8.0 -> 6.0 -> 2.0 per iteration and their API time 2.75 -> 3.03 -> 0.79 ms, with the phase 39% -> 65% GPU-busy; the four phases went 21.0 -> 19.0 ms/it, which puts squareBendLiq at 1.21x OpenFOAM on 20 cores per iteration where it was 1.08x. rho_patch_expression_vs_openfoam holds its 1e-12 walls bound throughout. Two round trips remain -- the batch coming back and the result going out -- and the second needs a pinned staging buffer to go async."

