      symbol: "kEpsilon<BasicMomentumTransportModel>::correct"
      file: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon_cpp.cu
