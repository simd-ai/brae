  kEpsilon_compressible:
    openfoam:
      symbol: "kEpsilon<BasicMomentumTransportModel>::correct"
      file: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon_cpp.cu
    brae_target: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon.cu
    validation: "tests/rho_kepsilon_vs_openfoam.sh -- against OpenFOAM's OWN kEpsilon, instrumented. tools/dumpKEpsilon is that model with writes added and its equations untouched, registered as kEpsilonDump through makeRASModel, so gradU, divU, GbyNu, G, both diffusivities, the mesh factors the laplacian coefficient is a product of, both off-diagonal sets and both assembled systems (before and after relax/boundaryManipulate) each have an oracle. On 112k-cell sbMatched at SIMPLE iteration 1, given OpenFOAM's own inputs: epsilon 5.0e-15, k 8.9e-16, nut 1.7e-15, alphat 2.3e-15, wall and interior alike, with every intermediate at the same order. THE CONTROL: substituting the MASS flux for the volumetric one in divU -- the one difference between the compressible and incompressible readings of this same templated model -- must be worse by at least 1e3x, measured 5.0e-06 against 5.0e-15. A term sweep drops each of the eight terms in turn and every one of them moves the answer. A short source array for a turbulent inlet is REFUSED by name, with a full-length array as the negative control. FVM::DDT UNDER `Euler` (kEpsilon.C:254,275): tests/rho_kepsilon_vs_openfoam.sh's Euler arm holds the assembled k and epsilon systems to 1e-14 against the instrumented model with `ddtSchemes default Euler`, and reads epsilon D() 8.0e-04 / k source 2.8e-02 with the term zeroed (the fail-proof). Found on gasMixing/injectorPipe, the one rhoSimpleFoam tutorial shipping Euler: with every input to the closure exact, its epsilon diagonal was 5.66e-04 and k source 6.14e-03 off OpenFOAM's own assembly, and OpenFOAM minus brae equalled rho*V/deltaT to 4.8e-09. rho.oldTime() in the source is the closure-time rho on a process's first step (GeometricField::oldTime() copies at first use) and the start-of-step rho afterwards -- measured 1.8e-09 and 5.6e-12 respectively, the other choice 1.3e-03 / 2.9e-04. End to end: tests/rho_gasmixing_vs_openfoam.sh, k 2.2e-12 at the first restarted iteration."
    note: "OpenFOAM has ONE templated kEpsilon.C; the compressible instantiation supplies alpha=1, rho as a field, alphaRhoPhi as the MASS flux and a nu that varies with T. TWO FLUXES, not one: fvm::div takes the mass flux while divU takes the VOLUMETRIC one, because compressibleTurbulenceModel::phi() divides by interpolate(rho). Four defects were found by reading the instrumented model's numbers rather than by reasoning -- the closure never being given the flux (so fvc::grad(U) read a stale outlet face value), k and epsilon never having updateCoeffs called (so every flux-conditional patch contributed nothing), the turbulent inlets being frozen at the case file's `value` instead of recomputed from U and k, and the diffusion terms being assembled orthogonally while the case asked for `corrected`. See PORT.md. FP-2 FUSIONS (2026-09-12): the shared conv-diff assembly (turbulence_transport.cu) subtracts the five laplacian coefficient arrays in one launch, and the device kOmegaSST closure fuses S2+production+G, CD+F1+F2, the gamma/beta blends with the GbyNu limit, and the compressible DEff*rho+nu*rho chain (device_komega_sst.cu, FP-2 block), each kernel text-identical in its expressions to the ones it replaces and __dmul_rn pinning the products that used to cross a kernel boundary -- byte-identical fields and residual lines on aerofoilNACA0012 and squareBend over 5 iterations and on all 18 SST stage dumps. Worth 25 launches per iteration on the aerofoil, inside the run-to-run noise; the closure's cost there is the DILU-preconditioned k/omega solves the case names, not its kernels."

