    brae_target: src/transportModels/interfaceProperties/device_interface_properties.cu
    validation: "tests/test_interface_properties.cu (the dictionaries) and tests/test_interface_curvature_cpp.cu (K itself). NO INSTRUMENTED OpenFOAM WAS NEEDED: curvature is GEOMETRY. A plane's spurious K is 5+ orders below a real one and tracks deltaN; a sphere of radius R gives 2/R to 0.1% at 16^3 and the error FALLS on refinement, which is what makes the bound the scheme's rather than the mesh's; a bubble gives the exact negative; and the contact angle has the exact postcondition acos(nHat & nf) == theta."
    note: "K_ = -div(nHatf) with nHatf = (gradAlphaf/(|gradAlphaf| + deltaN)) & Sf (interfaceProperties.C:141-153), plus the alphaContactAngle correction on wall patches. surfaceTensionForce() = interpolate(sigma*K)*snGrad(alpha1). THE MINUS in K is the sign convention for the whole solver -- drop it and every surface-tension force points the wrong way with the right magnitude, which a flat-interface test cannot see because -0 is 0. fvc::grad(alpha1, \"nHat\") resolves a NAMED gradScheme. The contact-angle correction also writes alpha's own WALL GRADIENT (acap.gradient() = (nf & nHat)*mag(gradAlphaf)), not only the normal used for curvature; only laminar/capillaryRise sets one. nAlphaSmoothCurvature is set by NO shipped tutorial anywhere in OpenFOAM; smoothing is fvc::average, which is AREA-WEIGHTED and indistinguishable from a plain mean on a cube, so its gate runs on anisotropic cells. Combining it with a leastSquares gradient is refused by name -- there is no case to validate that against. INSTRUMENTED 2026-09-16: tools/dumpInterfaceK reads K, nHatf, the surface-tension force and alpha's post-correct boundary from OpenFOAM's UNMODIFIED class -- nHatf() and sigmaK() are public, so nothing is copied or patched. It found that calculateK is a FIXED POINT: it reads the wall gradient correctContactAngle wrote at the end of its own previous pass, so on capillaryRise that gradient runs 7070.5 -> 8659.4 -> 9353.1 -> 9681.2 over four passes and the curvature depends on WHERE the solver calls it, not only on the formula. brae's formula is exact -- 2.5e-14 relative against OpenFOAM at every one of four pass counts (tests/interfoam_curvature_vs_openfoam.sh) -- and its call sites were wrong: at the top of each alpha corrector instead of the bottom, absent from createFields, and absent from the mixture.correct() between the sub-cycle and UEqn. Fixing those took capillaryRise from 24.9% to 12.8%."

  interFoam_twoPhaseMixture:
    openfoam:
      symbol: twoPhaseMixture
      file: src/transportModels/twoPhaseMixture/twoPhaseMixture/twoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: "rho and mu as alpha-weighted blends, against OpenFOAM's own fields at iteration 1."
    note: "Field plumbing rather than new numerics: rho = alpha1*rho1 + (1-alpha1)*rho2, same for mu."

  interFoam_immiscibleMixture:
    openfoam:
      symbol: immiscibleIncompressibleTwoPhaseMixture
      file: src/transportModels/immiscibleIncompressibleTwoPhaseMixture/immiscibleIncompressibleTwoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: Shares the twoPhaseMixture gate.
    note: Joins twoPhaseMixture and interfaceProperties into the one object interFoam.C holds.

  interFoam_UEqn:
    openfoam:
      symbol: UEqn
      file: applications/solvers/multiphase/interFoam/UEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_ueqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_ueqn.cu
    validation: "tests/test_inter_ueqn_cpp.cu, and end to end at 3.3e-06 relative in U on damBreak against real OpenFOAM. ON THE DEVICE, tests/test_device_inter_ueqn.cu: fvc::reconstruct pinned by its own identity -- reconstruct(V & Sf) == V to 0.000e+00 on 2:1:0.5 cells, where the div-sign convention gives 2.5e+00 -- and bit-identical to the host on a non-uniform flux; the ddt bit-identical, with rho.oldTime() replaced by rho measured at exactly 1000.0x, the density ratio; and the p_rgh body force on a hydrostatic start 0.000e+00 in the bulk against 1.96e+04 at the interface, which is what the formulation is FOR. mu = rho*nuEff is bit-identical too, and its FACE value is the product interpolated ONCE -- interpolating the two factors separately is 3.4e-03 where the right answer is 1.0e-03. The device ASSEMBLY reuses gpu::assembleUEqn with rhoPhi and mu; that gained an optional fvm::ddt(rho,U) applied BEFORE relax(), and a relaxEquation flag so relax(1) still runs the diagonal-dominance clamp -- damBreak's fvSolution says `equations { \".*\" 1; }` and skipping it there would differ from OpenFOAM on every shipped interFoam tutorial. THE ASSEMBLED MATRIX IS GATED WHOLE (tests/test_device_inter_ueqn_assembly.cu) against the host's assembleUEqn on a VoF state: off-diagonals and boundary coefficients bit-identical, the relaxed diagonal 1.1e-13 of 1.0e+06 and the source 5.8e-11 of 4.5e+05. Two things it measures that no solved field could: relax(1)'s diagonal-dominance clamp MOVES the diagonal by 1.2e+03, so skipping relax at alpha == 1 is a different matrix; and passing rho for rho.oldTime() puts the ddt source 1000.0x out in exactly 64 of 512 cells -- one layer, the one the interface crossed. THE WHOLE PREDICTOR is gated there too: the reconstructed face force lands in the source to 1.2e-16 relative, negating it on the device moves the source by 2.00x the force exactly (a sign flip's signature), and the force is 15.4% of the final source -- so assembling and relaxing BEFORE adding it, which is what OpenFOAM does, is not cosmetic."
    note: "fvm::ddt(rho,U) + fvm::div(rhoPhi,U) + MRF.DDt(rho,U) + turbulence->divDevRhoReff(rho,U), with the momentum predictor's source reconstructed from surfaceTensionForce() - ghf*snGrad(rho) - snGrad(p_rgh). Assembly from pieces brae already had, EXCEPT two. (1) fvm::ddt(rho,U) puts rho on the diagonal and rho.oldTime() in the SOURCE (EulerDdtScheme.C:455-467); here those differ by the water/air ratio in every cell the interface crossed, so carrying one rho field is a 1000x error exactly at the interface. (2) the momentum source is a reconstructed FACE flux, not a cell gradient, and `solve(UEqn == R)` adds it with a PLUS where rhoSimpleFoam's twin carries the minus inside R. MRF, fvOptions, localEuler/CrankNicolson ddt and `Gauss limitedLinear` on div(rhoPhi,U) are refused by name."

  interFoam_pEqn:
    openfoam:
      symbol: pEqn
      file: applications/solvers/multiphase/interFoam/pEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_peqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_peqn.cu
    validation: "tests/test_inter_peqn_cpp.cu covers the four parts that are interFoam's own; the laplacian, the solve and the non-orthogonal loop are shared machinery gated elsewhere. ON THE DEVICE, tests/test_device_inter_peqn.cu: all four bit-identical to the host, each beside its own wrong version on a fixture built to make that version wrong -- rAU = dt/rho so the interface carries a 1000x jump. Carrying snGrad(p_rgh) into phig moves it by 1.4e+02 of 1.3e+02; interpolate(rho)*interpolate(rAU) is 2.5e-01 where the true product is dt = 1.0e-03 exactly, i.e. 250x; reconstruct without the rAUf division is 8.7e-01 out in U; and a constant ddtCorr coefficient instead of the limiter is 1.5e+02 of 4.0e+02, while the real one is 0.000e+00 on every value-fixing patch. THE p_rgh MATRIX IS ASSEMBLED ON THE DEVICE TOO and gated as a MATRIX -- off-diagonals bit-identical, diagonal 1.7e-18 of 1.1e-02 and source 4.4e-16 of 2.2e+00 -- with two arms a solved field could not show: fvMatrix::operator== is a PLUS (taking it as a minus moves the source by twice its own size, and still converges), and setReference DOUBLES the diagonal entry rather than replacing the row, touching no other cell. phiHbyA's two interFoam-only terms and pEqn.flux() are bit-identical to the host on both sides -- and dropping phig's BOUNDARY half moves fvc::div(phiHbyA) by 9.4e+01 of 1.9e+02, half the source, because `phiHbyA += phig` is a whole-surfaceScalarField operation and the divergence sums the boundary faces. On capillaryRise, where momentumPredictor is off, that is the only route surface tension has into the solution. ONE WHOLE PASS runs on the device (device_inter_pressure_step.cu, stages 1-4 reusing simpleFoam's pressurePredictor) and is gated against the host's pressureCorrector: p_rgh 4.0e-11 relative, U 1.6e-12, p rebuilt exactly. Two arms measure placements: dropping phig's boundary half moves the SOLVED p_rgh by 6.1e+05 of 1.2e+06 -- HALF the field, not just the flux -- and p is 0.000e+00 from p_rgh_solved + rho*gh against 1.2e+06 from the p_rgh the pass started with, which is the difference between rebuilding p and carrying it."
    note: "rAU = 1/UEqn.A(), phiHbyA, the p_rgh laplacian, then U and phi rebuilt. Four things are not shared with any other pressure corrector. (1) phig carries NO snGrad(p_rgh) where UEqn's source does -- the pressure gradient is explicit there and IMPLICIT here, and carrying it twice still converges, to the wrong balance at the interface. (2) ddtCorr is weighted by interpolate(rho*rAU), the PRODUCT interpolated once, not by interpolate(rho)*rAUf: rAU is of order dt/rho, so the two factors jump opposite ways across the interface and the rival form is 250x out there while agreeing exactly on any single-phase fixture. (3) the velocity correction divides by rAUf INSIDE reconstruct and multiplies by rAU outside -- identical for a uniform rAU, which is every easy fixture. (4) when p_rgh has no value-fixing patch, p is shifted AND p_rgh is rebuilt from the shifted p; damBreak's totalPressure atmosphere hides this, 8 shipped tutorials do not."

  interFoam_vanLeer:
    openfoam:
      symbol: vanLeer
      file: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/vanLeer/vanLeer.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/cuda/device_fvm.cu
    brae_target: src/cuda/device_fvm.cu
    validation: "tests/test_scheme_blocks.cu -- the selector, with a fail-proof; and the limiter against vanLeer.H:70 directly. It asymptotes to 2, not 1: it is a Sweby TVD limiter, not a [0,1] blend, and writing the clamp limitedLinear needs would make it a different scheme."
    note: "EVERY interFoam tutorial uses `div(phi,alpha) Gauss vanLeer`. brae has limitedLinear/V, vanAlbada, LUST, linearUpwind/V -- not vanLeer. Small, and blocking."

  interFoam_alphaCourantNo:
    openfoam:
      symbol: alphaCourantNo
      file: applications/solvers/multiphase/VoF/alphaCourantNo.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/cfdTools/general/time_controls.cuh
    brae_target: src/finiteVolume/cfdTools/general/device_alpha_courant.cu
    validation: "tests/test_alpha_courant_cpp.cu. Four fail-proofs: defaulting maxAlphaCo, pos for pos0, masking the mean's denominator, and dropping the alpha limit from setDeltaT. ON THE DEVICE, tests/test_device_alpha_courant.cu repeats three of them plus the boundary half of surfaceSum (0.0035 against 0.0043), with the fixture landing 40 cells EXACTLY on the band's edges so pos and pos0 differ. Agreement is 1e-14 relative and NOT bit-exact, and that is itself the measurement: a max over per-cell sums would be bit-identical if the sums were, so the one ULP proves sumPhi is a gather here and a scatter on the host."
    note: "A SECOND Courant number, over the interface cells only, because the ordinary one is a global max set by whatever corner runs fastest -- usually nowhere near the interface -- and MULES does not stop the interface being advected more than a cell per step. Landed alongside the existing time_controls, which already gives every transient solver CourantNo/setInitialDeltaT/setDeltaT (brae_pimpleFoam stopped refusing adjustTimeStep when that landed). Four things: maxAlphaCo is get<scalar> with NO default where maxCo defaults to 1, so the same controlDict is refused by one reader and not the other; nearInterface() is a 0/1 MASK over the CLOSED band [0.01, 0.99] (pos0 is 1 at exactly zero), so the two cells at its edges -- the ones an advancing interface is passing through -- are counted; meanAlphaCoNum divides by gSum(V) over the WHOLE mesh, not the interface volume; and with no interface alphaCoNum is exactly 0 so maxAlphaCo/(0+SMALL) lets maxCo alone set the step, which a differently-guarded division would turn into a freeze."

  interFoam_createFields:
    openfoam:
      symbol: createFields
      file: applications/solvers/multiphase/interFoam/createFields.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_case_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_case.cu
    validation: "tests/interfoam_createfields_vs_openfoam.sh -- damBreak's OWN case, prepared the way the tutorial does. damBreak ships 0.orig and NO mesh, so the fixture is a PROCEDURE (blockMesh then setFields), not a directory this repo can check in; the gate runs OpenFOAM's own utilities and SKIPs where OpenFOAM is absent. 2268 cells, 5 patches, 324 water cells."
    note: "ONE translation from case to fields, shared by the gate and by the solver -- a private copy in the driver is the defect rhoSimpleFoam's mirror wrote down: the gate proves the step, the driver feeds it something else, nothing compares them. Three things: the alpha field's NAME comes from `phases (water air)`, so a hard-coded alpha1 finds no file on any shipped case; phi is READ when present (createAlphaFluxes.H) and only computed from U when it is not, so a restart continues from the written flux rather than discarding the continuity error the last pressure corrector drove down; and fvSchemes KEYS contain parentheses and commas, so FoamDict cannot look them up -- they are read as text through scheme_parse's fvSchemesBlock, the same route every other brae solver uses. A non-laminar simulationType is refused: interFoam's turbulence is incompressibleInterPhaseTransportModel, a MIXTURE model handed the blended rho, not the single-phase model brae already has."

