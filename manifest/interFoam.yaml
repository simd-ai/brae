  interFoam_alphaCourantNo:
    openfoam:
      symbol: alphaCourantNo
      file: applications/solvers/multiphase/VoF/alphaCourantNo.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/cfdTools/general/time_controls.cuh
    brae_target: src/finiteVolume/cfdTools/general/device_alpha_courant.cu
    validation: "tests/test_alpha_courant_cpp.cu. Four fail-proofs: defaulting maxAlphaCo, pos for pos0, masking the mean's denominator, and dropping the alpha limit from setDeltaT. ON THE DEVICE, tests/test_device_alpha_courant.cu repeats three of them plus the boundary half of surfaceSum (0.0035 against 0.0043), with the fixture landing 40 cells EXACTLY on the band's edges so pos and pos0 differ. Agreement is 1e-14 relative and NOT bit-exact, and that is itself the measurement: a max over per-cell sums would be bit-identical if the sums were, so the one ULP proves sumPhi is a gather here and a scatter on the host."
    note: "A SECOND Courant number, over the interface cells only, because the ordinary one is a global max set by whatever corner runs fastest -- usually nowhere near the interface -- and MULES does not stop the interface being advected more than a cell per step. Landed alongside the existing time_controls, which already gives every transient solver CourantNo/setInitialDeltaT/setDeltaT (brae_pimpleFoam stopped refusing adjustTimeStep when that landed). Four things: maxAlphaCo is get<scalar> with NO default where maxCo defaults to 1, so the same controlDict is refused by one reader and not the other; nearInterface() is a 0/1 MASK over the CLOSED band [0.01, 0.99] (pos0 is 1 at exactly zero), so the two cells at its edges -- the ones an advancing interface is passing through -- are counted; meanAlphaCoNum divides by gSum(V) over the WHOLE mesh, not the interface volume; and with no interface alphaCoNum is exactly 0 so maxAlphaCo/(0+SMALL) lets maxCo alone set the step, which a differently-guarded division would turn into a freeze. FEEDING IT BACK INTO deltaT found two more things, both silent. Time::run() is `value() < endTime - 0.5*deltaT`, tested BEFORE setDeltaT with the previous step -- nothing in brae implemented it, brae_interFoam bounded its loop by a step COUNT computed from the initial deltaT, and damBreak at `endTime 0.004` ran out to t = 0.054, thirteen times past the end of the case, under a comment claiming the end time stopped it. And Time::setDeltaT takes `adjust = true` by default (Time.C:1178) and calls Time::adjustDeltaT, which under `writeControl adjustable` SHORTENS the step to land on the next write time: damBreak writes every 0.05, so OpenFOAM's first step is 0.05/417 = 0.000119904 where brae's unclamped setDeltaTVoF gave 0.00012. Both are ported (WriteCadence + adjustDeltaT in time_controls.cuh, and note that Time::writeControlNames tabulates wcAdjustableRunTime TWICE, as `adjustable` and as `adjustableRunTime` -- damBreak uses the short spelling and matching only the long one made the whole clamp a no-op on the very case it was measured against). tests/interfoam_dambreak_clock_vs_openfoam.sh now holds the clock against real OpenFOAM on the tutorial AS IT SHIPS: thirteen steps over one write interval, deltaT BIT-IDENTICAL, 0.000e+00 on every step at 17 digits, both landing exactly on 0.05 -- and `brae_interFoam -device`, which refused adjustTimeStep until this landed, is bit-identical too. Over those thirteen steps the Courant number never binds at maxCo 1, so this gate is the cap, adjustDeltaT and the loop bound; the Courant feedback is the device gate's adaptive arm at maxCo 0.0015. GETTING TO A TRUE NUMBER TOOK THREE PRINTFS: at OpenFOAM's default six figures it read 3.2e-06 (half an ULP of 0.00119047619 logged as 0.00119048); at writePrecision/timePrecision 14 it read 2.389e-09 and stayed there, identical on host and device, while the fields moved four orders closer -- which was brae's own `%.9g`; at 17 digits on both sides it is zero. A comment in the gate had explained the 2.389e-09 as field disagreement arriving through the Courant number. It was a printf."

  interFoam_createFields:
    openfoam:
      symbol: createFields
      file: applications/solvers/multiphase/interFoam/createFields.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_case_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_case.cu
    validation: "tests/interfoam_createfields_vs_openfoam.sh -- damBreak's OWN case, prepared the way the tutorial does. damBreak ships 0.orig and NO mesh, so the fixture is a PROCEDURE (blockMesh then setFields), not a directory this repo can check in; the gate runs OpenFOAM's own utilities and SKIPs where OpenFOAM is absent. 2268 cells, 5 patches, 324 water cells."
    note: "ONE translation from case to fields, shared by the gate and by the solver -- a private copy in the driver is the defect rhoSimpleFoam's mirror wrote down: the gate proves the step, the driver feeds it something else, nothing compares them. Three things: the alpha field's NAME comes from `phases (water air)`, so a hard-coded alpha1 finds no file on any shipped case; phi is READ when present (createAlphaFluxes.H) and only computed from U when it is not, so a restart continues from the written flux rather than discarding the continuity error the last pressure corrector drove down; and fvSchemes KEYS contain parentheses and commas, so FoamDict cannot look them up -- they are read as text through scheme_parse's fvSchemesBlock, the same route every other brae solver uses. A non-laminar simulationType is refused: interFoam's turbulence is incompressibleInterPhaseTransportModel, a MIXTURE model handed the blended rho, not the single-phase model brae already has."

