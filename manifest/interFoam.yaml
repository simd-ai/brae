    validation: "tests/test_mules_cpp.cu arm 7. Shares the boundedness oracle; the four structural differences from the explicit path are asserted one by one, each with its own fail-proof. ON THE DEVICE, tests/test_device_mules_corr.cu repeats A, B, C and the empty-patch skip against the host limiter: psi stays in [0,1] exactly where the unlimited control reaches 4.0e-01, and lambda came out bit-identical on all 264 faces, 32 of them strictly inside (0,1) -- not guaranteed, since the budgets are gathers there and a face loop here, so the gate keeps a tolerance."
    note: "LANDED AND RUNNING on damBreak's own mesh. The semi-implicit variant, `MULESCorr yes` -- 13 of the 44 shipped tutorials, damBreak included. With it the upwind part of the alpha equation goes through an implicit MATRIX, so by the time CMULES runs psi is ALREADY advanced and only the antidiffusive correction is left. Four consequences, all of them places a port that reuses the explicit code is quietly wrong. (A) correct() uses the CURRENT rho and psi, not their oldTime values: with a zero correction it is the identity, where the explicit form would hand back psi.oldTime() and undo the implicit solve -- bounded, so a boundedness gate never notices, the interface just moves at the wrong speed. (B) the budget transform carries NO sumPhiBD, because there is no donor flux. (C) uncoupled boundary faces ARE limited, but outlets only, and `outlet` means phi + phiCorr > SMALL*SMALL -- the TOTAL, so an inflow face whose correction reverses it is limited like any other. (D) nLimiterIter is get<label> with NO DEFAULT here where the explicit limiter defaults it to 3, so the same dictionary is accepted by one reader and refused by the other. MEASURED on damBreak: 20 alpha steps on a projected divergence-free flux leave the field within 2.1e-11 of [0,1] against the explicit path's 9.5e-14. Three sweeps characterise that gap: it is present at step 0 and barely accumulates; it is INDEPENDENT of the linear-solver tolerance (1e-8 to 1e-14 moves it not at all) while the MASS DRIFT tracks that tolerance exactly; and it scales as about dt^4. So conservation is the solve's accuracy and boundedness is a conditioning effect in the budget that grows with the correction. The exact mechanism is not attributed; the gate asserts the characterisation -- the bound AND the scaling -- so a change in behaviour fails rather than being absorbed."

