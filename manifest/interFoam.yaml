    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/alpha_eqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_alpha_step.cu
    validation: "tests/test_alpha_eqn_cpp.cu covers the FLUX ASSEMBLY. Boundedness is the gate for the MULES half and is an ASSERTION, not a tolerance: 0 <= alpha <= 1 exactly, every cell, every sub-cycle. A VoF gate that only checks agreement can pass while the field goes unbounded and is then clipped. ON THE DEVICE, tests/test_device_alpha_step.cu runs the WHOLE explicit corrector on a rotating blob -- discretely divergence-free, so boundedness means something -- against the host: alpha in [0,1] exactly, 1.1e-16 after one step and 9.99e-16 after forty of two correctors each."
    note: "SPLIT IN TWO. The flux assembly is landed: alphaControls, the off-centring, phic, phiCN, alphaPhiUn and rhoPhi. MULES is interFoam_MULES and is not. Su/Sp/divU are identically zero for THIS solver (interFoam/alphaSuSp.H is three zeroFields); they are live in interPhaseChangeFoam, which has its own. Three things the gate pins that no field shows: phic is zeroed on every NON-COUPLED boundary (alphaEqn.H:79-89, compression at an inlet sharpens an interface the boundary does not have); alphaPhiUn's compressive term is a nested flux with TWO minus signs, which cancel exactly under `Gauss linear` (31 tutorials, so the mistake is invisible there) and do not under `Gauss vanLeer` (7); and rhoPhi's two branches multiply rho2f by phiCN on the Euler path and phi on the other. Only Euler, localEuler and CrankNicolson ddt are accepted (alphaEqn.H:49-51), and CrankNicolson is refused when sub-cycling. `Gauss interfaceCompression` on div(phirb,alpha) (4 tutorials) is refused by name. THE WHOLE MULESCorr PATH NOW RUNS ON THE DEVICE and is gated end to end against the host over 40 steps at nAlphaCorr 2 / nLimiterIter 5, damBreak's own settings: 1.07e-10, and it differs from the explicit path by 3.3e-02 so the arm is not a second copy of it. Two things that gate found. CMULES' outlet test reads alphaPhiUn, not phiCN -- OpenFOAM passes talphaPhi1Un() -- and passing the volumetric flux there cost 3.99e-09 against the host. And the path is NOT exactly bounded at nLimiterIter 5: 1.307e-06, the host's number to four digits, which is the fixed-point iteration and nothing else -- the pre-solve alone is 0.000e+00 at solver tolerance 1e-12 and 1.31e-06 at 1e-6, and the final field is 0.000e+00 at nLimiterIter 40. THE IMPLICIT PRE-SOLVE IS ON THE DEVICE (device_alpha_presolve.cu): the upwind LDU, the Euler ddt, the BiCGStab solve and alpha1Eqn.flux(), with only the boundary coefficients built on the host. Its gate pins the flux by the closure alpha == alphaOld - (dt/V)*sum_f alphaPhi10, which tracks the SOLVER RESIDUAL (1.3e-12 at tolerance 1e-12, 3.0e-06 at 1e-6) where a flux rebuilt from the pre-solve field leaves a fixed 5.1e-03 and a central one 2.3e-02. THE DEVICE SPLIT IS ONE CORRECTOR PER CALL, not the nAlphaCorr loop: OpenFOAM re-evaluates alpha's boundary at the end of every MULES solve and runs mixture.correct() after that, and the next corrector's flux, gradient and limiter all read them. Looping inside the call put nHatf 2.885e-04 out on a field whose largest value is 1.736e-03, and 3.2e-09 into alpha by the end of a single step. THE PRE-SOLVE'S LINEAR SOLVER WAS A SUBSTITUTION HIDDEN BY A TOLERANCE. Every MULESCorr tutorial names `solver smoothSolver; smoother symGaussSeidel; tolerance 1e-8` for alpha. The device ran Jacobi-BiCGStab to a HARDCODED 1e-12 and the host DILU-PBiCGStab to a struct default of 1e-8; neither read the case. It matters because an implicit upwind matrix is nearly triangular in flow order, so a Gauss-Seidel sweep is nearly an exact solve -- OpenFOAM's log on damBreak reads `No Iterations 2, Final residual 9.3e-14` -- while Jacobi-BiCGStab stops AT its tolerance. Measured against real OpenFOAM, five steps of damBreak, device alpha pre-solve tolerance swept: 1e-16 -> alpha 5.5e-11; 1e-12 (the hardcoded value) -> 1.6e-10; 1e-8 (THE CASE'S OWN) -> alpha 3.3e-06 and U 1.2e-03. The 1.6e-10 had been in the device/host gate all along, under a bound of 1e-8 and a comment attributing it to 'the pre-solve's residual' -- which was true and was not followed. The device had OpenFOAM's smoother already (deviceSymGaussSeidel: smoothSolver's stopping rule around symGaussSeidelSmoother's own sweep, level-scheduled and exact, gated by gs_ladder). With the case's entry read (InterFields::aSolve, lduMatrix's defaults, refused when MULESCorr names no solver) and the device on it at the case's 1e-8: device against OpenFOAM alpha 1.6e-10 -> 3.6e-14, p_rgh 2.1e-10 -> 8.6e-12, U 3.8e-08 -> 2.3e-11 -- the host's numbers to three digits -- and device against host through the shipped drivers alpha 1.6e-10 -> 1.1e-15, U 3.7e-08 -> 2.6e-14 relative, p_rgh 2.5e-10 -> 2.5e-14, the adaptive clock 3e-10 -> 2e-12. Every bound in tests/test_device_inter_dambreak_alpha.cu followed, from 1e-8/1e-7/1e-6 to 1e-13/1e-12/1e-12. THE HOST SUBSTITUTED TOO (DILU-PBiCGStab, under a notice) until it had a smoothSolver of its own -- see interFoam_smoothSolver. On damBreak that was measured harmless, 3.6e-14, because DILU on a near-triangular matrix is as nearly exact as the sweep; measured on one case, not proven, which is why it was closed rather than left. Any alpha solver that is not smoothSolver with a Gauss-Seidel smoother still runs BiCGStab on both paths, under a notice that carries the 3.3e-06. `alphaApplyPrevCorr` WAS HALF PORTED AND THE OTHER HALF WAS SILENT. alphaEqn.H:133-150 and :228-236: the compression flux the correctors ended on is cached in talphaPhi1Corr0 and the NEXT pre-solve applies it, limited through MULES::correct, before its own correctors run. Three shipped tutorials set it (floatingObject, DTCHull, DTCHullMoving) and brae refuses all three for other reasons -- RAS, moving meshes, LTS -- so no tutorial can gate it; OpenFOAM honours it on any MULESCorr case and damBreak is one. THE HOST had an implementation nothing had ever run. THE DEVICE had nothing at all -- no code and NO REFUSAL -- so `brae_interFoam -device` on such a case ignored the switch and said nothing. Measured on damBreak at dt 5e-3 with the switch on, before any change: host alpha 1.2e-12 from OpenFOAM, device 1.0690e-02 -- to five digits OpenFOAM's own distance from itself with the switch OFF -- and U 15% out. Now implemented on the device with the two CMULES primitives it already had (deviceMulesLimitCorr, deviceMulesCorrect); the cache is owned by the CALLER because it outlives the call, and the switch without a cache, without MULESCorr, or without the curvature-free refreshBoundary hook is refused by name. Device after: alpha 1.2e-12, p_rgh 1.7e-12, U 9.2e-12, every p_rgh and alpha iteration count OpenFOAM's. Gated as two more profiles of tests/interfoam_dambreak_vs_openfoam.sh. `prevcorr` asserts that OpenFOAM's log says `Applying the previous iteration compression flux` -- an oracle that never took the path would agree with a brae that ignored it -- and its control is that the switch moves OpenFOAM's OWN alpha by 1.07e-02, nine orders more than brae's distance from it. `prevcorrsub` adds nAlphaSubCycles 2, because the cache outlives the SUB-CYCLE as well as the time step and damBreak's own count of 1 cannot tell a cache that crosses from one that is reset: ten alpha solves (0, 0, 3, 3, 2, 2, 2, 2, 2, 2), every count equal on both paths, alpha 1.6e-12, and the sub-cycle count moves OpenFOAM's own alpha by 8.2e-02. ONE FIX HERE WAS MADE FROM THE SOURCE FIRST AND MEASURED AFTERWARDS, and the measuring is the part worth keeping. The host passed phiCN, the VOLUMETRIC flux, as MULES::correct's flux argument where OpenFOAM passes alphaPhi10 (alphaEqn.H:140). limiterCorr reads it in one place, the boundary outlet test `(phi_b + phiCorr_b) > SMALL*SMALL` (CMULESTemplates.C:546) -- the same slip the corrector loop had, fixed there at 3.99e-09 -> 1.07e-10. IT TOOK THREE FIXTURES. (1) damBreak: the host's numbers are the same to five digits either way, because the boundary half of the cached correction is zero unless alpha's patch value moves between the pre-solve and the correctors, which needs water LEAVING through an outflow face. (2) The water column raised to the atmosphere, dt 5e-3: water does leave, and a probe counting the faces on which the two tests DECIDE DIFFERENTLY found up to 13 a step, on corrections worth 15% of the face flux -- and the answer was still bit-identical, alpha 5.8831e-13 both ways. Running the limiter both ways on the same state showed why: the limited correction came out identical, because on those faces the cell limiter returned 1 and made the decision moot. A difference in a DECISION is not a difference in an ANSWER. (3) The same fixture at dt 1e-2, found by sweeping brae alone for a step where the two limited corrections actually differ: one application there moves one cell's alpha by 0.10. Against real OpenFOAM, four steps: with phiCN alpha 5.5e-03, p_rgh 5.7e-03, U 2.2e-02; with alphaPhi10 4.6e-13, 2.7e-13, 5.5e-13 -- ten orders from one argument. The device, written with the right argument from the start, reads 4.7e-13, 2.9e-13 and 4.5e-11 on it. Gated as the `outflow` profile, whose control is on BRAE rather than the oracle: the host runs again with BRAE_CONTROL_PREVCORR_PHICN set (read in the driver as BRAE_PTOL is, announced on every step it is on, and carried by AlphaStepInput::controlPrevCorrOutletOnPhiCN, which no solver sets) and must come out more than 1e-6 from OpenFOAM. It reads 5.5193e-03. The sweep also bounds the fixture: at dt 2e-2 alpha leaves [-0.34, 1.12] and the inflow variants go to NaN, so dt 1e-2 for four steps is what this case can carry."

  interFoam_MULES:
    openfoam:
      symbol: "MULES::limiter"
      file: src/finiteVolume/fvMatrices/solvers/MULES/MULES.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/fvMatrices/solvers/MULES/mules_cpp.cuh
    brae_target: src/finiteVolume/fvMatrices/solvers/MULES/device_mules.cu
    validation: "tests/test_mules_cpp.cu. The oracle is BOUNDEDNESS, not a stored field, which is what makes the gate possible at all -- a stock run never writes the limiter. It is a PAIR of arms, because either alone is trivially satisfiable: the limited run stays in [0,1] exactly where the unlimited one does not, AND a monotone in-bounds field comes back with lambda == 1 on every face away from the domain ends. lambda == 0 everywhere passes the first and fails the second, and it is first-order upwind -- the case's scheme silently discarded."
    note: "THE LARGEST SINGLE PIECE, and the least brae-like. An EXPLICIT, ITERATIVE, bound-preserving flux limiter -- not a matrix assembly -- so almost none of the fvm:: machinery the other solvers share applies. Landed: limiter, limit, explicitSolve. Four things the gate pins that no converged field shows: psiMaxn/psiMinn are initialised SWAPPED (:280-281) so the neighbour scan builds from the far end; the neighbourhood extrema EXCLUDE the cell's own value, which is what lets an interface advance; phiBD is overwritten with phiPsi on every non-coupled boundary so the prescribed flux is never limited (:600-609); and a wedge patch gets lambda = 0 outright (:530-533). Two things measured and NOT claimed: the running min(lambda,...) is defensive rather than load-bearing (removing it gives a bit-identical field, because both accumulators are built from lambda), and in one dimension the first pass is already the fixed point -- nLimiterIter only bites where a cell's faces are limited by different neighbours at once."

  interFoam_CMULES:
    openfoam:
      symbol: "MULES::correct"
      file: src/finiteVolume/fvMatrices/solvers/MULES/CMULESTemplates.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/fvMatrices/solvers/MULES/mules_cpp.cuh
    brae_target: src/finiteVolume/fvMatrices/solvers/MULES/device_mules.cu
    validation: "tests/test_mules_cpp.cu arm 7. Shares the boundedness oracle; the four structural differences from the explicit path are asserted one by one, each with its own fail-proof. ON THE DEVICE, tests/test_device_mules_corr.cu repeats A, B, C and the empty-patch skip against the host limiter: psi stays in [0,1] exactly where the unlimited control reaches 4.0e-01, and lambda came out bit-identical on all 264 faces, 32 of them strictly inside (0,1) -- not guaranteed, since the budgets are gathers there and a face loop here, so the gate keeps a tolerance."
    note: "LANDED AND RUNNING on damBreak's own mesh. The semi-implicit variant, `MULESCorr yes` -- 13 of the 44 shipped tutorials, damBreak included. With it the upwind part of the alpha equation goes through an implicit MATRIX, so by the time CMULES runs psi is ALREADY advanced and only the antidiffusive correction is left. Four consequences, all of them places a port that reuses the explicit code is quietly wrong. (A) correct() uses the CURRENT rho and psi, not their oldTime values: with a zero correction it is the identity, where the explicit form would hand back psi.oldTime() and undo the implicit solve -- bounded, so a boundedness gate never notices, the interface just moves at the wrong speed. (B) the budget transform carries NO sumPhiBD, because there is no donor flux. (C) uncoupled boundary faces ARE limited, but outlets only, and `outlet` means phi + phiCorr > SMALL*SMALL -- the TOTAL, so an inflow face whose correction reverses it is limited like any other. (D) nLimiterIter is get<label> with NO DEFAULT here where the explicit limiter defaults it to 3, so the same dictionary is accepted by one reader and refused by the other. MEASURED on damBreak: 20 alpha steps on a projected divergence-free flux leave the field within 2.1e-11 of [0,1] against the explicit path's 9.5e-14. Three sweeps characterise that gap: it is present at step 0 and barely accumulates; it is INDEPENDENT of the linear-solver tolerance (1e-8 to 1e-14 moves it not at all) while the MASS DRIFT tracks that tolerance exactly; and it scales as about dt^4. So conservation is the solve's accuracy and boundedness is a conditioning effect in the budget that grows with the correction. The exact mechanism is not attributed; the gate asserts the characterisation -- the bound AND the scaling -- so a change in behaviour fails rather than being absorbed. NOT CMULES, AS IT TURNED OUT: on damBreak over ten adaptive steps brae's alpha reached 1 + 2.306e-06 where real OpenFOAM reached 1 + 1.1361e-06, 1.98x, and it was first recorded here as an open CMULES gap. Measuring it put it elsewhere. interFoam's alphaSuSp.H has no divU, so the MULESCorr pre-solve on a full cell gives a = 1/(1 + dt*div(phi)) and the excursion is dt times the continuity error the PRESSURE solve left. Tightening only the alpha solve changed nothing to the last digit; tightening only p_rgh took both codes from 1.16e-06 to 4.9e-13. The per-step ratio ran 0.12x to 3.18x, not a steady 2x. Closed under interFoam_pEqn, and test_inter_case_cpp now holds it at OpenFOAM's own value to 2% (0.9931x). OpenFOAM prints Max(alpha.water) TWICE a step -- after the pre-solve (alphaEqn.H:124) and after the correctors (alphaEqn.H:263) -- and the gate's constant had been taken from the first while it reads the second."

  interFoam_interfaceProperties:
    openfoam:
      symbol: interfaceProperties
      file: src/transportModels/interfaceProperties/interfaceProperties.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/interfaceProperties/interface_properties_cpp.cuh
    brae_target: src/transportModels/interfaceProperties/device_interface_properties.cu
    validation: "tests/test_interface_properties.cu (the dictionaries) and tests/test_interface_curvature_cpp.cu (K itself). NO INSTRUMENTED OpenFOAM WAS NEEDED: curvature is GEOMETRY. A plane's spurious K is 5+ orders below a real one and tracks deltaN; a sphere of radius R gives 2/R to 0.1% at 16^3 and the error FALLS on refinement, which is what makes the bound the scheme's rather than the mesh's; a bubble gives the exact negative; and the contact angle has the exact postcondition acos(nHat & nf) == theta."
    note: "K_ = -div(nHatf) with nHatf = (gradAlphaf/(|gradAlphaf| + deltaN)) & Sf (interfaceProperties.C:141-153), plus the alphaContactAngle correction on wall patches. surfaceTensionForce() = interpolate(sigma*K)*snGrad(alpha1). THE MINUS in K is the sign convention for the whole solver -- drop it and every surface-tension force points the wrong way with the right magnitude, which a flat-interface test cannot see because -0 is 0. fvc::grad(alpha1, \"nHat\") resolves a NAMED gradScheme. The contact-angle correction also writes alpha's own WALL GRADIENT (acap.gradient() = (nf & nHat)*mag(gradAlphaf)), not only the normal used for curvature; only laminar/capillaryRise sets one. nAlphaSmoothCurvature is set by NO shipped tutorial anywhere in OpenFOAM; smoothing is fvc::average, which is AREA-WEIGHTED and indistinguishable from a plain mean on a cube, so its gate runs on anisotropic cells. Combining it with a leastSquares gradient is refused by name -- there is no case to validate that against. INSTRUMENTED 2026-09-16: tools/dumpInterfaceK reads K, nHatf, the surface-tension force and alpha's post-correct boundary from OpenFOAM's UNMODIFIED class -- nHatf() and sigmaK() are public, so nothing is copied or patched. It found that calculateK is a FIXED POINT: it reads the wall gradient correctContactAngle wrote at the end of its own previous pass, so on capillaryRise that gradient runs 7070.5 -> 8659.4 -> 9353.1 -> 9681.2 over four passes and the curvature depends on WHERE the solver calls it, not only on the formula. brae's formula is exact -- 2.5e-14 relative against OpenFOAM at every one of four pass counts (tests/interfoam_curvature_vs_openfoam.sh) -- and its call sites were wrong: at the top of each alpha corrector instead of the bottom, absent from createFields, and absent from the mixture.correct() between the sub-cycle and UEqn. Fixing those took capillaryRise from 24.9% to 12.8%."

  interFoam_twoPhaseMixture:
    openfoam:
      symbol: twoPhaseMixture
      file: src/transportModels/twoPhaseMixture/twoPhaseMixture/twoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: "rho and mu as alpha-weighted blends, against OpenFOAM's own fields at iteration 1."
    note: "Field plumbing rather than new numerics: rho = alpha1*rho1 + (1-alpha1)*rho2, same for mu."

  interFoam_immiscibleMixture:
    openfoam:
      symbol: immiscibleIncompressibleTwoPhaseMixture
      file: src/transportModels/immiscibleIncompressibleTwoPhaseMixture/immiscibleIncompressibleTwoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: Shares the twoPhaseMixture gate.
    note: "Joins twoPhaseMixture and interfaceProperties into the one object interFoam.C holds -- AND THE ORDER IT JOINS THEM IN IS PART OF THE ANSWER. correct() is calcNu() THEN interfaceProperties::correct() (immiscibleIncompressibleTwoPhaseMixture.H:78-82), and at a contact-angle wall the second call rewrites alpha's patch gradient and so its patch value. Three things follow, all measured on capillaryRise against tools/dumpInterFoam and together the whole of the 0.7% that case carried: (1) the boundary viscosity is blended BEFORE the curvature pass; brae did it after, and UEqn.A() was exact in every cell off the wall and 1.26% high in the air cells at it -- 0.2% of U after one step, before the contact line had moved a face. (2) `alpha2 = 1.0 - alpha1` (alphaEqn.H:151 and :223) is a whole-field assignment one line ABOVE mixture.correct(), so alpha2's PATCH values are one contact-angle pass older than alpha1's, and `rho == alpha1*rho1 + alpha2*rho2` blends the two: 7.4e-05 of rho*nu at the wall with 1 - alpha1, 1e-17 with the stale value carried (InterFields::alpha2Bnd on the host, deviceBoundaryRho on the device). (3) because the curvature pass has that side effect, the NUMBER of passes is part of the answer -- the gradient runs 7070.5, 8659.4, 9353.1, 9681.2 -- and the device's alpha-boundary hook ran the host's calculateK on every call, including the sub- step's reset of alpha1, which is not a mixture.correct(): five passes a step where OpenFOAM takes three, K 0.6% out at the contact line and U 1.9% out after ONE step. The hook is now two (DeviceInterAlphaHooks::refreshBoundary). damBreak has no contact angle, where calculateK has no side effect, and could see none of the three."

  interFoam_UEqn:
    openfoam:
      symbol: UEqn
      file: applications/solvers/multiphase/interFoam/UEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_ueqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_ueqn.cu
    validation: "tests/test_inter_ueqn_cpp.cu, and end to end at 3.3e-06 relative in U on damBreak against real OpenFOAM. ON THE DEVICE, tests/test_device_inter_ueqn.cu: fvc::reconstruct pinned by its own identity -- reconstruct(V & Sf) == V to 0.000e+00 on 2:1:0.5 cells, where the div-sign convention gives 2.5e+00 -- and bit-identical to the host on a non-uniform flux; the ddt bit-identical, with rho.oldTime() replaced by rho measured at exactly 1000.0x, the density ratio; and the p_rgh body force on a hydrostatic start 0.000e+00 in the bulk against 1.96e+04 at the interface, which is what the formulation is FOR. mu = rho*nuEff is bit-identical too, and its FACE value is the product interpolated ONCE -- interpolating the two factors separately is 3.4e-03 where the right answer is 1.0e-03. The device ASSEMBLY reuses gpu::assembleUEqn with rhoPhi and mu; that gained an optional fvm::ddt(rho,U) applied BEFORE relax(), and a relaxEquation flag so relax(1) still runs the diagonal-dominance clamp -- damBreak's fvSolution says `equations { \".*\" 1; }` and skipping it there would differ from OpenFOAM on every shipped interFoam tutorial. THE ASSEMBLED MATRIX IS GATED WHOLE (tests/test_device_inter_ueqn_assembly.cu) against the host's assembleUEqn on a VoF state: off-diagonals and boundary coefficients bit-identical, the relaxed diagonal 1.1e-13 of 1.0e+06 and the source 5.8e-11 of 4.5e+05. Two things it measures that no solved field could: relax(1)'s diagonal-dominance clamp MOVES the diagonal by 1.2e+03, so skipping relax at alpha == 1 is a different matrix; and passing rho for rho.oldTime() puts the ddt source 1000.0x out in exactly 64 of 512 cells -- one layer, the one the interface crossed. THE WHOLE PREDICTOR is gated there too: the reconstructed face force lands in the source to 1.2e-16 relative, negating it on the device moves the source by 2.00x the force exactly (a sign flip's signature), and the force is 15.4% of the final source -- so assembling and relaxing BEFORE adding it, which is what OpenFOAM does, is not cosmetic."
    note: "fvm::ddt(rho,U) + fvm::div(rhoPhi,U) + MRF.DDt(rho,U) + turbulence->divDevRhoReff(rho,U), with the momentum predictor's source reconstructed from surfaceTensionForce() - ghf*snGrad(rho) - snGrad(p_rgh). Assembly from pieces brae already had, EXCEPT two. (1) fvm::ddt(rho,U) puts rho on the diagonal and rho.oldTime() in the SOURCE (EulerDdtScheme.C:455-467); here those differ by the water/air ratio in every cell the interface crossed, so carrying one rho field is a 1000x error exactly at the interface. (2) the momentum source is a reconstructed FACE flux, not a cell gradient, and `solve(UEqn == R)` adds it with a PLUS where rhoSimpleFoam's twin carries the minus inside R. MRF, fvOptions, localEuler/CrankNicolson ddt and `Gauss limitedLinear` on div(rhoPhi,U) are refused by name."

  interFoam_pEqn:
    openfoam:
      symbol: pEqn
      file: applications/solvers/multiphase/interFoam/pEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_peqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_peqn.cu
    validation: "tests/test_inter_peqn_cpp.cu covers the four parts that are interFoam's own; the laplacian, the solve and the non-orthogonal loop are shared machinery gated elsewhere. ON THE DEVICE, tests/test_device_inter_peqn.cu: all four bit-identical to the host, each beside its own wrong version on a fixture built to make that version wrong -- rAU = dt/rho so the interface carries a 1000x jump. Carrying snGrad(p_rgh) into phig moves it by 1.4e+02 of 1.3e+02; interpolate(rho)*interpolate(rAU) is 2.5e-01 where the true product is dt = 1.0e-03 exactly, i.e. 250x; reconstruct without the rAUf division is 8.7e-01 out in U; and a constant ddtCorr coefficient instead of the limiter is 1.5e+02 of 4.0e+02, while the real one is 0.000e+00 on every value-fixing patch. THE p_rgh MATRIX IS ASSEMBLED ON THE DEVICE TOO and gated as a MATRIX -- off-diagonals bit-identical, diagonal 1.7e-18 of 1.1e-02 and source 4.4e-16 of 2.2e+00 -- with two arms a solved field could not show: fvMatrix::operator== is a PLUS (taking it as a minus moves the source by twice its own size, and still converges), and setReference DOUBLES the diagonal entry rather than replacing the row, touching no other cell. phiHbyA's two interFoam-only terms and pEqn.flux() are bit-identical to the host on both sides -- and dropping phig's BOUNDARY half moves fvc::div(phiHbyA) by 9.4e+01 of 1.9e+02, half the source, because `phiHbyA += phig` is a whole-surfaceScalarField operation and the divergence sums the boundary faces. On capillaryRise, where momentumPredictor is off, that is the only route surface tension has into the solution. ONE WHOLE PASS runs on the device (device_inter_pressure_step.cu, stages 1-4 reusing simpleFoam's pressurePredictor) and is gated against the host's pressureCorrector: p_rgh 4.0e-11 relative, U 1.6e-12, p rebuilt exactly. Two arms measure placements: dropping phig's boundary half moves the SOLVED p_rgh by 6.1e+05 of 1.2e+06 -- HALF the field, not just the flux -- and p is 0.000e+00 from p_rgh_solved + rho*gh against 1.2e+06 from the p_rgh the pass started with, which is the difference between rebuilding p and carrying it."
    note: "rAU = 1/UEqn.A(), phiHbyA, the p_rgh laplacian, then U and phi rebuilt. Four things are not shared with any other pressure corrector. (1) phig carries NO snGrad(p_rgh) where UEqn's source does -- the pressure gradient is explicit there and IMPLICIT here, and carrying it twice still converges, to the wrong balance at the interface. (2) ddtCorr is weighted by interpolate(rho*rAU), the PRODUCT interpolated once, not by interpolate(rho)*rAUf: rAU is of order dt/rho, so the two factors jump opposite ways across the interface and the rival form is 250x out there while agreeing exactly on any single-phase fixture. (3) the velocity correction divides by rAUf INSIDE reconstruct and multiplies by rAU outside -- identical for a uniform rAU, which is every easy fixture. (4) when p_rgh has no value-fixing patch, p is shifted AND p_rgh is rebuilt from the shifted p; damBreak's totalPressure atmosphere hides this, 8 shipped tutorials do not. THE SOLVE ITSELF WAS A SUBSTITUTION IN TWO WAYS, and on a VoF case it shows. brae ran PBiCGStab where every damBreak-family tutorial names `solver PCG; preconditioner DIC;`, and took relTol from p_rghFinal for all three correctors where pEqn.H:50 solves with p_rgh.select(pimple.finalInnerIter()) -- `p_rgh` (relTol 0.05) for the first two, `p_rghFinal` for the last (pimpleControlI.H:98-111). Both are fixed: brae::pcg is lduMatrix PCG + DICPreconditioner (gated in tests/test_pcg.cu), InterFields reads both entries with lduMatrix::solver's own defaults (tolerance 1e-6, maxIter 1000 -- brae had 2000), a missing p_rghFinal is refused by name, and any other solver still runs PBiCGStab under a noticeApproximated that says it moves the stopping point, not just the cost. MEASURED on damBreak against real OpenFOAM, five fixed steps on the case's own solves: alpha 1.24e-08 -> 2.2337e-12, p_rgh 3.35e-06 -> 7.194e-10 relative, U 9.76e-06 -> 1.966e-08 relative, and the gate bounds tightened to 5e-11, 1e-8 and 4e-7 with them. Over ten adaptive steps alpha's over-1 excursion -- which is dt times this solve's continuity error -- went from 0.12-3.18x OpenFOAM's to 0.99-1.00x. Each half alone is not enough: PCG with the old relTol gave 0.73-4.90x, PBiCGStab with the per-corrector selection 1.98-18.41x. This is the lesson turbulentFlatPlate:kEpsilon taught about DILU: a substituted solver at the same tolerance does not only cost differently, it STOPS somewhere else. capillaryRise does not move (0.7%), so that gap is not this. (The device ran its own solver on p_rgh at this point; it takes the case's too now -- see the end of this note.) WHAT capillaryRise's 0.7% WAS, since it was not the solver: three defects in how the mixture meets a contact-angle wall (interFoam_immiscibleMixture) and one here. OpenFOAM's flux-conditional patches LOOK PHI UP when they update -- pressureInletOutletVelocity, inletOutlet, totalPressure all call lookupPatchField(phiName_) inside updateCoeffs -- and brae's are TOLD, through updateFromFlux, which interFoam never called. Every such face was therefore an OUTFLOW face for the whole run. capillaryRise's bottom inlet draws water IN, so its pressureInletOutletVelocity lost the two fixed tangential components and with them 2/3 muEff magSf deltaCoeffs of UEqn.A() in every cell of the bottom row: 5.33e+05 by that formula, 5.339e+05 measured against OpenFOAM's own UEqn.A() dump. It appears at step two because step one starts from rest. Fixed with pushFluxToPatches (at start-up, inside pressureCorrector between `phi = phiHbyA - p_rghEqn.flux()` and U's boundary evaluation, which is pEqn.H's order, and after the corrector loop for alpha's inletOutlet); the device had the same omission plus its own -- it never called deviceUpdatePressureInletOutletVelocity, so its inflow faces stayed zeroGradient -- and agreed with the host only while the host was wrong the same way. RESULT, tests/interfoam_capillaryrise_vs_openfoam.sh, five steps: U 2.8e-03 -> 2.1e-08 (0.7% -> 5.0e-08 of |U|), alpha 4.6e-05 -> 4.6e-09, p_rgh 1.3e-04 -> 8.1e-08 relative, wall gradient 4.5e-05 -> 5.2e-09 of its peak, UEqn.A() to 4.3e-09 and the wall's rho*nu to 1e-17; with every solve tightened the host is 5.5e-14 of |U| after one step. The gate's bound went 0.02 -> 1e-6 and it now checks alpha, p_rgh and the pressure corrector's terms wall-against-rest. damBreak moved too, the right way: alpha 2.23e-12 -> 1.30e-12, p_rgh 7.2e-10 -> 6.5e-10, U 2.0e-08 -> 1.5e-08. THE DEVICE now has a gate on this case, against OpenFOAM directly: 3.5e-08 with every solve tightened on both codes (2.2e-12 after one step), and 9.2e-04 at the case's own tolerances, which WAS its p_rgh solver stopping somewhere the case's PCG+DIC does not -- closed since, 4.8e-08. snGrad(rho) ON A PATCH WAS CARRIED HERE AS `LATENT` AND IT IS NOT SMALL. createFields.H builds rho from `alpha1*rho1 + alpha2*rho2`, so its patches are `calculated` and their snGrad() is the base class's, deltaCoeffs*(rho_b - rho_cell) (fvPatchField.C:220-223); brae took fvc::snGrad(rho) from a zeroGradient copy, which is 0 on every patch. On a fixedFluxPressure wall the term cancels through constrainPressure, and everywhere else on damBreak and capillaryRise alpha's patch value equals the cell's, so no shipped- tutorial gate could see it and this note said so. THE FIXTURE THAT SEES IT took two attempts, and the first is worth keeping: raising damBreak's water column to the atmosphere did NOT exercise the term -- brae already agreed to 3.6e-13 -- because the faces over the water turned out to be OUTFLOW (the patch fixes p_rgh, not p, so the column top sees the lower pressure) and OpenFOAM's own dumped boundary snGrad(rho) was `uniform 0`. What does it is the atmosphere's inletValue set to 1, so water enters over air cells: OpenFOAM's boundary snGrad(rho) is then 1.57e+05 on 19 of 46 faces, phig there is 1.66e-02 against a phiHbyA of 2.5e-06 -- four orders above everything else in the pressure source -- max|U| goes 0.19 -> 20 m/s in ONE step, and brae was 100% out in alpha, p_rgh and U from the second step on, with step two's alpha solve still exact (4.4e-13) and its first p_rgh solve 100% different. Fixed on both paths with rho's real patch values (rhoWithPatchValues; the device hands its own rhoBnd, which carries alpha2's one-pass-older patch values, to the interfaceForces hook, and a missing patch value is refused by name rather than defaulted to the cell's). Gated as the `inflow` profile of tests/interfoam_dambreak_vs_openfoam.sh, three steps: host alpha 1.3e-14, p_rgh 4.3e-11, U 6.1e-13; device 2.3e-14, 6.9e-10, 5.8e-10; every p_rgh and alpha iteration count OpenFOAM's; the water let in equal to 1e-12. Its control is on the ORACLE: OpenFOAM's own answer is 67x the standard case's whole velocity away from the standard case's, so agreeing with it cannot be had without the term. THREE STEPS ONLY, and the device's 6.9e-10 is why: it does not move when every solve is tightened on both codes, so it is not the tolerance ball, and device against host under tight solves is 1e-12 after two steps and 7e-10 after three -- round-off growing 700x a step through a violent transient, where a formula difference would have appeared at full size in step two. At dt 1e-3 OpenFOAM's own alpha reaches 8 on this fixture; it is a probe for one term, not a flow. THE DEVICE NOW RUNS THE CASE'S PCG WITH DIC TOO, and DIC did not have to be written. DICPreconditioner.C and DILUPreconditioner.C are the same two functions with `lower` replaced by `upper` -- same face order, same multiplication order, same divisions -- so the level-scheduled exact DILU the device already had IS DIC on a symmetric matrix. deviceDICPCG aliases lower to upper (a symmetric lduMatrix has no lower; lduMatrix::lower() returns upper) and tests/test_device_dic.cu holds it BIT-IDENTICAL, by memcmp, to a line-for-line transcription of DIC's loops, with the `lower` buffer deliberately filled with garbage. The solve arm is posed on the ITERATE at relTol 0.05, not the converged answer, on a fixture with interFoam's own 1000x coefficient jump: host and device both take 8 iterations and land 5.3e-16 apart, where Jacobi in the SAME CG loop takes 21 and lands 3.4e-03 away. (Its first fixture, a uniform laplacian on 315 cells, reached relTol 0.05 in ONE iteration, so 'the same iteration count' compared 1 with 1; the gate now refuses a fixture that takes fewer than five.) THE SOLVER'S OWN LOG IS NOW AN ORACLE: RunReport carries every p_rgh solve's initial residual, final residual and iteration count, and both OpenFOAM gates read OpenFOAM's `DICPCG: Solving for p_rgh` lines beside them. On capillaryRise and on damBreak, host and device, ALL FIFTEEN solves take OpenFOAM's iteration count (capillaryRise 1/22/165, 1/65/173, 1/43/177, 1/19/173, 1/4/126), with step one's initial residuals to 1.3e-13. capillaryRise's device arm at the case's own tolerances went 9.2e-04 -> 4.8e-08 and its bound 2e-3 -> 1e-6, which is the host's; what is left on both is the last corrector's `tolerance 1e-07` ball, inside which two correct CG runs whose reductions sum in a different order land in different places. THAT LOG THEN FOUND A DEFECT NO FIELD GATE COULD SEE. On damBreak the third solve of step one was 1.7e-06 out in its initial residual with the first two exact (0, 9.3e-14). totalPressure's updateCoeffs for a dimPressure field is p0 - 0.5*rho_b*neg(phi_b)*|U_b|^2 (totalPressureFvPatchScalarField.C:118-127), run by the fvMatrix constructor inside fvm::laplacian with rho, phi and U looked up as PATCH fields. brae's class implements it and interFoam never called it, so damBreak's atmosphere sat at p0 for the whole run with no dynamic pressure on the faces drawing air in. Fixed on both paths (updatePressurePatchesFromVelocity, refusing by name a totalPressure patch with no rho patch values rather than defaulting rho to 1, which is the incompressible form). damBreak against OpenFOAM: alpha 1.30e-12 -> 3.6e-14, p_rgh 6.5e-10 -> 8.6e-12, U 1.5e-08 -> 2.3e-11, step one's residuals 1.7e-06 -> 1.6e-13; bounds tightened to 1e-12, 2e-10 and 5e-10. That gate also has a DEVICE arm now, at the case's own tolerances -- what `brae_interFoam -device` runs -- held to the host's bounds."

  interFoam_smoothSolver:
    openfoam:
      symbol: smoothSolver
      file: src/OpenFOAM/matrices/lduMatrix/solvers/smoothSolver/smoothSolver.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/OpenFOAM/matrices/smooth_solver_cpp.cuh
    brae_target: src/matrices/lduMatrix/preconditioners/GAMGPreconditioner/device_amg_gauss_seidel.cu
    validation: "THREE LINKS, EACH MEASURED. (1) THE SWEEP against OpenFOAM's own numbers: tests/gs_ladder.cu used to carry its own inline transcription of symGaussSeidelSmoother.C, which proved that THAT copy was OpenFOAM's; its LEG 1 and LEG 3 now call brae::gaussSeidelSmoothFolded, the function the host solver runs, and hold it to OpenFOAM's residual after exactly n sweeps for n = 1..10 on T3A's real momentum system -- symGaussSeidel 8.0e-13, GaussSeidel 1.7e-13. (2) THE LOOP, tests/test_smooth_solver_cpp.cu: nIterations counts SWEEPS and the residual is evaluated once per nSweeps, so `nSweeps 2; maxIter 5` runs SIX; a negative nSweeps is a fixed count that reports NO residual; minIter forces a converged system through the loop; a mesh out of OpenFOAM's upper-triangular face order is refused, not smoothed. Its oracle is the device's deviceSymGaussSeidel in LEVEL-SCHEDULED mode: same sweep count on four solves (13, 94, 28, 187) and iterates 0.000e+00 apart -- bit-identical after 187 sweeps from two implementations that share no loop. THE FIRST DRAFT OF THAT ARM COMPARED A HOST SWEEP WITH A HOST SWEEP: deviceSymGaussSeidel's DEFAULT is to run the sweep on the CPU (faster on these meshes), so 0.000e+00 was true and said nothing. The gate now selects the device loop before the first solve and ASSERTS it got it, through deviceGaussSeidelUsesHostSmoother(). Its control: at relTol 0.05 PBiCGStab's iterate is 3.3 away from this solver's from the same initial residual. (3) END TO END, tests/interfoam_dambreak_vs_openfoam.sh, against OpenFOAM's `smoothSolver: Solving for alpha.water` log lines, host AND device: every sweep count equal, and at dt 5e-3 (OpenFOAM's counts 0, 5, 2, 2, 2) the FINAL residuals to 9.1e-10 on the host and 5.0e-09 on the device, with a PBiCGStab control that gets two counts of five and is 100% out. WHAT IT DOES NOT CLAIM: coupled interfaces. The smoothers' initMatrixInterfaces/updateMatrixInterfaces calls have nothing to do in a serial run with no coupled patch, and the host transcription omits them; a processor or cyclic patch is not covered."
    note: "Ported because interFoam's MULESCorr pre-solve names `solver smoothSolver; smoother symGaussSeidel;` in every tutorial that sets MULESCorr and the host ran DILU-PBiCGStab in its place, under a notice. The device already had OpenFOAM's (deviceSymGaussSeidel); the host did not. THREE THINGS TO GET RIGHT, none visible in a converged field: the reverse half of symGaussSeidel does NOT distribute -- it gathers off the bPrime the forward half LEFT (symGaussSeidelSmoother.C:192); nIterations counts sweeps, `(nIterations += nSweeps) < maxIter`; and the loop's residual is lduMatrix::residual (lduMatrixATmul.C:268), which starts from source - diag*psi and subtracts the off- diagonals face by face -- NOT b - A.psi. That last one is invisible until the solve ends at round-off: on damBreak the smoother stops at 1e-14, where the rounding IS the residual, and with OpenFOAM's operation order transcribed the host reproduces its final residuals to four digits there (6.835e-15, 1.202e-14, 1.851e-14, 2.067e-14). THE END-TO- END ARM TAUGHT ITS OWN LESSON ABOUT FIXTURES. At the gate's dt 1e-4 the alpha system is so diagonally dominant (Co ~ 1e-3) that every solver lands on the exact solution in ONE iteration: the PBiCGStab control read 2.6e-03 from OpenFOAM's final residuals, right beside the device's honest 1.5e-03, so the arm could not tell solvers apart and would have certified either. The gate now runs a second profile at dt 5e-3, where the interface moves 0.69 and the solve is real, and asserts the solver-log arms only there. The fields hold on that profile too: alpha 1.2e-12 and p_rgh 1.3e-12 relative on both paths, U 4.3e-12 on the host and 8.5e-12 on the device."

  interFoam_turbulence:
    openfoam:
      symbol: incompressibleInterPhaseTransportModel
      file: src/phaseSystemModels/twoPhaseInter/incompressibleInterPhaseTransportModel/incompressibleInterPhaseTransportModel.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_turbulence_cpp.cuh
    brae_target: src/TurbulenceModels/turbulenceModels/RAS/kEpsilon/kEpsilon.cu
    validation: "tests/interfoam_ras_dambreak_vs_openfoam.sh, real OpenFOAM on RAS/damBreak, five fixed steps of 1e-3, THREE PROFILES. `variable` is the tutorial as shipped; `uniform` is the same case without `density variable` (and with div(phi,k) for div(rhoPhi,k), which OpenFOAM then requires); `custom` is uniform with its own kEpsilonCoeffs, equation relaxation 0.7, and a solver tolerance of 0.5 so that `minIter 1` is what forces each sweep. MEASURED, worst of the three: alpha 4.9e-13, p_rgh 7.1e-13, U 1.3e-11, k 2.8e-13, epsilon 2.4e-13, nut 4.8e-13, and EVERY p_rgh, alpha, epsilon and k solve takes OpenFOAM's iteration count (15+5+5+5 per profile) with initial residuals to 1.8e-13. CONTROLS ON THE ORACLE: OpenFOAM run laminar is 133% of U away, its other lineage 29%, the custom settings 3.7%. WHAT EACH PROFILE CAN SEE was measured by breaking one decision at a time, once, with temporary switches that are not in the tree. On `variable`: validate() called in the wrong lineage 29% of U; rho.oldTime() taken as the current rho 5.6%; divU from the mass flux 53%; inletOutlet handed rhoPhi where it looks up phi 4.9e-04; PBiCGStab for the case's symGaussSeidel 1 of 5 iteration counts and 2.7e-06. On `variable`, ignoring minIter and ignoring the `\".*\" 1` relaxation change NOTHING, to the last digit -- which is why `custom` exists: there, ignoring minIter is 14% of U and 0 of 5 epsilon counts, ignoring the relaxation 2.2%, the coefficients 3.5% (sigmak/sigmaEps alone 0.3%, C3 alone 1.2e-08 of epsilon because divU is nearly zero). The staging asserts OpenFOAM's custom log holds a solve whose initial residual is under 0.5 and still reads one iteration. tests/interfoam_refusals.sh holds 16 turbulence arms on RAS/damBreak itself. WHAT IT DOES NOT CLAIM: any nut wall function but nutk (nutU and nutLowRe are accepted because the shared closure gates them under rhoSimpleFoam, not here); kMin/epsilonMin, which bound() never reaches on this case; a non-orthogonal mesh; more than one outer corrector with the closure on."
    note: "incompressibleInterPhaseTransportModel IS TWO MODELS BEHIND ONE KEYWORD, and brae's own refusal message had it wrong. It said interFoam's turbulence `selects a MIXTURE model and hands it the blended rho -- not the single-phase model brae already has`; that was written from memory. The source (incompressibleInterPhaseTransportModel.C:46-110): with `density` absent or `uniform` -- 15 of the 17 turbulent tutorials -- it builds incompressible::turbulenceModel::New(U, phi, mixture), the ORDINARY model, and calls validate(); with `density variable` (RAS/damBreak, laminar/damBreakPermeable) it builds phaseIncompressibleTurbulenceModel::New(rho, U, rhoPhi, phi, mixture) and does NOT call validate(). So the variable lineage's first UEqn runs on the case file's nut (uniform 0) where the other has 9e-03 from k = epsilon = 0.1, and the fvSchemes KEY differs too: div(rhoPhi,k) against div(phi,k). brae already had the closure for both -- kEpsilonRef::correct's `Compressible` struct is OpenFOAM's one templated kEpsilon.C read with rho, a field nu, the mass flux for div and the volumetric one for divU -- so the port is what it is HANDED, in inter_turbulence_cpp.cu. Both lineages take the MIXTURE's nu, a field. UEqn takes rho*nuEff with nuEff = nut + nu on cells and on every patch. turbulence->correct() runs after the last pressure corrector of the final outer corrector (interFoam.C:169-172, pimpleControl.C:51-52), where fvMatrix::solve() AND fvMatrix::relax() both select the Final name, so kFinal/epsilonFinal are the entries read and `turbOnFinalIterOnly no` with more than one outer corrector is refused. THREE THINGS THE CLOSURE NEEDED. (1) The case's linear solver: it hardwired PBiCGStab, and every kEpsilon tutorial names smoothSolver/symGaussSeidel -- the fourth time in this port a substituted solver at the same tolerance stopped somewhere else. (2) Compressible::bcPhi: inletOutlet looks up the registry's `phi`, which in rhoSimpleFoam is the equation's own mass flux and in this lineage is NOT (the equation convects with rhoPhi). The sign argument says it cannot matter; the measurement says 4.9e-04, because rhoPhi's patch values are not rho_b*phi_b at the first step. (3) A DEFECT IN THE SHARED CLOSURE, found by the `custom` profile: epsilon agreed with OpenFOAM to 1e-13 while every initial and final residual of its solve sat 1.1e-04 away, only under relaxation, only for epsilon. OpenFOAM's epsilonWallFunction is a fixedValue patch, so at relax() its faces carry the laplacian's coefficient ic and the diagonal becomes max(|D0 + ic|, sumOff)/alpha - ic; brae maps the patch to zeroGradient and got D0/alpha. setValues pins exactly those rows next, so the solution cannot see it, but the diagonal survives into normFactor and a residual is what the stopping rule reads. Fixed in the host reference: 1.1e-04 -> 4.6e-14. STILL OPEN, and not measured: the device twin kEpsilon.cu does not carry the term, and neither kOmegaSST closure does -- omegaWallFunction has the same fixedValue base class (omegaWallFunctionFvPatchScalarField.H:88-90), so the same term is expected there, which is a lead and not a measurement. It moves a residual by 1e-04, so it can matter only where a solve stops within 1e-04 of its tolerance; rhoSimpleFoam's gates, which relax at 0.7, pass with and without it. TWO LATENT SUBSTITUTIONS THE TURBULENCE REFUSAL HAD BEEN HIDING, found by asking what else would run once it lifted. `ddtSchemes default` was parsed into f.ddtU and handed to nobody, so CrankNicolson (floatingObject) and localEuler (DTCHull) would have run as Euler: now refused in buildInterFields. And laplacianSchemes/snGradSchemes were never opened: brae assembles the pressure laplacian and its three snGrads orthogonal while 28 of 44 tutorials say `corrected` or `limited`. On a mesh of rectangles that is not a substitution (the correction vector is zero; it is why damBreak agrees to 1e-12 under `Gauss linear corrected`); on any other it is, so a corrected scheme on a mesh more than 1e-10 off orthogonal is refused, and the refusals gate shears damBreak six degrees to prove both sides. `minIter` is honoured for k and epsilon and REFUSED for the alpha pre-solve and the momentum predictor, which drop it (three tutorials name it for alpha). THE CENSUS CAUGHT ITS OWN DEFECT: run with blockMesh alone it showed damBreakLeakage and damBreakPorousBaffle reaching End, on meshes without the baffles their Allrun creates. Prepared by their own Allrun utilities both are refused (porousBafflePressure by name; the leakage case in the mesh reader, on a cyclicACMI `coded` block -- a refusal, but not a named one). 33 tutorials prepare cleanly: 3 reach End and all 3 are gated; waves 9, moving meshes 12. GPU_REQUIRED AND NOT YET ON THE GPU: the target is the closure's existing device twin, which the interFoam device loop does not call. Until it does, `-device` on a RAS case is refused by name rather than run laminar."

  interFoam_vanLeer:
    openfoam:
      symbol: vanLeer
      file: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/vanLeer/vanLeer.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/cuda/device_fvm.cu
    brae_target: src/cuda/device_fvm.cu
    validation: "tests/test_scheme_blocks.cu -- the selector, with a fail-proof; and the limiter against vanLeer.H:70 directly. It asymptotes to 2, not 1: it is a Sweby TVD limiter, not a [0,1] blend, and writing the clamp limitedLinear needs would make it a different scheme."
