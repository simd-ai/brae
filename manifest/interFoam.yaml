    note: "The time loop, and the sub-cycle inside it. THE SUB-CYCLE is used by 33 of the 44 shipped tutorials (23 at nAlphaSubCycles 3), and all three ways to get it wrong leave a BOUNDED, plausible alpha field that no boundedness gate sees: running the sub-steps at the full deltaT (Time::subCycle divides it, Time.C:1006-1009), restarting each from the time step's old alpha instead of the previous sub-step's result, and taking the last rhoPhi instead of the time-weighted sum sum_k (dt_k/dt_total)*rhoPhi_k. alpha.oldTime() is also RESTORED afterwards (subCycleField's destructor), or the PIMPLE outer loop's second pass advances from the first's result. THE LOOP ORDER is not numerics but which field each equation sees: alpha advances BEFORE the momentum predictor and mixture.correct runs between them, so UEqn is built on the new rho. The single-phase order -- UEqn first -- converges fine, on last step's density, which at a water/air interface is wrong by 1000. frozenFlow's `continue` skips the turbulence corrector as well as UEqn and pEqn. adjustTimeStep/maxAlphaCo is interFoam_alphaCourantNo and is landed. WHAT interFoam.C HONOURS AND brae DID NOT EVEN READ. The next port on the list was `vanLeerV` (8 tutorials), and a census was taken first to rank it: every one of the 44 shipped tutorials was meshed and handed to brae_interFoam for one step, and brae's OWN message recorded. That changed the ranking -- all eight vanLeerV cases also carry a moving mesh, so the scheme alone unlocks none; the single-blocker counts are waves 9, turbulence 7, moving mesh 2, MRF 1, limitedLinear 1 -- and it found something worse than a missing scheme. TWO TUTORIALS REACHED `End:` THAT SHOULD NOT HAVE: laminar/damBreakWithObstacle and laminar/oscillatingBox both ask for `dynamicRefineFvMesh`, adaptive refinement driven by alpha, and brae ran them on the mesh as written without a word. brae's interFoam never opened constant/dynamicMeshDict. Seventeen more tutorials carry a moving mesh and were stopped only because they hit some OTHER refusal first. A one-input-at-a-time sweep on damBreak then found the rest: MRFProperties and fvOptions (both locations) ran silently although braeInterFoam.cu's own header listed both as refused; a DICTIONARY-form sigma -- a surfaceTensionModel -- and a MISSING sigma both became ZERO surface tension, because it was read with scalarOr(\"sigma\", 0); a setTimeStep function object, which overrides deltaT from inside Time::adjustDeltaT, was ignored; and the device loop ran nOuterCorrectors as 1 and nNonOrthogonalCorrectors as 0 whatever the case said (5 and 4 tutorials ask for more), where the host honours both. All are refused by name now, each by OpenFOAM's OWN rule read from the source: dynamicFvMesh is mandatory once the dictionary exists and only staticFvMesh is static (dynamicFvMeshNew.C:65-128); an MRF zone and an fvOption are active unless they say otherwise (MRFZone.C:553, fvOption.C:72); constant/fvOptions is looked up BEFORE system/fvOptions and OpenFOAM stops at the first (fvOptions.C:46-84); a dictionary named sigma selects a model and a scalar one has no default (surfaceTensionModelNew.C:36-66). tests/interfoam_refusals.sh holds 25 arms, and EVERY REFUSAL HAS ITS OPPOSITE beside it -- staticFvMesh, `active no` on a zone and on an option, an inactive constant/fvOptions hiding an active system/ one, sigma 0, a harmless function object -- which must still RUN, because a refusal that fires on a case OpenFOAM would run unchanged is a defect too. After it the census shows exactly two tutorials reaching `End:`: damBreak and capillaryRise, the two that are gated. That note ended by saying what it did NOT claim -- that nOuterCorrectors 2, nNonOrthogonalCorrectors 1 and momentumPredictor yes were RIGHT on the host, only that they ran. They were checked next, and two of the three were not. THREE PIMPLE CONTROLS RAN AND WERE NEVER HELD TO ANYTHING, and two of them were wrong. damBreak uses none of nOuterCorrectors 2, nNonOrthogonalCorrectors 1 or momentumPredictor yes (5, 4 and 5 of the 44 shipped tutorials set them), brae's host executed all three, and no gate compared any of them with OpenFOAM -- the position alphaApplyPrevCorr was in while it carried a wrong limiter argument. Each is now a profile of tests/interfoam_dambreak_vs_openfoam.sh at the big step, with the control on the ORACLE: the setting moves OpenFOAM's own alpha by 1.6e-01, 5.4e-04 and 7.5e-02 respectively, so a brae that ignored it could not pass. (1) nOuterCorrectors 2 WAS WRONG: alpha 4.9e-06, p_rgh 4.5e-06, U 1.0e-03, one alpha solve taking 3 sweeps for OpenFOAM's 2. The solver log localised it in one read: every FIRST-pass alpha solve exact to 1e-13, every SECOND-pass one 84% to 170% out in its initial residual, and p_rgh exact through step two's first pass. alphaEqnStep reset alpha1 to its old time at the top of every call, and alphaEqn.H has NO such assignment anywhere: the old time enters through fvmDdt's source and MULES' psi.oldTime(), while the CURRENT alpha1 is the pre- solve's initial guess, the field alphaPhiUn is built from, and what the limiter takes its extrema from (MULESTemplates.C:208 against :244). With one outer corrector the two are the same field, so the reset was a no-op for as long as the function had only ever been run that way. After: alpha 2.8e-12, U 8.6e-12, 10 of 10 alpha counts. brae's MULES already took psi and psiOld separately, as OpenFOAM's does; only the caller forced them equal. (2) nNonOrthogonalCorrectors 1 WAS RIGHT: alpha 1.2e-12, 30 of 30 p_rgh counts. (3) momentumPredictor yes FOUND THREE THINGS. OpenFOAM itself REFUSES damBreak with the predictor on -- `Entry 'UFinal' not found` -- because fvMatrix::solve() selects the Final entry on the last outer corrector and with one corrector that is the only one; brae ran the case, reading NEITHER entry: a struct default of 1e-7 on PBiCGStab on the host and a hardcoded 1e-12 on Jacobi-BiCGStab on the device, where the case says smoothSolver symGaussSeidel at 1e-06. That is the third time the same substitution has turned up (p_rgh, alpha, U). Both paths now read U and UFinal, require each exactly where OpenFOAM does, run the case's smoother (solveVector took a VectorLinearSolver; the device calls deviceSymGaussSeidel), skip the component a 2-D mesh does not solve as fvMatrixSolve.C:162-164 does, and log every solve. THEN THE HOST WAS STILL THREE ORDERS WORSE THAN THE DEVICE on the same case with the same solver and the same sweep counts -- alpha 9.1e-10 against 1.4e-12, U 9.2e-08 against 8.7e-12 -- which is a comparison that only exists because both paths are gated against the same oracle. fvMatrix::solve() ends with correctBoundaryConditions(); the host's predictor ended with evaluateBoundary() alone, and brae's pressureInletOutletVelocity keeps its STORED value through that on purpose, so the atmosphere's U_b was one solve stale going into the first pressure corrector, where totalPressure reads 0.5*rho*|U_b|^2. The device refreshed it and the host did not. One shared updateVelocityPatchesFromCells now serves the corrector, the predictor and the device driver: host alpha 1.4e-12, p_rgh 1.4e-12, U 8.4e-12, every Ux, Uy, p_rgh and alpha count OpenFOAM's on both paths. The device REFUSES the first two controls (its loop runs one outer corrector and no non-orthogonal pass), and on those profiles the gate asserts the refusal. ALONG THE WAY the residual comparison got the floor a normalised residual has: it had failed on two agreements it should have praised, a 5e-8 initial residual the two codes held 6e-18 apart ('1.3e-10 relative') and a 1.935e-14 final residual matching to four digits ('2.2e-05 relative'); below 1e-16 absolute the difference is now zero, and a different SOLVER is still nine orders above that."

