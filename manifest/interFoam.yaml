    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/alpha_eqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_alpha_step.cu
    validation: "tests/test_alpha_eqn_cpp.cu covers the FLUX ASSEMBLY. Boundedness is the gate for the MULES half and is an ASSERTION, not a tolerance: 0 <= alpha <= 1 exactly, every cell, every sub-cycle. A VoF gate that only checks agreement can pass while the field goes unbounded and is then clipped. ON THE DEVICE, tests/test_device_alpha_step.cu runs the WHOLE explicit corrector on a rotating blob -- discretely divergence-free, so boundedness means something -- against the host: alpha in [0,1] exactly, 1.1e-16 after one step and 9.99e-16 after forty of two correctors each."
    note: "SPLIT IN TWO. The flux assembly is landed: alphaControls, the off-centring, phic, phiCN, alphaPhiUn and rhoPhi. MULES is interFoam_MULES and is not. Su/Sp/divU are identically zero for THIS solver (interFoam/alphaSuSp.H is three zeroFields); they are live in interPhaseChangeFoam, which has its own. Three things the gate pins that no field shows: phic is zeroed on every NON-COUPLED boundary (alphaEqn.H:79-89, compression at an inlet sharpens an interface the boundary does not have); alphaPhiUn's compressive term is a nested flux with TWO minus signs, which cancel exactly under `Gauss linear` (31 tutorials, so the mistake is invisible there) and do not under `Gauss vanLeer` (7); and rhoPhi's two branches multiply rho2f by phiCN on the Euler path and phi on the other. Only Euler, localEuler and CrankNicolson ddt are accepted (alphaEqn.H:49-51), and CrankNicolson is refused when sub-cycling. `Gauss interfaceCompression` on div(phirb,alpha) (4 tutorials) is interFoam_interfaceCompression. THE WHOLE MULESCorr PATH NOW RUNS ON THE DEVICE and is gated end to end against the host over 40 steps at nAlphaCorr 2 / nLimiterIter 5, damBreak's own settings: 1.07e-10, and it differs from the explicit path by 3.3e-02 so the arm is not a second copy of it. Two things that gate found. CMULES' outlet test reads alphaPhiUn, not phiCN -- OpenFOAM passes talphaPhi1Un() -- and passing the volumetric flux there cost 3.99e-09 against the host. And the path is NOT exactly bounded at nLimiterIter 5: 1.307e-06, the host's number to four digits, which is the fixed-point iteration and nothing else -- the pre-solve alone is 0.000e+00 at solver tolerance 1e-12 and 1.31e-06 at 1e-6, and the final field is 0.000e+00 at nLimiterIter 40. THE IMPLICIT PRE-SOLVE IS ON THE DEVICE (device_alpha_presolve.cu): the upwind LDU, the Euler ddt, the BiCGStab solve and alpha1Eqn.flux(), with only the boundary coefficients built on the host. Its gate pins the flux by the closure alpha == alphaOld - (dt/V)*sum_f alphaPhi10, which tracks the SOLVER RESIDUAL (1.3e-12 at tolerance 1e-12, 3.0e-06 at 1e-6) where a flux rebuilt from the pre-solve field leaves a fixed 5.1e-03 and a central one 2.3e-02. THE DEVICE SPLIT IS ONE CORRECTOR PER CALL, not the nAlphaCorr loop: OpenFOAM re-evaluates alpha's boundary at the end of every MULES solve and runs mixture.correct() after that, and the next corrector's flux, gradient and limiter all read them. Looping inside the call put nHatf 2.885e-04 out on a field whose largest value is 1.736e-03, and 3.2e-09 into alpha by the end of a single step. THE PRE-SOLVE'S LINEAR SOLVER WAS A SUBSTITUTION HIDDEN BY A TOLERANCE. Every MULESCorr tutorial names `solver smoothSolver; smoother symGaussSeidel; tolerance 1e-8` for alpha. The device ran Jacobi-BiCGStab to a HARDCODED 1e-12 and the host DILU-PBiCGStab to a struct default of 1e-8; neither read the case. It matters because an implicit upwind matrix is nearly triangular in flow order, so a Gauss-Seidel sweep is nearly an exact solve -- OpenFOAM's log on damBreak reads `No Iterations 2, Final residual 9.3e-14` -- while Jacobi-BiCGStab stops AT its tolerance. Measured against real OpenFOAM, five steps of damBreak, device alpha pre-solve tolerance swept: 1e-16 -> alpha 5.5e-11; 1e-12 (the hardcoded value) -> 1.6e-10; 1e-8 (THE CASE'S OWN) -> alpha 3.3e-06 and U 1.2e-03. The 1.6e-10 had been in the device/host gate all along, under a bound of 1e-8 and a comment attributing it to 'the pre-solve's residual' -- which was true and was not followed. The device had OpenFOAM's smoother already (deviceSymGaussSeidel: smoothSolver's stopping rule around symGaussSeidelSmoother's own sweep, level-scheduled and exact, gated by gs_ladder). With the case's entry read (InterFields::aSolve, lduMatrix's defaults, refused when MULESCorr names no solver) and the device on it at the case's 1e-8: device against OpenFOAM alpha 1.6e-10 -> 3.6e-14, p_rgh 2.1e-10 -> 8.6e-12, U 3.8e-08 -> 2.3e-11 -- the host's numbers to three digits -- and device against host through the shipped drivers alpha 1.6e-10 -> 1.1e-15, U 3.7e-08 -> 2.6e-14 relative, p_rgh 2.5e-10 -> 2.5e-14, the adaptive clock 3e-10 -> 2e-12. Every bound in tests/test_device_inter_dambreak_alpha.cu followed, from 1e-8/1e-7/1e-6 to 1e-13/1e-12/1e-12. THE HOST SUBSTITUTED TOO (DILU-PBiCGStab, under a notice) until it had a smoothSolver of its own -- see interFoam_smoothSolver. On damBreak that was measured harmless, 3.6e-14, because DILU on a near-triangular matrix is as nearly exact as the sweep; measured on one case, not proven, which is why it was closed rather than left. Any alpha solver that is not smoothSolver with a Gauss-Seidel smoother still runs BiCGStab on both paths, under a notice that carries the 3.3e-06. `alphaApplyPrevCorr` WAS HALF PORTED AND THE OTHER HALF WAS SILENT. alphaEqn.H:133-150 and :228-236: the compression flux the correctors ended on is cached in talphaPhi1Corr0 and the NEXT pre-solve applies it, limited through MULES::correct, before its own correctors run. Three shipped tutorials set it (floatingObject, DTCHull, DTCHullMoving) and brae refuses all three for other reasons -- RAS, moving meshes, LTS -- so no tutorial can gate it; OpenFOAM honours it on any MULESCorr case and damBreak is one. THE HOST had an implementation nothing had ever run. THE DEVICE had nothing at all -- no code and NO REFUSAL -- so `brae_interFoam -device` on such a case ignored the switch and said nothing. Measured on damBreak at dt 5e-3 with the switch on, before any change: host alpha 1.2e-12 from OpenFOAM, device 1.0690e-02 -- to five digits OpenFOAM's own distance from itself with the switch OFF -- and U 15% out. Now implemented on the device with the two CMULES primitives it already had (deviceMulesLimitCorr, deviceMulesCorrect); the cache is owned by the CALLER because it outlives the call, and the switch without a cache, without MULESCorr, or without the curvature-free refreshBoundary hook is refused by name. Device after: alpha 1.2e-12, p_rgh 1.7e-12, U 9.2e-12, every p_rgh and alpha iteration count OpenFOAM's. Gated as two more profiles of tests/interfoam_dambreak_vs_openfoam.sh. `prevcorr` asserts that OpenFOAM's log says `Applying the previous iteration compression flux` -- an oracle that never took the path would agree with a brae that ignored it -- and its control is that the switch moves OpenFOAM's OWN alpha by 1.07e-02, nine orders more than brae's distance from it. `prevcorrsub` adds nAlphaSubCycles 2, because the cache outlives the SUB-CYCLE as well as the time step and damBreak's own count of 1 cannot tell a cache that crosses from one that is reset: ten alpha solves (0, 0, 3, 3, 2, 2, 2, 2, 2, 2), every count equal on both paths, alpha 1.6e-12, and the sub-cycle count moves OpenFOAM's own alpha by 8.2e-02. ONE FIX HERE WAS MADE FROM THE SOURCE FIRST AND MEASURED AFTERWARDS, and the measuring is the part worth keeping. The host passed phiCN, the VOLUMETRIC flux, as MULES::correct's flux argument where OpenFOAM passes alphaPhi10 (alphaEqn.H:140). limiterCorr reads it in one place, the boundary outlet test `(phi_b + phiCorr_b) > SMALL*SMALL` (CMULESTemplates.C:546) -- the same slip the corrector loop had, fixed there at 3.99e-09 -> 1.07e-10. IT TOOK THREE FIXTURES. (1) damBreak: the host's numbers are the same to five digits either way, because the boundary half of the cached correction is zero unless alpha's patch value moves between the pre-solve and the correctors, which needs water LEAVING through an outflow face. (2) The water column raised to the atmosphere, dt 5e-3: water does leave, and a probe counting the faces on which the two tests DECIDE DIFFERENTLY found up to 13 a step, on corrections worth 15% of the face flux -- and the answer was still bit-identical, alpha 5.8831e-13 both ways. Running the limiter both ways on the same state showed why: the limited correction came out identical, because on those faces the cell limiter returned 1 and made the decision moot. A difference in a DECISION is not a difference in an ANSWER. (3) The same fixture at dt 1e-2, found by sweeping brae alone for a step where the two limited corrections actually differ: one application there moves one cell's alpha by 0.10. Against real OpenFOAM, four steps: with phiCN alpha 5.5e-03, p_rgh 5.7e-03, U 2.2e-02; with alphaPhi10 4.6e-13, 2.7e-13, 5.5e-13 -- ten orders from one argument. The device, written with the right argument from the start, reads 4.7e-13, 2.9e-13 and 4.5e-11 on it. Gated as the `outflow` profile, whose control is on BRAE rather than the oracle: the host runs again with BRAE_CONTROL_PREVCORR_PHICN set (read in the driver as BRAE_PTOL is, announced on every step it is on, and carried by AlphaStepInput::controlPrevCorrOutletOnPhiCN, which no solver sets) and must come out more than 1e-6 from OpenFOAM. It reads 5.5193e-03. The sweep also bounds the fixture: at dt 2e-2 alpha leaves [-0.34, 1.12] and the inflow variants go to NaN, so dt 1e-2 for four steps is what this case can carry."

  interFoam_MULES:
    openfoam:
      symbol: "MULES::limiter"
      file: src/finiteVolume/fvMatrices/solvers/MULES/MULES.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/fvMatrices/solvers/MULES/mules_cpp.cuh
    brae_target: src/finiteVolume/fvMatrices/solvers/MULES/device_mules.cu
    validation: "tests/test_mules_cpp.cu. The oracle is BOUNDEDNESS, not a stored field, which is what makes the gate possible at all -- a stock run never writes the limiter. It is a PAIR of arms, because either alone is trivially satisfiable: the limited run stays in [0,1] exactly where the unlimited one does not, AND a monotone in-bounds field comes back with lambda == 1 on every face away from the domain ends. lambda == 0 everywhere passes the first and fails the second, and it is first-order upwind -- the case's scheme silently discarded."
    note: "THE LARGEST SINGLE PIECE, and the least brae-like. An EXPLICIT, ITERATIVE, bound-preserving flux limiter -- not a matrix assembly -- so almost none of the fvm:: machinery the other solvers share applies. Landed: limiter, limit, explicitSolve. Four things the gate pins that no converged field shows: psiMaxn/psiMinn are initialised SWAPPED (:280-281) so the neighbour scan builds from the far end; the neighbourhood extrema EXCLUDE the cell's own value, which is what lets an interface advance; phiBD is overwritten with phiPsi on every non-coupled boundary so the prescribed flux is never limited (:600-609); and a wedge patch gets lambda = 0 outright (:530-533). Two things measured and NOT claimed: the running min(lambda,...) is defensive rather than load-bearing (removing it gives a bit-identical field, because both accumulators are built from lambda), and in one dimension the first pass is already the fixed point -- nLimiterIter only bites where a cell's faces are limited by different neighbours at once."

  interFoam_CMULES:
    openfoam:
      symbol: "MULES::correct"
      file: src/finiteVolume/fvMatrices/solvers/MULES/CMULESTemplates.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/fvMatrices/solvers/MULES/mules_cpp.cuh
    brae_target: src/finiteVolume/fvMatrices/solvers/MULES/device_mules.cu
    validation: "tests/test_mules_cpp.cu arm 7. Shares the boundedness oracle; the four structural differences from the explicit path are asserted one by one, each with its own fail-proof. ON THE DEVICE, tests/test_device_mules_corr.cu repeats A, B, C and the empty-patch skip against the host limiter: psi stays in [0,1] exactly where the unlimited control reaches 4.0e-01, and lambda came out bit-identical on all 264 faces, 32 of them strictly inside (0,1) -- not guaranteed, since the budgets are gathers there and a face loop here, so the gate keeps a tolerance."
    note: "LANDED AND RUNNING on damBreak's own mesh. The semi-implicit variant, `MULESCorr yes` -- 13 of the 44 shipped tutorials, damBreak included. With it the upwind part of the alpha equation goes through an implicit MATRIX, so by the time CMULES runs psi is ALREADY advanced and only the antidiffusive correction is left. Four consequences, all of them places a port that reuses the explicit code is quietly wrong. (A) correct() uses the CURRENT rho and psi, not their oldTime values: with a zero correction it is the identity, where the explicit form would hand back psi.oldTime() and undo the implicit solve -- bounded, so a boundedness gate never notices, the interface just moves at the wrong speed. (B) the budget transform carries NO sumPhiBD, because there is no donor flux. (C) uncoupled boundary faces ARE limited, but outlets only, and `outlet` means phi + phiCorr > SMALL*SMALL -- the TOTAL, so an inflow face whose correction reverses it is limited like any other. (D) nLimiterIter is get<label> with NO DEFAULT here where the explicit limiter defaults it to 3, so the same dictionary is accepted by one reader and refused by the other. MEASURED on damBreak: 20 alpha steps on a projected divergence-free flux leave the field within 2.1e-11 of [0,1] against the explicit path's 9.5e-14. Three sweeps characterise that gap: it is present at step 0 and barely accumulates; it is INDEPENDENT of the linear-solver tolerance (1e-8 to 1e-14 moves it not at all) while the MASS DRIFT tracks that tolerance exactly; and it scales as about dt^4. So conservation is the solve's accuracy and boundedness is a conditioning effect in the budget that grows with the correction. The exact mechanism is not attributed; the gate asserts the characterisation -- the bound AND the scaling -- so a change in behaviour fails rather than being absorbed. NOT CMULES, AS IT TURNED OUT: on damBreak over ten adaptive steps brae's alpha reached 1 + 2.306e-06 where real OpenFOAM reached 1 + 1.1361e-06, 1.98x, and it was first recorded here as an open CMULES gap. Measuring it put it elsewhere. interFoam's alphaSuSp.H has no divU, so the MULESCorr pre-solve on a full cell gives a = 1/(1 + dt*div(phi)) and the excursion is dt times the continuity error the PRESSURE solve left. Tightening only the alpha solve changed nothing to the last digit; tightening only p_rgh took both codes from 1.16e-06 to 4.9e-13. The per-step ratio ran 0.12x to 3.18x, not a steady 2x. Closed under interFoam_pEqn, and test_inter_case_cpp now holds it at OpenFOAM's own value to 2% (0.9931x). OpenFOAM prints Max(alpha.water) TWICE a step -- after the pre-solve (alphaEqn.H:124) and after the correctors (alphaEqn.H:263) -- and the gate's constant had been taken from the first while it reads the second."

  interFoam_interfaceProperties:
    openfoam:
      symbol: interfaceProperties
      file: src/transportModels/interfaceProperties/interfaceProperties.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/interfaceProperties/interface_properties_cpp.cuh
    brae_target: src/transportModels/interfaceProperties/device_interface_properties.cu
    validation: "tests/test_interface_properties.cu (the dictionaries) and tests/test_interface_curvature_cpp.cu (K itself). NO INSTRUMENTED OpenFOAM WAS NEEDED: curvature is GEOMETRY. A plane's spurious K is 5+ orders below a real one and tracks deltaN; a sphere of radius R gives 2/R to 0.1% at 16^3 and the error FALLS on refinement, which is what makes the bound the scheme's rather than the mesh's; a bubble gives the exact negative; and the contact angle has the exact postcondition acos(nHat & nf) == theta."
    note: "K_ = -div(nHatf) with nHatf = (gradAlphaf/(|gradAlphaf| + deltaN)) & Sf (interfaceProperties.C:141-153), plus the alphaContactAngle correction on wall patches. surfaceTensionForce() = interpolate(sigma*K)*snGrad(alpha1). THE MINUS in K is the sign convention for the whole solver -- drop it and every surface-tension force points the wrong way with the right magnitude, which a flat-interface test cannot see because -0 is 0. fvc::grad(alpha1, \"nHat\") resolves a NAMED gradScheme. The contact-angle correction also writes alpha's own WALL GRADIENT (acap.gradient() = (nf & nHat)*mag(gradAlphaf)), not only the normal used for curvature; only laminar/capillaryRise sets one. nAlphaSmoothCurvature is set by NO shipped tutorial anywhere in OpenFOAM; smoothing is fvc::average, which is AREA-WEIGHTED and indistinguishable from a plain mean on a cube, so its gate runs on anisotropic cells. Combining it with a leastSquares gradient is refused by name -- there is no case to validate that against. INSTRUMENTED 2026-09-16: tools/dumpInterfaceK reads K, nHatf, the surface-tension force and alpha's post-correct boundary from OpenFOAM's UNMODIFIED class -- nHatf() and sigmaK() are public, so nothing is copied or patched. It found that calculateK is a FIXED POINT: it reads the wall gradient correctContactAngle wrote at the end of its own previous pass, so on capillaryRise that gradient runs 7070.5 -> 8659.4 -> 9353.1 -> 9681.2 over four passes and the curvature depends on WHERE the solver calls it, not only on the formula. brae's formula is exact -- 2.5e-14 relative against OpenFOAM at every one of four pass counts (tests/interfoam_curvature_vs_openfoam.sh) -- and its call sites were wrong: at the top of each alpha corrector instead of the bottom, absent from createFields, and absent from the mixture.correct() between the sub-cycle and UEqn. Fixing those took capillaryRise from 24.9% to 12.8%."

  interFoam_twoPhaseMixture:
    openfoam:
      symbol: twoPhaseMixture
      file: src/transportModels/twoPhaseMixture/twoPhaseMixture/twoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: "rho and mu as alpha-weighted blends, against OpenFOAM's own fields at iteration 1."
    note: "Field plumbing rather than new numerics: rho = alpha1*rho1 + (1-alpha1)*rho2, same for mu."

  interFoam_immiscibleMixture:
    openfoam:
      symbol: immiscibleIncompressibleTwoPhaseMixture
      file: src/transportModels/immiscibleIncompressibleTwoPhaseMixture/immiscibleIncompressibleTwoPhaseMixture.C
    classification: MODEL
    brae_status: REIMPLEMENT
    brae_reference: src/transportModels/twoPhaseMixture/two_phase_mixture_cpp.cuh
    brae_target: src/transportModels/twoPhaseMixture/device_two_phase_mixture.cu
    validation: Shares the twoPhaseMixture gate.
    note: "Joins twoPhaseMixture and interfaceProperties into the one object interFoam.C holds -- AND THE ORDER IT JOINS THEM IN IS PART OF THE ANSWER. correct() is calcNu() THEN interfaceProperties::correct() (immiscibleIncompressibleTwoPhaseMixture.H:78-82), and at a contact-angle wall the second call rewrites alpha's patch gradient and so its patch value. Three things follow, all measured on capillaryRise against tools/dumpInterFoam and together the whole of the 0.7% that case carried: (1) the boundary viscosity is blended BEFORE the curvature pass; brae did it after, and UEqn.A() was exact in every cell off the wall and 1.26% high in the air cells at it -- 0.2% of U after one step, before the contact line had moved a face. (2) `alpha2 = 1.0 - alpha1` (alphaEqn.H:151 and :223) is a whole-field assignment one line ABOVE mixture.correct(), so alpha2's PATCH values are one contact-angle pass older than alpha1's, and `rho == alpha1*rho1 + alpha2*rho2` blends the two: 7.4e-05 of rho*nu at the wall with 1 - alpha1, 1e-17 with the stale value carried (InterFields::alpha2Bnd on the host, deviceBoundaryRho on the device). (3) because the curvature pass has that side effect, the NUMBER of passes is part of the answer -- the gradient runs 7070.5, 8659.4, 9353.1, 9681.2 -- and the device's alpha-boundary hook ran the host's calculateK on every call, including the sub- step's reset of alpha1, which is not a mixture.correct(): five passes a step where OpenFOAM takes three, K 0.6% out at the contact line and U 1.9% out after ONE step. The hook is now two (DeviceInterAlphaHooks::refreshBoundary). damBreak has no contact angle, where calculateK has no side effect, and could see none of the three."

  interFoam_UEqn:
    openfoam:
      symbol: UEqn
      file: applications/solvers/multiphase/interFoam/UEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_ueqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_ueqn.cu
    validation: "tests/test_inter_ueqn_cpp.cu, and end to end at 3.3e-06 relative in U on damBreak against real OpenFOAM. ON THE DEVICE, tests/test_device_inter_ueqn.cu: fvc::reconstruct pinned by its own identity -- reconstruct(V & Sf) == V to 0.000e+00 on 2:1:0.5 cells, where the div-sign convention gives 2.5e+00 -- and bit-identical to the host on a non-uniform flux; the ddt bit-identical, with rho.oldTime() replaced by rho measured at exactly 1000.0x, the density ratio; and the p_rgh body force on a hydrostatic start 0.000e+00 in the bulk against 1.96e+04 at the interface, which is what the formulation is FOR. mu = rho*nuEff is bit-identical too, and its FACE value is the product interpolated ONCE -- interpolating the two factors separately is 3.4e-03 where the right answer is 1.0e-03. The device ASSEMBLY reuses gpu::assembleUEqn with rhoPhi and mu; that gained an optional fvm::ddt(rho,U) applied BEFORE relax(), and a relaxEquation flag so relax(1) still runs the diagonal-dominance clamp -- damBreak's fvSolution says `equations { \".*\" 1; }` and skipping it there would differ from OpenFOAM on every shipped interFoam tutorial. THE ASSEMBLED MATRIX IS GATED WHOLE (tests/test_device_inter_ueqn_assembly.cu) against the host's assembleUEqn on a VoF state: off-diagonals and boundary coefficients bit-identical, the relaxed diagonal 1.1e-13 of 1.0e+06 and the source 5.8e-11 of 4.5e+05. Two things it measures that no solved field could: relax(1)'s diagonal-dominance clamp MOVES the diagonal by 1.2e+03, so skipping relax at alpha == 1 is a different matrix; and passing rho for rho.oldTime() puts the ddt source 1000.0x out in exactly 64 of 512 cells -- one layer, the one the interface crossed. THE WHOLE PREDICTOR is gated there too: the reconstructed face force lands in the source to 1.2e-16 relative, negating it on the device moves the source by 2.00x the force exactly (a sign flip's signature), and the force is 15.4% of the final source -- so assembling and relaxing BEFORE adding it, which is what OpenFOAM does, is not cosmetic."
    note: "fvm::ddt(rho,U) + fvm::div(rhoPhi,U) + MRF.DDt(rho,U) + turbulence->divDevRhoReff(rho,U), with the momentum predictor's source reconstructed from surfaceTensionForce() - ghf*snGrad(rho) - snGrad(p_rgh). Assembly from pieces brae already had, EXCEPT two. (1) fvm::ddt(rho,U) puts rho on the diagonal and rho.oldTime() in the SOURCE (EulerDdtScheme.C:455-467); here those differ by the water/air ratio in every cell the interface crossed, so carrying one rho field is a 1000x error exactly at the interface. (2) the momentum source is a reconstructed FACE flux, not a cell gradient, and `solve(UEqn == R)` adds it with a PLUS where rhoSimpleFoam's twin carries the minus inside R. MRF, fvOptions, localEuler/CrankNicolson ddt and `Gauss limitedLinear` on div(rhoPhi,U) are refused by name."

  interFoam_pEqn:
    openfoam:
      symbol: pEqn
      file: applications/solvers/multiphase/interFoam/pEqn.H
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_peqn_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_peqn.cu
    validation: "tests/test_inter_peqn_cpp.cu covers the four parts that are interFoam's own; the laplacian, the solve and the non-orthogonal loop are shared machinery gated elsewhere. ON THE DEVICE, tests/test_device_inter_peqn.cu: all four bit-identical to the host, each beside its own wrong version on a fixture built to make that version wrong -- rAU = dt/rho so the interface carries a 1000x jump. Carrying snGrad(p_rgh) into phig moves it by 1.4e+02 of 1.3e+02; interpolate(rho)*interpolate(rAU) is 2.5e-01 where the true product is dt = 1.0e-03 exactly, i.e. 250x; reconstruct without the rAUf division is 8.7e-01 out in U; and a constant ddtCorr coefficient instead of the limiter is 1.5e+02 of 4.0e+02, while the real one is 0.000e+00 on every value-fixing patch. THE p_rgh MATRIX IS ASSEMBLED ON THE DEVICE TOO and gated as a MATRIX -- off-diagonals bit-identical, diagonal 1.7e-18 of 1.1e-02 and source 4.4e-16 of 2.2e+00 -- with two arms a solved field could not show: fvMatrix::operator== is a PLUS (taking it as a minus moves the source by twice its own size, and still converges), and setReference DOUBLES the diagonal entry rather than replacing the row, touching no other cell. phiHbyA's two interFoam-only terms and pEqn.flux() are bit-identical to the host on both sides -- and dropping phig's BOUNDARY half moves fvc::div(phiHbyA) by 9.4e+01 of 1.9e+02, half the source, because `phiHbyA += phig` is a whole-surfaceScalarField operation and the divergence sums the boundary faces. On capillaryRise, where momentumPredictor is off, that is the only route surface tension has into the solution. ONE WHOLE PASS runs on the device (device_inter_pressure_step.cu, stages 1-4 reusing simpleFoam's pressurePredictor) and is gated against the host's pressureCorrector: p_rgh 4.0e-11 relative, U 1.6e-12, p rebuilt exactly. Two arms measure placements: dropping phig's boundary half moves the SOLVED p_rgh by 6.1e+05 of 1.2e+06 -- HALF the field, not just the flux -- and p is 0.000e+00 from p_rgh_solved + rho*gh against 1.2e+06 from the p_rgh the pass started with, which is the difference between rebuilding p and carrying it."
    note: "rAU = 1/UEqn.A(), phiHbyA, the p_rgh laplacian, then U and phi rebuilt. Four things are not shared with any other pressure corrector. (1) phig carries NO snGrad(p_rgh) where UEqn's source does -- the pressure gradient is explicit there and IMPLICIT here, and carrying it twice still converges, to the wrong balance at the interface. (2) ddtCorr is weighted by interpolate(rho*rAU), the PRODUCT interpolated once, not by interpolate(rho)*rAUf: rAU is of order dt/rho, so the two factors jump opposite ways across the interface and the rival form is 250x out there while agreeing exactly on any single-phase fixture. (3) the velocity correction divides by rAUf INSIDE reconstruct and multiplies by rAU outside -- identical for a uniform rAU, which is every easy fixture. (4) when p_rgh has no value-fixing patch, p is shifted AND p_rgh is rebuilt from the shifted p; damBreak's totalPressure atmosphere hides this, 8 shipped tutorials do not. THE SOLVE ITSELF WAS A SUBSTITUTION IN TWO WAYS, and on a VoF case it shows. brae ran PBiCGStab where every damBreak-family tutorial names `solver PCG; preconditioner DIC;`, and took relTol from p_rghFinal for all three correctors where pEqn.H:50 solves with p_rgh.select(pimple.finalInnerIter()) -- `p_rgh` (relTol 0.05) for the first two, `p_rghFinal` for the last (pimpleControlI.H:98-111). Both are fixed: brae::pcg is lduMatrix PCG + DICPreconditioner (gated in tests/test_pcg.cu), InterFields reads both entries with lduMatrix::solver's own defaults (tolerance 1e-6, maxIter 1000 -- brae had 2000), a missing p_rghFinal is refused by name, and any other solver still runs PBiCGStab under a noticeApproximated that says it moves the stopping point, not just the cost. MEASURED on damBreak against real OpenFOAM, five fixed steps on the case's own solves: alpha 1.24e-08 -> 2.2337e-12, p_rgh 3.35e-06 -> 7.194e-10 relative, U 9.76e-06 -> 1.966e-08 relative, and the gate bounds tightened to 5e-11, 1e-8 and 4e-7 with them. Over ten adaptive steps alpha's over-1 excursion -- which is dt times this solve's continuity error -- went from 0.12-3.18x OpenFOAM's to 0.99-1.00x. Each half alone is not enough: PCG with the old relTol gave 0.73-4.90x, PBiCGStab with the per-corrector selection 1.98-18.41x. This is the lesson turbulentFlatPlate:kEpsilon taught about DILU: a substituted solver at the same tolerance does not only cost differently, it STOPS somewhere else. capillaryRise does not move (0.7%), so that gap is not this. (The device ran its own solver on p_rgh at this point; it takes the case's too now -- see the end of this note.) WHAT capillaryRise's 0.7% WAS, since it was not the solver: three defects in how the mixture meets a contact-angle wall (interFoam_immiscibleMixture) and one here. OpenFOAM's flux-conditional patches LOOK PHI UP when they update -- pressureInletOutletVelocity, inletOutlet, totalPressure all call lookupPatchField(phiName_) inside updateCoeffs -- and brae's are TOLD, through updateFromFlux, which interFoam never called. Every such face was therefore an OUTFLOW face for the whole run. capillaryRise's bottom inlet draws water IN, so its pressureInletOutletVelocity lost the two fixed tangential components and with them 2/3 muEff magSf deltaCoeffs of UEqn.A() in every cell of the bottom row: 5.33e+05 by that formula, 5.339e+05 measured against OpenFOAM's own UEqn.A() dump. It appears at step two because step one starts from rest. Fixed with pushFluxToPatches (at start-up, inside pressureCorrector between `phi = phiHbyA - p_rghEqn.flux()` and U's boundary evaluation, which is pEqn.H's order, and after the corrector loop for alpha's inletOutlet); the device had the same omission plus its own -- it never called deviceUpdatePressureInletOutletVelocity, so its inflow faces stayed zeroGradient -- and agreed with the host only while the host was wrong the same way. RESULT, tests/interfoam_capillaryrise_vs_openfoam.sh, five steps: U 2.8e-03 -> 2.1e-08 (0.7% -> 5.0e-08 of |U|), alpha 4.6e-05 -> 4.6e-09, p_rgh 1.3e-04 -> 8.1e-08 relative, wall gradient 4.5e-05 -> 5.2e-09 of its peak, UEqn.A() to 4.3e-09 and the wall's rho*nu to 1e-17; with every solve tightened the host is 5.5e-14 of |U| after one step. The gate's bound went 0.02 -> 1e-6 and it now checks alpha, p_rgh and the pressure corrector's terms wall-against-rest. damBreak moved too, the right way: alpha 2.23e-12 -> 1.30e-12, p_rgh 7.2e-10 -> 6.5e-10, U 2.0e-08 -> 1.5e-08. THE DEVICE now has a gate on this case, against OpenFOAM directly: 3.5e-08 with every solve tightened on both codes (2.2e-12 after one step), and 9.2e-04 at the case's own tolerances, which WAS its p_rgh solver stopping somewhere the case's PCG+DIC does not -- closed since, 4.8e-08. snGrad(rho) ON A PATCH WAS CARRIED HERE AS `LATENT` AND IT IS NOT SMALL. createFields.H builds rho from `alpha1*rho1 + alpha2*rho2`, so its patches are `calculated` and their snGrad() is the base class's, deltaCoeffs*(rho_b - rho_cell) (fvPatchField.C:220-223); brae took fvc::snGrad(rho) from a zeroGradient copy, which is 0 on every patch. On a fixedFluxPressure wall the term cancels through constrainPressure, and everywhere else on damBreak and capillaryRise alpha's patch value equals the cell's, so no shipped- tutorial gate could see it and this note said so. THE FIXTURE THAT SEES IT took two attempts, and the first is worth keeping: raising damBreak's water column to the atmosphere did NOT exercise the term -- brae already agreed to 3.6e-13 -- because the faces over the water turned out to be OUTFLOW (the patch fixes p_rgh, not p, so the column top sees the lower pressure) and OpenFOAM's own dumped boundary snGrad(rho) was `uniform 0`. What does it is the atmosphere's inletValue set to 1, so water enters over air cells: OpenFOAM's boundary snGrad(rho) is then 1.57e+05 on 19 of 46 faces, phig there is 1.66e-02 against a phiHbyA of 2.5e-06 -- four orders above everything else in the pressure source -- max|U| goes 0.19 -> 20 m/s in ONE step, and brae was 100% out in alpha, p_rgh and U from the second step on, with step two's alpha solve still exact (4.4e-13) and its first p_rgh solve 100% different. Fixed on both paths with rho's real patch values (rhoWithPatchValues; the device hands its own rhoBnd, which carries alpha2's one-pass-older patch values, to the interfaceForces hook, and a missing patch value is refused by name rather than defaulted to the cell's). Gated as the `inflow` profile of tests/interfoam_dambreak_vs_openfoam.sh, three steps: host alpha 1.3e-14, p_rgh 4.3e-11, U 6.1e-13; device 2.3e-14, 6.9e-10, 5.8e-10; every p_rgh and alpha iteration count OpenFOAM's; the water let in equal to 1e-12. Its control is on the ORACLE: OpenFOAM's own answer is 67x the standard case's whole velocity away from the standard case's, so agreeing with it cannot be had without the term. THREE STEPS ONLY, and the device's 6.9e-10 is why: it does not move when every solve is tightened on both codes, so it is not the tolerance ball, and device against host under tight solves is 1e-12 after two steps and 7e-10 after three -- round-off growing 700x a step through a violent transient, where a formula difference would have appeared at full size in step two. At dt 1e-3 OpenFOAM's own alpha reaches 8 on this fixture; it is a probe for one term, not a flow. THE DEVICE NOW RUNS THE CASE'S PCG WITH DIC TOO, and DIC did not have to be written. DICPreconditioner.C and DILUPreconditioner.C are the same two functions with `lower` replaced by `upper` -- same face order, same multiplication order, same divisions -- so the level-scheduled exact DILU the device already had IS DIC on a symmetric matrix. deviceDICPCG aliases lower to upper (a symmetric lduMatrix has no lower; lduMatrix::lower() returns upper) and tests/test_device_dic.cu holds it BIT-IDENTICAL, by memcmp, to a line-for-line transcription of DIC's loops, with the `lower` buffer deliberately filled with garbage. The solve arm is posed on the ITERATE at relTol 0.05, not the converged answer, on a fixture with interFoam's own 1000x coefficient jump: host and device both take 8 iterations and land 5.3e-16 apart, where Jacobi in the SAME CG loop takes 21 and lands 3.4e-03 away. (Its first fixture, a uniform laplacian on 315 cells, reached relTol 0.05 in ONE iteration, so 'the same iteration count' compared 1 with 1; the gate now refuses a fixture that takes fewer than five.) THE SOLVER'S OWN LOG IS NOW AN ORACLE: RunReport carries every p_rgh solve's initial residual, final residual and iteration count, and both OpenFOAM gates read OpenFOAM's `DICPCG: Solving for p_rgh` lines beside them. On capillaryRise and on damBreak, host and device, ALL FIFTEEN solves take OpenFOAM's iteration count (capillaryRise 1/22/165, 1/65/173, 1/43/177, 1/19/173, 1/4/126), with step one's initial residuals to 1.3e-13. capillaryRise's device arm at the case's own tolerances went 9.2e-04 -> 4.8e-08 and its bound 2e-3 -> 1e-6, which is the host's; what is left on both is the last corrector's `tolerance 1e-07` ball, inside which two correct CG runs whose reductions sum in a different order land in different places. THAT LOG THEN FOUND A DEFECT NO FIELD GATE COULD SEE. On damBreak the third solve of step one was 1.7e-06 out in its initial residual with the first two exact (0, 9.3e-14). totalPressure's updateCoeffs for a dimPressure field is p0 - 0.5*rho_b*neg(phi_b)*|U_b|^2 (totalPressureFvPatchScalarField.C:118-127), run by the fvMatrix constructor inside fvm::laplacian with rho, phi and U looked up as PATCH fields. brae's class implements it and interFoam never called it, so damBreak's atmosphere sat at p0 for the whole run with no dynamic pressure on the faces drawing air in. Fixed on both paths (updatePressurePatchesFromVelocity, refusing by name a totalPressure patch with no rho patch values rather than defaulting rho to 1, which is the incompressible form). damBreak against OpenFOAM: alpha 1.30e-12 -> 3.6e-14, p_rgh 6.5e-10 -> 8.6e-12, U 1.5e-08 -> 2.3e-11, step one's residuals 1.7e-06 -> 1.6e-13; bounds tightened to 1e-12, 2e-10 and 5e-10. That gate also has a DEVICE arm now, at the case's own tolerances -- what `brae_interFoam -device` runs -- held to the host's bounds."

  interFoam_smoothSolver:
    openfoam:
      symbol: smoothSolver
      file: src/OpenFOAM/matrices/lduMatrix/solvers/smoothSolver/smoothSolver.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/OpenFOAM/matrices/smooth_solver_cpp.cuh
    brae_target: src/matrices/lduMatrix/preconditioners/GAMGPreconditioner/device_amg_gauss_seidel.cu
    validation: "THREE LINKS, EACH MEASURED. (1) THE SWEEP against OpenFOAM's own numbers: tests/gs_ladder.cu used to carry its own inline transcription of symGaussSeidelSmoother.C, which proved that THAT copy was OpenFOAM's; its LEG 1 and LEG 3 now call brae::gaussSeidelSmoothFolded, the function the host solver runs, and hold it to OpenFOAM's residual after exactly n sweeps for n = 1..10 on T3A's real momentum system -- symGaussSeidel 8.0e-13, GaussSeidel 1.7e-13. (2) THE LOOP, tests/test_smooth_solver_cpp.cu: nIterations counts SWEEPS and the residual is evaluated once per nSweeps, so `nSweeps 2; maxIter 5` runs SIX; a negative nSweeps is a fixed count that reports NO residual; minIter forces a converged system through the loop; a mesh out of OpenFOAM's upper-triangular face order is refused, not smoothed. Its oracle is the device's deviceSymGaussSeidel in LEVEL-SCHEDULED mode: same sweep count on four solves (13, 94, 28, 187) and iterates 0.000e+00 apart -- bit-identical after 187 sweeps from two implementations that share no loop. THE FIRST DRAFT OF THAT ARM COMPARED A HOST SWEEP WITH A HOST SWEEP: deviceSymGaussSeidel's DEFAULT is to run the sweep on the CPU (faster on these meshes), so 0.000e+00 was true and said nothing. The gate now selects the device loop before the first solve and ASSERTS it got it, through deviceGaussSeidelUsesHostSmoother(). Its control: at relTol 0.05 PBiCGStab's iterate is 3.3 away from this solver's from the same initial residual. (3) END TO END, tests/interfoam_dambreak_vs_openfoam.sh, against OpenFOAM's `smoothSolver: Solving for alpha.water` log lines, host AND device: every sweep count equal, and at dt 5e-3 (OpenFOAM's counts 0, 5, 2, 2, 2) the FINAL residuals to 9.1e-10 on the host and 5.0e-09 on the device, with a PBiCGStab control that gets two counts of five and is 100% out. WHAT IT DOES NOT CLAIM: coupled interfaces. The smoothers' initMatrixInterfaces/updateMatrixInterfaces calls have nothing to do in a serial run with no coupled patch, and the host transcription omits them; a processor or cyclic patch is not covered."
    note: "Ported because interFoam's MULESCorr pre-solve names `solver smoothSolver; smoother symGaussSeidel;` in every tutorial that sets MULESCorr and the host ran DILU-PBiCGStab in its place, under a notice. The device already had OpenFOAM's (deviceSymGaussSeidel); the host did not. THREE THINGS TO GET RIGHT, none visible in a converged field: the reverse half of symGaussSeidel does NOT distribute -- it gathers off the bPrime the forward half LEFT (symGaussSeidelSmoother.C:192); nIterations counts sweeps, `(nIterations += nSweeps) < maxIter`; and the loop's residual is lduMatrix::residual (lduMatrixATmul.C:268), which starts from source - diag*psi and subtracts the off- diagonals face by face -- NOT b - A.psi. That last one is invisible until the solve ends at round-off: on damBreak the smoother stops at 1e-14, where the rounding IS the residual, and with OpenFOAM's operation order transcribed the host reproduces its final residuals to four digits there (6.835e-15, 1.202e-14, 1.851e-14, 2.067e-14). THE END-TO- END ARM TAUGHT ITS OWN LESSON ABOUT FIXTURES. At the gate's dt 1e-4 the alpha system is so diagonally dominant (Co ~ 1e-3) that every solver lands on the exact solution in ONE iteration: the PBiCGStab control read 2.6e-03 from OpenFOAM's final residuals, right beside the device's honest 1.5e-03, so the arm could not tell solvers apart and would have certified either. The gate now runs a second profile at dt 5e-3, where the interface moves 0.69 and the solve is real, and asserts the solver-log arms only there. The fields hold on that profile too: alpha 1.2e-12 and p_rgh 1.3e-12 relative on both paths, U 4.3e-12 on the host and 8.5e-12 on the device."

  interFoam_turbulence:
    openfoam:
      symbol: incompressibleInterPhaseTransportModel
      file: src/phaseSystemModels/twoPhaseInter/incompressibleInterPhaseTransportModel/incompressibleInterPhaseTransportModel.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_turbulence_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_turbulence.cu
    validation: "tests/interfoam_ras_dambreak_vs_openfoam.sh, real OpenFOAM on RAS/damBreak, five fixed steps of 1e-3, THREE PROFILES. `variable` is the tutorial as shipped; `uniform` is the same case without `density variable` (and with div(phi,k) for div(rhoPhi,k), which OpenFOAM then requires); `custom` is uniform with its own kEpsilonCoeffs, equation relaxation 0.7, and a solver tolerance of 0.5 so that `minIter 1` is what forces each sweep. MEASURED, worst of the three: alpha 4.9e-13, p_rgh 7.1e-13, U 1.3e-11, k 2.8e-13, epsilon 2.4e-13, nut 4.8e-13, and EVERY p_rgh, alpha, epsilon and k solve takes OpenFOAM's iteration count (15+5+5+5 per profile) with initial residuals to 1.8e-13. CONTROLS ON THE ORACLE: OpenFOAM run laminar is 133% of U away, its other lineage 29%, the custom settings 3.7%. WHAT EACH PROFILE CAN SEE was measured by breaking one decision at a time, once, with temporary switches that are not in the tree. On `variable`: validate() called in the wrong lineage 29% of U; rho.oldTime() taken as the current rho 5.6%; divU from the mass flux 53%; inletOutlet handed rhoPhi where it looks up phi 4.9e-04; PBiCGStab for the case's symGaussSeidel 1 of 5 iteration counts and 2.7e-06. On `variable`, ignoring minIter and ignoring the `\".*\" 1` relaxation change NOTHING, to the last digit -- which is why `custom` exists: there, ignoring minIter is 14% of U and 0 of 5 epsilon counts, ignoring the relaxation 2.2%, the coefficients 3.5% (sigmak/sigmaEps alone 0.3%, C3 alone 1.2e-08 of epsilon because divU is nearly zero). The staging asserts OpenFOAM's custom log holds a solve whose initial residual is under 0.5 and still reads one iteration. tests/interfoam_refusals.sh holds 16 turbulence arms on RAS/damBreak itself. THE DEVICE LOOP RUNS EVERY PROFILE TWICE. With the device closure -- what `-device` runs -- against OpenFOAM at the HOST's bounds: worst of the three alpha 4.9e-13, p_rgh 7.1e-13, U 3.3e-11, k 2.8e-13, epsilon 2.5e-13, nut 4.8e-13, every iteration count OpenFOAM's. And with the HOST closure in its place inside the same device loop (BRAE_INTER_HOST_CLOSURE, announced every run), held to the first: U 3.3e-14, k 1.1e-15, epsilon 1.6e-15, nut 1.9e-15, the same sweep counts solve for solve. Against OpenFOAM a disagreement could be the loop's or the closure's; between those two it can only be the closure's. Each arm asserts WHICH closure it ran (RunReport::turbulenceOnDevice). THE DEVICE-SIDE DECISIONS were each broken once, as the host's were: the patches handed rhoPhi for phi 4.9e-04 of U; the wall nut recomputed instead of read from the stored patch 6.1e-06; rho.oldTime() taken as rho 5.6%; divU from the mass flux 53%; BiCGStab for symGaussSeidel 1 of 5 epsilon counts; on `custom`, minIter ignored 14% and the wall laplacian coefficient left out of relax() 1.1e-04 of every epsilon residual with the fields unmoved. NOT VISIBLE on these fixtures, and so not claimed: the closure's storedIoSeed (the case starts at rest with inletValue equal to the internal field; switching it off changes no digit). WHAT IT DOES NOT CLAIM: any nut wall function but nutk (nutU and nutLowRe are accepted because the shared closure gates them under rhoSimpleFoam, not here); kMin/epsilonMin, which bound() never reaches on this case; a non-orthogonal mesh; more than one outer corrector with the closure on."
    note: "incompressibleInterPhaseTransportModel IS TWO MODELS BEHIND ONE KEYWORD, and brae's own refusal message had it wrong. It said interFoam's turbulence `selects a MIXTURE model and hands it the blended rho -- not the single-phase model brae already has`; that was written from memory. The source (incompressibleInterPhaseTransportModel.C:46-110): with `density` absent or `uniform` -- 15 of the 17 turbulent tutorials -- it builds incompressible::turbulenceModel::New(U, phi, mixture), the ORDINARY model, and calls validate(); with `density variable` (RAS/damBreak, laminar/damBreakPermeable) it builds phaseIncompressibleTurbulenceModel::New(rho, U, rhoPhi, phi, mixture) and does NOT call validate(). So the variable lineage's first UEqn runs on the case file's nut (uniform 0) where the other has 9e-03 from k = epsilon = 0.1, and the fvSchemes KEY differs too: div(rhoPhi,k) against div(phi,k). brae already had the closure for both -- kEpsilonRef::correct's `Compressible` struct is OpenFOAM's one templated kEpsilon.C read with rho, a field nu, the mass flux for div and the volumetric one for divU -- so the port is what it is HANDED, in inter_turbulence_cpp.cu. Both lineages take the MIXTURE's nu, a field. UEqn takes rho*nuEff with nuEff = nut + nu on cells and on every patch. turbulence->correct() runs after the last pressure corrector of the final outer corrector (interFoam.C:169-172, pimpleControl.C:51-52), where fvMatrix::solve() AND fvMatrix::relax() both select the Final name, so kFinal/epsilonFinal are the entries read and `turbOnFinalIterOnly no` with more than one outer corrector is refused. THREE THINGS THE CLOSURE NEEDED. (1) The case's linear solver: it hardwired PBiCGStab, and every kEpsilon tutorial names smoothSolver/symGaussSeidel -- the fourth time in this port a substituted solver at the same tolerance stopped somewhere else. (2) Compressible::bcPhi: inletOutlet looks up the registry's `phi`, which in rhoSimpleFoam is the equation's own mass flux and in this lineage is NOT (the equation convects with rhoPhi). A sign argument -- rho_b > 0 -- says it cannot matter, and that argument went into the header before it was measured. It is wrong: rhoPhi is the ALPHA step's flux, built from the phi the time step STARTED on, and the pressure correctors move phi afterwards. Counted at step one of RAS/damBreak, which starts at rest: rhoPhi is exactly 0 on all 46 atmosphere faces while phi is not, so every one of them reads as outflow. 4.9e-04 of U after five steps, host and device alike. (3) A DEFECT IN THE SHARED CLOSURE, found by the `custom` profile: epsilon agreed with OpenFOAM to 1e-13 while every initial and final residual of its solve sat 1.1e-04 away, only under relaxation, only for epsilon. OpenFOAM's epsilonWallFunction is a fixedValue patch, so at relax() its faces carry the laplacian's coefficient ic and the diagonal becomes max(|D0 + ic|, sumOff)/alpha - ic; brae maps the patch to zeroGradient and got D0/alpha. setValues pins exactly those rows next, so the solution cannot see it, but the diagonal survives into normFactor and a residual is what the stopping rule reads. Fixed in the host reference: 1.1e-04 -> 4.6e-14, and then in the device twin kEpsilon.cu, measured the same way from the device loop: 1.1e-04 -> 5.3e-14. STILL OPEN, and not measured: neither kOmegaSST closure carries the term -- omegaWallFunction has the same fixedValue base class (omegaWallFunctionFvPatchScalarField.H:88-90), so the same term is expected there, which is a lead and not a measurement. It moves a residual by 1e-04, so it can matter only where a solve stops within 1e-04 of its tolerance; rhoSimpleFoam's kEpsilon gates, which relax at 0.7, pass with and without it. TWO LATENT SUBSTITUTIONS THE TURBULENCE REFUSAL HAD BEEN HIDING, found by asking what else would run once it lifted. `ddtSchemes default` was parsed into f.ddtU and handed to nobody, so CrankNicolson (floatingObject) and localEuler (DTCHull) would have run as Euler: now refused in buildInterFields. And laplacianSchemes/snGradSchemes were never opened: brae assembles the pressure laplacian and its three snGrads orthogonal while 28 of 44 tutorials say `corrected` or `limited`. On a mesh of rectangles that is not a substitution (the correction vector is zero; it is why damBreak agrees to 1e-12 under `Gauss linear corrected`); on any other it is, so a corrected scheme on a mesh more than 1e-10 off orthogonal is refused, and the refusals gate shears damBreak six degrees to prove both sides. `minIter` is honoured for k and epsilon and REFUSED for the alpha pre-solve and the momentum predictor, which drop it (three tutorials name it for alpha). THE CENSUS CAUGHT ITS OWN DEFECT: run with blockMesh alone it showed damBreakLeakage and damBreakPorousBaffle reaching End, on meshes without the baffles their Allrun creates. Prepared by their own Allrun utilities both are refused (porousBafflePressure by name; the leakage case in the mesh reader, on a cyclicACMI `coded` block -- a refusal, but not a named one). 33 tutorials prepare cleanly: 3 reach End and all 3 are gated; waves 9, moving meshes 12. ON THE DEVICE IN TWO STEPS, one module at a time. First the device loop with the HOST closure -- nuEff into the device UEqn, and U, phi, rhoPhi, rho, rho.oldTime() and nu handed to the closure at the right instants -- which matched OpenFOAM at the host's numbers before any device closure ran. Then the closure's existing device twin (gpu::kEpsilonRAS::correct, gated under rhoSimpleFoam) in its place, fed by device_inter_turbulence.cu, which owns no arithmetic: the equation's flux is rhoPhi or phi by lineage, divU's and the patches' flux is phi always, rho is the mixture's or a vector of ones, and rho's patch values are the device step's own blend. nut is added to the mixture's nu ON the device (DeviceInterStepControls::nutCell), so it never crosses to the host. The twin needed three things the host reference had been given: the patches' flux (bcPhiBnd), whole-solve reporting for the log arm, and the wall coefficient in relax(). A nut wall function on a patch that is not a `wall` is refused on both paths, as OpenFOAM's nutWallFunction::checkType refuses it."

  interFoam_kOmegaSST:
    openfoam:
      symbol: kOmegaSSTBase
      file: src/TurbulenceModels/turbulenceModels/Base/kOmegaSST/kOmegaSSTBase.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/TurbulenceModels/turbulenceModels/RAS/kOmegaSST/kOmegaSST_cpp.cuh
    validation: "tests/interfoam_waterchannel_vs_openfoam.sh, real OpenFOAM on RAS/waterChannel AS SHIPPED (its own 28000-cell blockMesh + two extrudeMesh passes, non-orthogonal to 13.7 degrees), ten fixed steps of the tutorial's deltaT 0.1. MEASURED: all 20 p_rgh, 10 alpha, 10 omega and 10 k iteration counts OpenFOAM's, initial residuals within 9.3e-13; alpha 7.9e-13, p_rgh 7.6e-13, U 4.3e-12, k 2.4e-12, omega 3.9e-12, nut 3.5e-12, the wall's nut 9.2e-13 of its largest value; bounds at about 30x. THE CONTROL: OpenFOAM's own laminar run, 51% of U. THE PATH is asserted: the model, the uniform lineage, a wall distance in every cell, OpenFOAM's log selecting kOmegaSST and solving omega. BROKEN ONCE EACH (U, omega at t = 1): validate() skipped 5.1e-01, 1.7e-01; fvm::ddt dropped 3.8e-01, 2.2e+01 and 0 of 10 omega counts; the wall distance doubled 4.1e-04, 5.1e-01; PBiCGStab for the case's symGaussSeidel 1.7e-04, 3.7e-02; water's nu as a scalar for the mixture's field 3.5e-05, 8.5e-03; the laplacian's non-orthogonal correction dropped 3.7e-07, 7.2e-04. NOT DISCRIMINATED, measured: the inline (value - cell)*deltaCoeffs for the patch's snGrad() on k, omega and the wall U (identical to the last digit), and relax() not called at the case's factor of 1. tests/interfoam_refusals.sh holds ten kOmegaSST arms on RAS/damBreak made kOmegaSST, on a base that runs. NOT CLAIMED, each refused by name: `density variable` with kOmegaSST (no tutorial pairs them), F3, decayControl, a wall-function blending other than binomial n = 2 or coefficients other than the defaults, any nut wall function but nutk, a convection scheme other than Gauss upwind, a moving mesh, and the device loop."
    note: "WIRING, not a new closure: kOmegaSST_cpp.cu is the reference rhoSimpleFoam and simpleFoam already gate, handed what incompressible::turbulenceModel::New(U, phi, mixture) hands OpenFOAM's -- the mixture's nu as a field, the volumetric phi, 1/deltaT for fvm::ddt, wallDist's cell y -- by inter_turbulence_cpp.cu. The reference gained the case's linear solver (it ran PBiCGStab whatever the case named) and the two solves' full records. THREE SHARED DEFECTS THE CASE FOUND. (1) pressureInletOutletVelocity::snGrad() returned (stored value - cell)*deltaCoeffs where OpenFOAM's directionMixed builds it from the valueFraction and the cell and never reads the stored value: at construction waterChannel's atmosphere holds the file's (0 0 0) over cells at (1 0 0), correctNut read a shear of 1/d there and wrote nut 3.7e-05 for OpenFOAM's k/omega = 3.33e-02 -- the patch 100% out, the run's FIRST p_rgh residual 7.1e-03, and at t = 1 U 3.5e-03, omega 4.0e-02, nut 2.3e-01. Localised by running the same case laminar (already 6e-13) and then comparing the constructed nut, patch by patch, with `interFoam -postProcess -func writeObjects(nut)`; tests/test_piov_sngrad.cu holds it. (2) The per-field div scheme parser searched fvSchemes for the literal key, and the case names its scheme through a pattern, `\"div\\(phi,(k|omega)\\)\" Gauss upwind;` -- refused as having no div(phi,k); now the literal key, else the last matching pattern, as the dictionary lookup does (tests/test_scheme_blocks.cu). (3) kOmegaSST_cpp took three boundary gradients inline instead of from the patch; switched to snGrad(), which changes nothing on any gated case. ALSO: kOmegaSST_cpp.cuh says decayControl is refused and nothing read the key; interFoam's reader does now. The closure keys both wall functions on the MESH patch type, so the reader holds every `wall` patch to nutkWallFunction and omegaWallFunction and every other patch to neither. HOST ONLY SO FAR: the device loop refuses by name, first among its refusals."

  interFoam_MRF:
    openfoam:
      symbol: MRFZoneList
      file: src/finiteVolume/cfdTools/general/MRF/MRFZoneList.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/cfdTools/general/MRF/MRF_cpp.cuh
    validation: "tests/interfoam_mrf_vs_openfoam.sh, real OpenFOAM on laminar/mixerVessel2D AS SHIPPED (its own m4 blockMesh, topoSet and setsToZones; 3072 cells, the `rotor` zone 1536 of them with 3024 internal faces and 192 rotor faces that move with the frame), twenty fixed steps of the tutorial's deltaT 1e-3. MEASURED: all 60 p_rgh iteration counts OpenFOAM's, initial residuals within 1.2e-11; alpha 8.2e-15, p_rgh 4.9e-14, U 1.9e-15; bounds at about 30x. THE CONTROL: OpenFOAM with the zone `active no`, where nothing moves (100% of U). THE PATH is asserted: one active zone, a proper part of the mesh, with included faces, turning at the case's 6.2831853 rad/s; OpenFOAM's log building the zone list. BROKEN ONCE EACH (U, p_rgh, p_rgh counts equal): makeRelative(phiHbyA) dropped 1.1e+00, 8.7e-01, 24 of 60; the ddtCorr flux not zero-filtered 1.7e-01, 2.2e-01, 30 of 60; correctBoundaryVelocity skipped 1.6e-01, 6.1e-01, 29 of 60; MRF.DDt dropped 2.7e-02, 2.9e-01, 42 of 60; MRF.DDt(U) for MRF.DDt(rho, U) the same to two digits (rho is 1000 in the water). tests/interfoam_refusals.sh holds nine MRF arms. NOT CLAIMED, each refused by name: MRF under a moving mesh, under RAS, beside a fixedFluxPressure patch (constrainPressure's MRF.relative(Sf & U_b)), an omega that varies in time, and the device loop. The rotor's frame velocity has no oracle of its own -- OpenFOAM writes a noSlip patch as its type alone -- and is held through U."
    note: "interFoam reaches MRF in four places that do arithmetic (UEqn.H:1, :6; pEqn.H:17, :19), and the host reference simpleFoam and rhoSimpleFoam already gate supplies three of them: correctBoundaryVelocity, addCoriolis (weighted by rho here, MRFZoneList::DDt(rho, U) = rho*DDt(U)) and makeRelative. THE FOURTH IS NEW: MRF.zeroFilter on the ddtCorr flux -- MRFZone::zero sets it to Zero on the zone's internal, included and excluded faces (MRFZoneTemplates.C:213-247), because inside the zone phi.oldTime() is relative to the frame and the flux of U.oldTime() is not, so their difference there is the frame flux and not a correction. ONE SHARED DEFECT: `omega` is a Function1 (MRFZone.C) and the tutorial writes `omega constant 6.2831853;`; the reader took scalarOr, which reads the LAST token -- right for that spelling by accident, a crash on a table's `)` and a silent ZERO for the dictionary form. It reads a constant in its three spellings now, refuses any other type by name, and refuses a zone with no omega, which OpenFOAM's mandatory Function1::New stops on and brae ran at zero. The refusal that used to stand here fired on any active zone; brae's interFoam had once read MRFProperties, ignored it and converged. HOST ONLY SO FAR."

  interFoam_waveModel:
    openfoam:
      symbol: waveModel
      file: src/waveModels/waveModel/waveModel.C
    classification: BOUNDARY_CONDITION
    brae_status: REIMPLEMENT
    brae_reference: src/waveModels/waveModel/wave_model_cpp.cuh
    validation: "tests/interfoam_waves_vs_openfoam.sh, real OpenFOAM run SERIALLY, fixed steps, on ALL NINE laminar/waves tutorials that carry a wave inlet -- one per generation model -- each on a coarsened mesh at full amplitude and against its own no-wave control (the generating patch given the absorbing model). MEASURED, worst of the eight beyond stokesI: alpha 1.6e-10, p_rgh 1.6e-10, U 1.4e-08 (McCowan, the one with active absorption at a solitary inlet; the other seven are at or under 4.9e-11, 5.6e-11 and 3.8e-09), every p_rgh iteration count OpenFOAM's (40 or 60 of them per case). WHAT THE MODEL ITSELF COMPUTES has two direct oracles. Every constant in the block OpenFOAM prints when it creates the model is compared label for label -- wave length, StokesV's Lambda, cnoidal's m, a solitary wave's x0 -- and agrees to the log's 15 digits (worst 2.3e-15). And the inlet's velocity is compared face by face: StokesV 1.2e-13, cnoidal 4.5e-14, irregularMultiDirectional 1.1e-15, Grimshaw 6.9e-17. A 1 PER CENT ERROR IN StokesV's SMALLEST COEFFICIENT, the fifth-order A55, moves that arm to 3.9e-07 and the fields to 2.2e-06; in B55, alpha 3.2e-05. Three of the nine are 3-D with slip side walls (Grimshaw, McCowan, irregularMultiDirection), which is the first time this solver's host path has been held against OpenFOAM on a 3-D mesh. ON stokesI, where the conditions themselves were ported, FIVE PROFILES: `shipped` (the tutorial's own 500 x 75 mesh and waveProperties, ten steps of its deltaT 0.01), `trough` and `crest` (100 x 75, rampTime 0.05 so the wave is at full height from step five; the default phase puts the level BELOW the reference depth with the inlet flowing OUT, wavePhase pi/2 puts it ABOVE with inflow -- the two halves of waveModel::setPaddlePropeties), `tight` (trough with both codes' p_rgh solves at 1e-13) and `mompred` (trough with momentumPredictor yes). BESIDE THE FIELDS it compares four things only these conditions have an oracle for: the model's derived constants against the log's `Reference water depth` and `Wave length` (0.600000000000001 and 6.95175828555869, both patches, to the log's 15 digits); the ORDER of the updates against the log's `Updating <model> wave model for patch <p>` lines, update for update (100 of 100: per step three for the inlet, a fourth in UEqn, then the outlet); and the patch VALUES waveAlpha and waveVelocity last assigned, face by face, from the time directory (alpha 4.4e-16). MEASURED at the case's own tolerances: alpha 1.4e-10, p_rgh 6.2e-10, U 1.8e-08 at full amplitude and 1.2e-07 on `shipped` (|U| 4.7e-03 there), every p_rgh iteration count OpenFOAM's; under `tight` alpha 7.7e-12, p_rgh 7.7e-12, U 6.3e-10 -- p_rgh's is alpha's times rho*g*h. CONTROL ON THE ORACLE: OpenFOAM's own tank with waveHeight 0 is 100% of U and 0.73 of alpha away. BROKEN ONCE EACH, with switches that are not in the tree: every sub-cycle evaluated at the step's time 1.0e-04 of alpha; no re-update in UEqn 9.5e-03 and the order arm fails; the active absorption left out 2.1e-01. THE NUMBERS ABOVE WERE MEASURED WITH ONE STAGING CHANGE THAT IS NOT ABOUT WAVES, since removed (interFoam_GAMG): the tutorial solves p_rghFinal with GAMG, which brae's interFoam then substituted under a notice, so the staging named PCG with DIC. AS SHIPPED, on both loops, the fourteen profiles now read alpha 2.9e-11, p_rgh 5.2e-11 and U 9.3e-09 at worst. WHAT THAT SUBSTITUTION WAS WORTH WAS MEASURED: OpenFOAM against ITSELF on `trough`, with nothing changed but p_rghFinal's solver (GAMG or PCG, the same DIC, the same 1e-7), differs by 1.8e-02 of alpha and 9.6% of U after twenty steps; brae with its substitute is 2.3e-02 and 19% from OpenFOAM-with-GAMG. The tank's active absorption feeds the water level back into the velocity, so where the last pressure solve stops is part of the answer at that tolerance, and agreeing with these tutorials AS SHIPPED needs OpenFOAM's GAMG itself. tests/interfoam_refusals.sh holds fifteen wave and named-flux arms. WHAT IT DOES NOT CLAIM: nPaddle above 1 and a non-zero waveAngle (every tutorial names one paddle and angle 0, the 3-D ones included; only irregularMultiDirectional's per-component directions put a wave at an angle), a patch that is not axis-aligned (the local frame's tensor is diagonal here, so OpenFOAM's pairing of Rgl and Rlg cannot be told from its transpose), a restart, and two timings no fixture could see -- below. THE DEVICE LOOP RUNS EVERY PROFILE TOO, at the host's bounds: worst alpha 1.3e-10, p_rgh 6.3e-10, U 1.8e-08, every iteration count and every model update in OpenFOAM's order, the two solitary cases with their `phi rhoPhi;` top included. A SIXTH stokesI PROFILE, `mulescorr`, exists for the update's second call site: under MULESCorr alpha's first updateCoeffs of a sub-cycle is the pre-solve's matrix construction, and updating after the pre- solve instead reads alpha 8.9e-07 from OpenFOAM against 1.1e-10 -- so THAT position is gated, on both paths, with all 60 alpha sweep counts OpenFOAM's."
    note: "waveAlpha AND waveVelocity ARE fixedValue PATCHES WHOSE VALUE A MODEL SUPPLIES, one model per patch shared by both (waveModel::lookupOrCreate), updated ONCE PER TIME INDEX (waveModel.C:354). The model reads the solver back -- alpha's patchInternalField for the active absorption's water level, and in shallowWaterAbsorption U's -- so WHEN it updates is part of the answer, and the time index is not the time step: Time::subCycle sets it to (n-1)*nSubCycles and ++ moves it, so every alpha sub-cycle is a new index at the SUB-CYCLE's time, and after endSubCycle the index is n again, which is a different number, so U's first updateCoeffs of the step (UEqn's fvMatrix constructor) updates the model a fourth time from the alpha the sub-cycles left. OpenFOAM's log prints a line per update, which made the order an oracle rather than an argument. The models are transcribed in src/waveModels (StokesI, whose wave length is 100 fixed-point passes of the dispersion relation with no tolerance, and shallowWaterAbsorption, which zeroes the GLOBAL x and y of U's patchInternalField and then rotates the result as though it were local). Nine tutorials name waveAlpha; each names a DIFFERENT generation model (StokesI, StokesII, StokesV, cnoidal, Boussinesq, Grimshaw, McCowan, streamFunction, irregularMultiDirectional) over the same solver settings. ALL TEN MODELS ARE PORTED, one file each under src/waveModels as OpenFOAM lays them out, on OpenFOAM's own class hierarchy (regularWaveModel IS an irregularWaveModel there, which is where the ramp lives). FOUR THINGS IN THEM LOOK LIKE SLIPS AND ARE TRANSCRIBED, because the oracle is OpenFOAM: StokesV solves the fifth-order dispersion relation for the wave number AND lambda, keeps lambda and DROPS the wave number, so its wave length stays StokesI's linear one; a solitary wave's x0 is the patch's minimum GLOBAL x, taken in the constructor while the wave angle is still 0, and subtracted from the paddle's LOCAL x; cnoidal finds its m by a scan in steps of 1e-4 (so m is a four-digit number) and re-integrates the wave's mean square, 1000 terms, for every face at every update; McCowan's two Newton solves stop at an ABSOLUTE 1e-5. StokesV's twenty-two coefficient functions -- rational functions of sinh and cosh with integer constants up to 324000 -- were produced from OpenFOAM's source text by a rewrite of its function calls rather than retyped, since the only thing that can go wrong in them is a digit. THE SHARED PATCH-FIELD FACTORY STILL REFUSES BOTH TYPE NAMES, on purpose: buildInterFields rewrites them to fixedValue on its own copy of the file data, so no other solver can build a wave inlet frozen at the file's `value`. THE FIXTURES FOUND THREE DEFECTS THAT ARE NOT ABOUT WAVES. The first two are invisible on a wall that does not move, which is every fixedFluxPressure patch interFoam had met. (1) constrainPressure's gradient is (phiHbyA_b - (Sf_b & U_b))/(magSf_b*rAUf_b) (constrainPressure.C:62-72) and brae subtracted the stored phi_b. With phi_b the corrector hands back exactly the flux it was given, so an inlet whose flux starts at zero never opens: with the wave model's own patch values exact to 4e-16, U was 260% out and OpenFOAM's answer with the wave switched OFF was closer to OpenFOAM's (64%) than brae was. Fixed on the host and in the device hook: 260% -> 1.8e-08. (2) The momentum predictor's explicit fvc::snGrad(p_rgh) reads, on a fixedFluxPressure patch, the gradient the LAST constrainPressure stored; brae's drivers zeroed it before every predictor. Zero is OpenFOAM's construction value and right before the first pressure equation only. Measured on `mompred`: alpha 5.1e-04 and U 5.4% -> 1.4e-11 and 1.0e-09; Ux and Uz take OpenFOAM's sweep counts, 20 of 20 each. (3) A FLUX-CONDITIONAL CONDITION LOOKS ITS FLUX UP BY NAME -- the `phi` entry, default phi -- and brae's field reader kept no such entry: every condition was told phi. solitaryGrimshaw, solitaryMcCowan and mangroveInteraction write `phi rhoPhi;` on their totalPressure top. rhoPhi is the ALPHA step's flux, built from the phi the time step started on, so it is one pressure corrector behind and exactly zero at step one of a case at rest, and the top's inflow test decides differently. Both solitary cases were wrong from STEP ONE's p_rgh residual with their wave models exact to 7e-17: U 2.4e-05 and 3.0e-05 out after thirty steps, 8.0e-10 and 1.4e-08 with the named flux. It was confirmed before it was fixed, by running OpenFOAM ITSELF with `phi phi;`: brae agreed with that run to 9.6e-10. The reader now keeps the entry, every patch field carries its flux name, the host hands phi or rhoPhi accordingly and refuses any other name; the turbulence closure, which hands over phi only, refuses a k or epsilon patch that names anything else. Other solvers still ignore the entry -- they carry one flux -- and that is recorded here rather than claimed. TWO TIMINGS ARE TRANSCRIBED AND NOT GATED, and the header says so. The update opens MULES::explicitSolve (MULESTemplates.C:168), so it sits between the high-order flux, built on the value the last update left, and the limiter; moving it to AFTER the solve changed no digit on any fixture up to the tutorial's own mesh at Co 1.9, because the explicit limiter never reduces lambda on an uncoupled boundary face (MULESTemplates.C:533-564 treats wedge and coupled patches only) and the new value reaches only the adjacent cell's extrema. And the outlet model is CREATED at U's first updateCoeffs, so a case naming no reference depth takes it from alpha AFTER the first step's advance; a case that starts from rest has the same alpha there on both sides of that step. A FIXTURE THAT WAS DROPPED: ten steps at the tutorial's maxDeltaT 0.05 on its own mesh agreed (alpha 1.2e-09), but at Co 1.9 OpenFOAM's own STILL tank carries half the velocity of the one with the wave, so it gated noise. THE MODELS STAY ON THE HOST ON BOTH PATHS, as every other boundary condition of this solver does: the device loop reaches them through per-patch hooks. What the device port added is WHERE it calls them: the alpha corrector takes a hook between its high-order flux and its limiter (DeviceAlphaBoundary::updateModelled), rebuilds the bounded flux's boundary on the new patch values as upwind's phi_b*psi_b, and lets the limiter see a boundary correction that is no longer zero -- the device's explicit limiter already kept lambda at 1 on uncoupled faces, as OpenFOAM's does; the alpha step counts sub-cycles for the model's clock; and the velocity hook updates the model at the step's own clock before UEqn. ONE CASE READS VERY DIFFERENTLY ON THE TWO PATHS AND IS NOT A DEFECT: on solitaryMcCowan the host is 1.6e-10 of alpha from OpenFOAM and the device 2.3e-12; with every p_rgh solve tightened on all three codes they read 1.9e-12 and 2.0e-12, so the host's figure is where that case's relTol 0.1 left it. THE NAMED FLUX HAD TWO MORE DEFECTS BEHIND IT, found by giving the damBreak gate a `rhophi` profile that names rhoPhi on U, p_rgh AND alpha rather than letting that combination merely run. Both are invisible to a condition naming phi, because nothing moves phi between the end of one step's correctors and the next step's UEqn, and the alpha step moves rhoPhi exactly there. (a) brae's conditions were last TOLD their flux at the end of the previous step, where OpenFOAM's look it up at every updateCoeffs: p_rgh alone 4.7e-10 of alpha -> 1.2e-12 with a push after the alpha step. (b) pressureInletOutletVelocity::updateCoeffs ends in directionMixed::evaluate(), which REWRITES THE PATCH VALUE and clears the updated flag, so UEqn's fvMatrix constructor re-evaluates the atmosphere's velocity from the new flux; brae refreshed the coefficients and kept the value: U alone 2.5e-09 -> 8.4e-11 with the push -> 1.2e-12 with the value re-evaluated. On the device a p_rgh or alpha condition naming rhoPhi is handed it (the hooks push after the alpha step already); a VELOCITY condition naming it is refused, because that one switch runs on the device and reads phi."

  interFoam_GAMG:
    openfoam:
      symbol: GAMGSolver
      file: src/OpenFOAM/matrices/lduMatrix/solvers/GAMG/GAMGSolver.C
    classification: LINEAR_SOLVER
    brae_status: REIMPLEMENT
    brae_reference: src/matrices/lduMatrix/solvers/GAMG/gamg_solver_cpp.cuh
    brae_target: src/matrices/lduMatrix/solvers/GAMG/device_gamg_solver.cu
    validation: "tests/interfoam_gamg_vs_openfoam.sh, real OpenFOAM run SERIALLY for fixed steps with `DebugSwitches { GAMGAgglomeration 1; GAMG 1; }`, which the script proves inert on every run (alpha, p_rgh and U byte-identical with and without). The switches make OpenFOAM print its hierarchy level by level -- cells, faces per cell, and lduAddressing::band()'s profile, which moves when the NUMBERING does -- and the coarsest-level solve of every V-cycle. NINETEEN PROFILES on the laminar/waves tutorials, whose p_rghFinal names GAMG with a DIC smoother: stokesI as shipped on three meshes; `deep` (1e-12, 125 V-cycles); the other three smoothers; every sweep control off its default with pre-smoothing on; nCellsInCoarsestLevel 400; scaleCorrection no; both entries GAMG with different nCellsInCoarsestLevel; `square` (dx = dz) and `cubes` (3-D, 0.05 cubes), where every face has one area; and the seven other tutorials that name GAMG, as shipped. MEASURED: every level of every hierarchy is OpenFOAM's (5 to 12 levels); every p_rgh iteration count (20 to 60 per profile) and every coarsest-level count (3 to 125) is OpenFOAM's; alpha 4.0e-11, p_rgh 1.9e-10, U 1.9e-09 at worst. WHAT IT REPLACED, PBiCGStab under a notice: alpha 2.3e-02 and U 19% on the same fixture. CONTROL ON THE ORACLE: OpenFOAM with PCG against OpenFOAM with GAMG, alpha 1.9e-04 to 8.4e-02, never under 1e5 times brae's distance. EVERY PORT DECISION BROKEN ONCE with switches not in the tree: no alternation of the pairing direction 1.2e-03 of alpha; coarse faces sorted by neighbour 1.1e-07 and the band profile moves; the rejected last level kept, or the coarsest level solved to 1e-12, and NO FIELD MOVES -- only the coarsest-solve log arm holds those two; prolongation that adds 2.8e-04; post-sweeps without the level multiplier 9.7e-05; the hierarchy built from the entry in use rather than the first 8.5e-09 and 10 levels for 8. THE GAMG PRECONDITIONER (`solver PCG; preconditioner { preconditioner GAMG; ... }`, six of the seven solid-body tutorials' p_rghFinal) has two profiles of its own, the tutorials' form (DICGaussSeidel, nPreSweeps 2, nVcycles 2) and one whose sub-dictionary tolerance differs from the PCG's: 40 of 40 p_rgh counts, alpha 4.9e-12 and 3.4e-12, every coarsest count OpenFOAM's; broken once each -- one V-cycle for two 1.5e-02, no residual between cycles 1.4e-02, the application not started from zero 7.1e-05, the coarsest at the PCG's tolerance 0 of 9 coarsest counts. And the seven tanks of interfoam_moving_vs_openfoam.sh run with it as shipped. TWO DECISIONS READ NOTHING ON THE SHIPPED FIXTURE and have fixtures of their own: the (1, 1.01, 1.02) weight perturbation is idle on 2 x 0.1 cells (identical to the last digit) and worth 4.5e-03 on `square`, 2.0e-06 on `cubes`, 4.9e-06 with y and z swapped; scaling the level above the coarsest moves the 11th digit with a 24-cell level there and 5.0e-05 of alpha on `coarsest`. tests/interfoam_refusals.sh holds fifteen GAMG arms and three for the device. WHAT IT DOES NOT CLAIM: an asymmetric matrix, any refused control, and a parallel run (the smoothers and the hierarchy are per-processor there). THE DEVICE LOOP RUNS THE SIXTEEN DIC PROFILES TOO, against OpenFOAM directly: every p_rgh and every coarsest-level iteration count OpenFOAM's; alpha 2.9e-11, p_rgh 5.2e-11, U 1.6e-09 at worst (1.5e-08 on `deep`), 4.5e-11 of alpha from the host. WHAT IT REPLACED there, Jacobi-BiCGStab under a notice: alpha 2.3e-02, U 45%. BROKEN ONCE EACH ON THE DEVICE: coarse-level DIC diagonals left from the first solve 1.8e-03; prolongation that adds 7.3e-03; the level above the coarsest scaled 5.0e-05 on `coarsest`; the coarsest MATRIX left from the first solve moves no field and reads 2.3e-02 on the coarsest-solve arm. The device's GAMG has the DIC smoother only and the driver REFUSES the other three by name. WITH BOTH LOOPS ON THE TUTORIALS' OWN SOLVER the wave gate (interfoam_waves_vs_openfoam.sh) dropped its PCG staging: fourteen profiles as shipped, alpha 2.9e-11 where it read 1.6e-10, and its bounds came down with it."
    note: "GAMG IS OpenFOAM'S, NOT A MULTIGRID: the hierarchy's numbering, the smoother's face order and the stopping rule are all part of where a loose solve stops, and on the wave tanks that is part of the answer -- the active absorption feeds the water level back into the inlet velocity, and OpenFOAM against ITSELF with PCG in GAMG's place differs by 1.8e-02 of alpha after twenty steps. THE HIERARCHY (pair_gamg_agglomeration_cpp.cuh): faceAreaPair weighs faces by |Sf/sqrt(magSf) * (1, 1.01, 1.02)|, a perturbation against jagged pairings on axis-aligned meshes; each pass pairs a cell with its heaviest unpaired neighbour, else joins the heaviest neighbour's cluster; the sweep direction flips after EVERY pass through a STATIC flag, including the pass continueAgglomerating() rejects, whose level is discarded whole; coarse faces are numbered owner-major and within an owner by FIRST APPEARANCE in the fine face walk, not by neighbour. It is a MeshObject: the first GAMG solve of the run builds it from ITS entry's nCellsInCoarsestLevel and no later entry's is read. THE V-CYCLE (gamg_solver_cpp.cuh): no pre-smoothing by default; restriction is summation; the coarsest level is solved by PCG with DIC from zero to the GAMG's OWN tolerance and relTol, not directly; prolongation is injection that OVERWRITES; the correction is scaled by (x.b)/(x.Ax) with a Jacobi step on the remainder, for a symmetric matrix and NOT on the level above the coarsest; post-sweeps are min(nPostSweeps + postSweepsLevelMultiplier*level, maxPostSweeps); the finest correction is scaled against the residual and psi is smoothed nFinestSweeps times against the SOURCE. DIC as a smoother is an iteration on the true residual. A FINDING THAT IS NOT THE SOLVER'S, from `deep`: ten consecutive solves read 1.24e-05 on their initial residuals with alpha 6e-12 from OpenFOAM, because one top-patch face's flux sits at 1e-14 and pressureInletOutletVelocity branches on its sign; the branch changes U's diagonal under that face, hence rAU and the p_rgh matrix's row sum on a patch whose value is the solution there, hence normFactor and every residual divided by it -- without moving the solution. brae::gamg (src/OpenFOAM/matrices/gamg.cu), which simpleFoam_cpp uses, is an earlier multigrid with a sorted coarse numbering and a direct coarsest solve; it is not this and was left alone. THE PRECONDITIONER (GAMGPreconditioner.C) is a GAMGSolver built on the PCG's own matrix with the `preconditioner` SUB-DICTIONARY as its controls (lduMatrixPreconditioner.C, New) -- its tolerance and relTol are the coarsest solve's, not the PCG's -- and each application runs nVcycles (default 2) of the same V-cycle from w = 0, recomputing r - A*w between cycles. PCG builds it only once the first residual is above tolerance. UNDER IT THE COARSEST LEVEL USUALLY DOES NOTHING: its source is the PCG residual restricted over aggregates, which cancels to ~1e-26, and a solve from zero normalised by sum|source| + 1e-20 reads an initial residual below tolerance and takes no iteration -- six of eight on the gated fixture, in OpenFOAM and in brae alike. The gate asserts the coarsest counts there and holds the residuals, which are that cancellation read to its last digits, to 1e-3. PCG.C's checkSingularity break is transcribed in the coarsest-level PCG and is ABSENT from brae::pcg (it fires only on wApA/normFactor under 1e-300). ON THE DEVICE (device_gamg_solver.cuh): the hierarchy is the host's own code, uploaded once; the coarse matrices and the restriction are FIXED-ORDER GATHERS in the host's accumulation order (a scatter with atomic adds is neither ordered nor reproducible); the smoother is DIC through the level-scheduled DILU with lower aliased to upper, one schedule per level, its diagonal recomputed at every solve; the scaling's two dot products and the residual norms are device reductions; and THE COARSEST LEVEL IS SOLVED ON THE HOST by the host's own PCG -- ten cells by default, a pair of short copies against dozens of launches and a read-back per iteration. That is a finished state, not a deferred one."

  interFoam_solidBodyMotion:
    openfoam:
      symbol: dynamicMotionSolverFvMesh
      file: src/dynamicFvMesh/dynamicMotionSolverFvMesh/dynamicMotionSolverFvMesh.C
    classification: HOST_ONLY
    brae_status: REIMPLEMENT
    brae_reference: src/dynamicFvMesh/dynamicMotionSolverFvMesh/dynamic_motion_solver_fv_mesh_cpp.cuh
    validation: "tests/mesh_motion_vs_openfoam.sh: the moved polyMesh/points and the mesh flux meshPhi against OpenFOAM's moveDynamicMesh, written per step at writePrecision 18, and V and C of the moved mesh against postProcess's writeCellVolumes and writeCellCentres on those points. SEVEN PROFILES: testTubeMixer (multiMotion of a rotatingMotion and an oscillatingRotatingMotion), sloshingTank2D (SDA, m4 mesh), sloshingTank3D6DoF (tabulated6DoFMotion, spline, across two knots), sloshingCylinder (multiMotion of an oscillatingLinearMotion and a rotatingMotion on a snappyHexMesh mesh of polyhedra), and linearMotion, axisRotationMotion and tabulated6DoFMotion with linear interpolation on the tutorials' meshes. MEASURED: points and meshPhi differ from OpenFOAM's by EXACTLY ZERO on every profile, and the gate asserts zero (BRAE_MESH_MOTION_ROUNDOFF=1 holds 1e-15 and 1e-12 instead, for a compiler that orders floating point differently) -- and V and C of the moved mesh are exact too, since fv_geometry's face centres took primitiveMeshTools.C's operation order (interFoam_nonOrthCorrection); they read 1.7e-14 and 8.0e-16 before. CONTROL on brae's side (the oracle has no wrong answer to offer): the two multiMotion entries in the other order, 1.5e-01 of the extent, which the script asserts FAILS. BROKEN ONCE EACH -- and the reason the comparison is exact, since all but the last sit under any round-off bound: meshPhi as sweptVol/deltaT rather than sweptVol*(1.0/deltaT) 2.0e-16; the swept volume fanned about the vertex mean rather than face::centre 6.7e-15; points rotated through the quaternion rather than the tensor q.R() 4.4e-16 and 1.8e-14; septernion*septernion without normalising the product rotation 6.1e-16 and 2.1e-14; the time as index*deltaT rather than accumulated 1.8e-16 and 8.4e-15; oldPoints never refreshed 4.1e+00. WHAT IT DOES NOT CLAIM: a cellZone or cellSet (the motion of PART of a mesh), points0 read from a file, a restart of a moved mesh, any motionSolver but solidBody, drivenLinearMotion, a non-constant Function1 coefficient, mergeLevels, and the device -- refused by name, fifteen arms in tests/interfoam_refusals.sh."
    note: "EVERY MOTION IS AN ABSOLUTE FUNCTION OF TIME ON THE ORIGINAL POINTS (points0MotionSolver), a septernion built and multiplied as OpenFOAM's quaternion and septernion multiply (src/OpenFOAM/primitives/septernion/septernion_cpp.cuh), and applied by transformPoints: the translation subtracted when it exceeds VSMALL, the rotation by the TENSOR q.R() when mag(R - I) exceeds SMALL. multiMotion is the product of its entries in dictionary order. fvMesh::movePoints takes V into V0 and the points into oldPoints ONCE PER TIME INDEX (a second update in the same step, moveMeshOuterCorrectors, keeps both), sets meshPhi = face::sweptVol*(1/deltaT) on every face but an empty patch's, and recomputes the geometry. face::sweptVol fans each face about face::centre at both times, and face::centre is NOT primitiveMesh's Cf: a third arrangement of the same sums, differing in the last digits on any face that is not a triangle. src/OpenFOAM/motion/solid_body_motion.cuh and swept_volume.cuh, which pimpleFoam still uses, are earlier transcriptions with Rodrigues' formula and a different centre; they are the same motion and not the same digits, and were left alone. fvMesh::Vsc and Vsc0 interpolate V0 and V to a sub-cycle's clock (fvMeshGeometry.C), and fvc::surfaceIntegrate divides by Vsc, not V. HOST_ONLY is a finished state: the motion is mesh topology and geometry, computed once per step; what the DEVICE loop needs is the moved geometry uploaded, which is interFoam_dynamicMesh's target."

  interFoam_displacementLaplacian:
    openfoam:
      symbol: displacementLaplacianFvMotionSolver
      file: src/fvMotionSolver/fvMotionSolvers/displacement/laplacian/displacementLaplacianFvMotionSolver.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/fvMotionSolver/fvMotionSolvers/displacement/laplacian/displacement_laplacian_fv_motion_solver_cpp.cuh
    validation: "tests/displacement_laplacian_vs_openfoam.sh: the moved polyMesh/points, the motion solver's cellDisplacement and pointDisplacement, meshPhi and every GAMG solve of the displacement equation against OpenFOAM's moveDynamicMesh run SERIALLY with a fixed deltaT, written per step at writePrecision 18, and V and C of the moved mesh from postProcess. SEVEN PROFILES, each the tutorial's own mesh and dictionaries: waveMakerPiston, waveMakerFlap (the wall tilts) and waveMakerSolitary (0.26 m of stroke, two blocks), 20 steps of 0.05 to t = 1, waveMakerMultiPaddleFlap and waveMakerMultiPaddlePiston (four paddles at 45 degrees, 3-D, 448000 cells), 4 steps of 0.1, and the piston and the flap again with `secondOrder yes` staged into the paddle. MEASURED, worst of the seven: all 204 GAMG solves take OpenFOAM's iteration count; points 2.9e-16 of the extent; cellDisplacement and pointDisplacement 1.3e-14 of the largest displacement; meshPhi 2.4e-13 of the run's largest |meshPhi|; V 1.1e-13 relative, C 5.9e-16 of the extent. The bounds are those numbers and say why: see the note. THE CONTROL: the wall distance taken from rightwall instead of leftwall, 9.9e-01 of the displacement, which the script asserts FAILS. BROKEN ONCE EACH, as a fraction of the largest displacement: the paddle's values not written back over the interpolated ones 3.7e-02; y on the named patch the next cell's instead of the wave's SMALL 4.0e-01 and 20 of 40 counts; the wall distance without correctWalls 2.3e-05 (the flap only, whose wall tilts); the 2-D correction skipped 7.4e-02 (the solitary only); volPointInterpolation's weights made once 6.2e-04; the diffusivity computed once 9.1e-02; the GAMG hierarchy kept from step one 1.9e-01; the non-orthogonal correction dropped 7.9e-02. SEVEN REFUSALS asserted by name: a diffusivity other than inverseDistance, a cellDisplacement solver other than GAMG, a laplacian other than Gauss linear corrected, a point condition other than fixedValue, zeroGradient, empty and waveMaker, an unknown motionType, a waveMaker without `value`, and frozenPointsZone. NOT CLAIMED, because these meshes cannot tell: pointCells' order (the pointFaces walk OpenFOAM takes here and the ascending order give the same lists on a block mesh) and face::average against a vertex mean for cellMotion (equal on flat parallel faces); the Final solver entry, which moveDynamicMesh never selects; and the device. UNDER interFoam: all five are gated end to end (interFoam_correctPhi, interFoam_interfaceCompression)."
    note: "ONE newPoints(), IN OpenFOAM'S ORDER, all on the mesh before the move (motionSolver.C:200-204, displacementLaplacianFvMotionSolver.C:199-318): the inverseDistance diffusivity 1/interpolate(y), y the meshWave distance to the named patches (patchWave: FaceCellWave<wallPoint> seeded with the patch face centres, visiting cells() in OpenFOAM's order and taking a new origin only when nearer by 1%, then correctBoundaryCells' exact distance for every cell touching the patches), whose boundary value is the wave's own on the named patches -- sqrt(0) + SMALL, so the diffusivity there is 1e15 -- and the next cell's elsewhere; the point conditions' updateCoeffs, each writing its values straight into the point field in patch order; cellMotion on every patch whose point condition fixes a value, the face::average of the POINT field; laplacian(diffusivity, cellDisplacement) Gauss linear corrected, solved component by component with GAMG from the last step's solution, the empty direction skipped; then volPointInterpolation -- cells to points by 1/|p - C|, boundary faces of real patches to patch points by 1/|p - Cf|, the weights remade on every move -- the fixing conditions evaluated again over it, points0 + pointDisplacement, and twoDPointCorrector, whose plane normal is taken once and whose mid-plane is the current bounds'. THE GAMG SOLVE HAS TO BE OPENFOAM'S EXACTLY: the paddle's 1e15 diffusivity dominates the residual normalisation, the equation is declared converged after one V-cycle, and the mesh is that V-cycle's. The hierarchy is the mesh's MeshObject, shared with p_rgh's GAMG and rebuilt after each move; DynamicMotionSolverFvMesh::update takes the run's cache and invalidates it. AN OPEN FINDING THAT BELONGS TO THE SHARED OPERATORS: brae's fvm::laplacian forms its face coefficient as (deltaCoeffs*gamma)*magSf where gaussLaplacianScheme forms gammaMagSf = gamma*magSf first, and brae's linear interpolation is w*P + (1 - w)*N where surfaceInterpolationScheme::dotInterpolate is lambda*(P - N) + N. Switched to OpenFOAM's order, every profile of this gate is EXACT for its first four to seven steps; they are what the gate's bounds are. Left as they are here because every solver's laplacian and interpolation read them. face::centre, face::average and face::nearestPoint are src/OpenFOAM/meshes/meshShapes/face/face_cpp.cuh; the wave src/meshTools/cellDist/patchWave/; the interpolation src/finiteVolume/interpolation/volPointInterpolation/vol_point_interpolation_cpp.cuh (the older vol_point_interpolation.cuh, which velocityComponentLaplacian uses, was left alone). moveDynamicMesh does not link libwaveModels, which interFoam does: the gate's controlDict loads it."

  interFoam_waveMaker:
    openfoam:
      symbol: waveMakerPointPatchVectorField
      file: src/waveModels/derivedPointPatchFields/waveMaker/waveMakerPointPatchVectorField.C
    classification: HOST_ONLY
    brae_status: REIMPLEMENT
    brae_reference: src/waveModels/derivedPointPatchFields/waveMaker/wave_maker_point_patch_vector_field_cpp.cuh
    validation: "tests/displacement_laplacian_vs_openfoam.sh (interFoam_displacementLaplacian): the paddle is every profile's only moving boundary, so its displacement is the whole of the motion -- piston and flap, one paddle and four at 45 degrees, and the solitary stroke with its Newton iteration -- and the piston and the flap with `secondOrder yes` staged in, which no tutorial turns on. The paddle points' pointDisplacement is OpenFOAM's to the gate's 2e-14 of the largest displacement. NOT CLAIMED: a waveMaker without `value`, which OpenFOAM evaluates at construction (refused)."
    note: "updateCoeffs (waveMakerPointPatchVectorField.C:278-436): the wave length by 100 fixed-point iterations of L = L0 tanh(2 pi h/L), the paddle's phase its centre's position alone (wavePhase is read and never used), and the ramp clamp(t/rampTime, 0, 1) on the piston and the flap but not the solitary stroke; the flap's stroke scaled by the point's height above the patch's lowest point. The paddle centres and every point's paddle are taken from the patch's points at construction (initialiseGeometry) and never again; the reference depth on the first updateCoeffs. HOST_ONLY is a finished state: the condition is a function of time on the patch's points, and what the device needs is the moved mesh."

  interFoam_dynamicMesh:
    openfoam:
      symbol: mesh.update
      file: applications/solvers/multiphase/interFoam/interFoam.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_driver_cpp.cu
    validation: "tests/interfoam_moving_vs_openfoam.sh, real OpenFOAM run SERIALLY, ten fixed steps of 2e-4 on laminar/testTubeMixer -- a closed tube of water and air on a turntable that also tilts, every wall a movingWallVelocity -- against its fields, its moved points, its Uf and its wall velocity, with the same tube held still (`staticFvMesh`) as the control. FIVE PROFILES: as staged (the tutorial's nAlphaSubCycles 3), MULESCorr, nOuterCorrectors 2 with moveMeshOuterCorrectors (the mesh moved twice in one step), without it (the second corrector must NOT move it), and momentumPredictor yes. MEASURED, worst of the five: every p_rgh iteration count OpenFOAM's (20 to 40 per profile), initial residuals 3.7e-11 in step one and 4.8e-09 over the run, alpha 5.6e-12, p_rgh 1.5e-13, U 1.0e-10, Uf 6.8e-11, the wall velocity 7.0e-14 on 1050 faces, the moved points OpenFOAM's exactly. THE CONTROL: the still tube is 100% of U and 0.8 of alpha away. THE TUTORIAL RUNS AS SHIPPED: vanLeerV (interFoam_vanLeerV) and p_rghFinal's PCG with a GAMG preconditioner (interFoam_GAMG) were staged away until each was ported. With them, alpha 6.1e-12 and U 7.0e-11 at worst over the five profiles; the two non-orthogonal tanks run as shipped too (interFoam_nonOrthCorrection). BROKEN ONCE EACH: phi left absolute after the corrector alpha 9.2e-01 and U 470%; ddtCorr from phi.oldTime() instead of Sf & Uf.oldTime() 8.1e-02 and 28%; Uf left at interpolate(U) 3.3e-02 and 27%; gh and ghf not recomputed 3.3e-04; the GAMG hierarchy kept from step one 9.3e-06 and 10 of 20 counts; the mesh moved on every outer corrector 5.1e-07 and 29 of 40; oldPoints re-taken on the second update 9.9e-02 and 100%; the wall velocity as the face-centre displacement alone, without the swept volume in its normal component, and adjustPhi STOPS THE RUN with OpenFOAM's own `continuity error cannot be removed`. WHAT THIS GATE CANNOT SEE, because the motion is rigid: every cell keeps its volume to round-off, so V0 against V in fvm::ddt and MULES and Vsc's interpolation inside a sub-cycle move the answer by 1e-15 -- transcribed, and gated only by a mesh that deforms. NOT CLAIMED: a turbulent case on a moving mesh (refused) and the device (refused). correctPhi is interFoam_correctPhi, and a wave condition on a moving mesh runs: see there."
    note: "WHAT interFoam DOES ON A MOVING MESH, in the order of interFoam.C:118-148 and pEqn.H. At the top of the first outer corrector: mesh.update(), whose last line is U.correctBoundaryConditions() -- a movingWallVelocity takes Uwall = Up + n*(Un - n&Up) with Up the face::centre displacement over deltaT and Un = meshPhi/(magSf + VSMALL): the normal component is the SWEPT VOLUME's, so the wall's flux is the mesh flux and a closed tank's adjustPhi closes on it; then gh and ghf from the new centres; the correctPhi block is skipped when the case says `correctPhi no`, which every solid-body tutorial does. The alpha sub-cycle convects with the RELATIVE phi the last corrector left and divides by Vsc; fvm::ddt(rho, U) carries V0 in its source; ddtCorr(U, phi, Uf) is ddtCorr(U, Uf) on a dynamic mesh: Sf & Uf.oldTime() in phi.oldTime()'s place, with the NEW Sf and weights; adjustPhi sees phiHbyA made relative and is made absolute again; after `phi = phiHbyA - p_rghEqn.flux()` and U's correction, fvc::correctUf replaces Uf's normal component by the ABSOLUTE flux's and fvc::makeRelative subtracts meshPhi, so the phi that leaves the corrector is relative. GAMGAgglomeration::movePoints marks the hierarchy for rebuilding at every step (updateInterval 1), from wherever the static pairing direction was left. A TRANSCRIPTION SLIP FOUND ON THE WAY: ddtCorr's limiter divided by |phi| + 1e-37, the FLOAT build's VSMALL (floatScalar.H:64), where OpenFOAM's double build adds SMALL = 1e-15 (doubleScalar.H:62); the two differ only where |phi| is at or below 1e-15 and no gated number moved when it was corrected, on the host or on the device (device_inter_peqn.cu had it too and tests/test_device_inter_peqn.cu holds the two bit-identical); time_controls.cuh's setDeltaT still divides by CoNum + 1e-37 where setDeltaT.H adds SMALL (open finding, in that component). THE DRIVER TAKES ITS MESH BY CONST REFERENCE and a moving case needs the same objects mutable -- the points, the geometry, and the patches every patch field references -- so runInterFoam takes a MutableMesh naming them, checked by address, and refuses a moving case without one."

  interFoam_correctPhi:
    openfoam:
      symbol: CorrectPhi
      file: src/finiteVolume/cfdTools/general/CorrectPhi/CorrectPhi.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_correct_phi_cpp.cuh
    validation: "tests/interfoam_moving_vs_openfoam.sh, real OpenFOAM run serially for fixed steps. FIVE PROFILES: the three solid-body tanks with `correctPhi yes` (testTubeMixer; sloshingTank2D's non-orthogonal pcorr laplacian; sloshingCylinder's non-orthogonal corrector, pcorr then pcorrFinal, staged `maxIter 1000` because the shipped 100 leaves PCG unconverged at 0.1 to 0.3 in both codes and then reads alpha 7.6e-09 on 22 of 22 counts); laminar/waves/waveMakerSolitary AS SHIPPED, thirty steps -- a deforming mesh, correctPhi by default, an absorbing outlet, an open top; and closed damBreak STARTED MOVING, U (0.1 0 0) against its walls, where initCorrectPhi does 79 iterations of work. Every other profile of the gate compares initCorrectPhi's start-up solve too. MEASURED: every pcorr and p_rgh iteration count OpenFOAM's; waveMakerSolitary alpha 2.9e-12, p_rgh 3.3e-13, U 1.7e-10; the tanks alpha 1.4e-12, 3.0e-13, 1.2e-10; the moving dam alpha 1.2e-14, U 2.3e-12. BROKEN ONCE EACH: correctUphiBCs skipped, and phi not rebuilt from Sf & Uf, both stop the run in adjustPhi as OpenFOAM would; rAUf = 1 alpha 3.6e-02; no pcorr reference 4.1e-07; phi left absolute 9.9e-01; pcorr's non-orthogonal flux dropped 4.9e-01 (the cylinder -- identically zero with no corrector, since pcorr starts at 0); initCorrectPhi skipped 3.2e-02 on the moving dam; fvm::ddt's V0 as V 1.1e-02 and the sub-cycle's Vsc as V 2.6e-03 on waveMakerSolitary, the first gated case whose cells change volume; the outlet's wave model updated in UEqn rather than at the mesh update U 2.0e-05. NOT CLAIMED: the curvature pass after CorrectPhi (under 3e-13 on these tanks), the corrected flux handed to flux-conditional patches (a closed tank has none), a divU, and the device (it runs initCorrectPhi on the host and refuses a moving mesh)."
    note: "ONE CorrectPhi (CorrectPhi.C:36-117): correctUphiBCs when the mesh is changing -- every velocity patch that FIXES A VALUE evaluated again, a pressureInletOutletVelocity against the Sf & Uf flux, and phi there set to U_b & Sf; pcorr zero, fixedValue where p_rgh fixes a value and zeroGradient elsewhere; on a closed domain phi made relative, adjustPhi, made absolute; laplacian(rAUf, pcorr) == div(phi), pinned at cell 0 to 0 when it needs a reference, solved nNonOrthogonalCorrectors + 1 times with pcorrFinal last; phi -= flux() on the last pass, the face correction included. interFoam.C:136-146 then makes phi relative and calls mixture.correct(), which recomputes nHatf on the moved mesh. initCorrectPhi.H runs it at the start of EVERY case with rAUf exactly 1 (OpenFOAM's interpolation of a uniform 1 is exact); on a case at rest it is one solve of zero iterations, and no existing gate moved a digit when it went in. rAU is kept across steps under correctPhi (pEqn.H:4). THREE THINGS CHANGED ON THE WAY: pressureInletOutletVelocity now FIXES A VALUE, as directionMixed does in OpenFOAM (it said false; switching it moved nothing on damBreak, waves or capillaryRise, host or device); PCG with a GAMG preconditioner builds the mesh's hierarchy only when its initial residual has not converged, as PCG.C constructs its preconditioner, so a pcorr at rest neither builds it nor flips the pairing direction; and on a moving mesh the wave velocity model updates at the mesh update, where OpenFOAM's log has it. A wave condition on a moving mesh is no longer refused: OpenFOAM's model keeps its construction geometry and reads the patch's current magSf, and brae's does the same. CLOSED, found on the way: brae's dictionary expansion resolved `$name` only against literal keys, where OpenFOAM's keyword substitution matches patterns too (REGEX_RECURSIVE, dictionary.C:415-443) -- the two multi-paddle waveMakers write `p_rgh { $pcorr; ... }` against a `\"(pcorr|pcorrFinal)\"` entry, and brae read no solver there and ran PBiCGStab under a notice. The expander now searches as dictionary::csearch does (tests/test_dict_scoped_macro.cu, scored against foamDictionary -expand over the 9,500 tutorial dictionaries: 2,958 moved entries agree with OpenFOAM, 17 agreed only before), and both cases are profiles of the moving gate."

  interFoam_interfaceCompression:
    openfoam:
      symbol: interfaceCompressionLimiter
      file: src/transportModels/interfaceProperties/interfaceCompression/interfaceCompression.H
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/limitedSchemes_cpp.cuh
    validation: "tests/interfoam_dambreak_vs_openfoam.sh's `compression`: damBreak at dt 5e-3 with `div(phirb,alpha) Gauss interfaceCompression`, on a mesh that does not move. MEASURED: every p_rgh and alpha iteration count OpenFOAM's, alpha 6.6e-14, p_rgh 3.1e-14, U 2.2e-13. THE CONTROL: the scheme moves OpenFOAM's own alpha by 1.03e-01 against `Gauss linear`. BROKEN ONCE EACH: the quadratic form OpenFOAM leaves commented out 1.0e-02 of alpha; min for max 8.1e-02. NOT DISCRIMINATED: pos against pos0 in the blend (no face where the limiter is below 1 carries exactly zero flux). END TO END, tests/interfoam_moving_vs_openfoam.sh's `piston` and `flap`: laminar/waves/waveMakerPiston and waveMakerFlap, thirty steps of 0.01, the mesh deformed by the paddle, correctPhi, the absorbing outlet -- with p_rgh, p_rghFinal and pcorr converged to 1e-13, because as shipped their 135- to 480-iteration solves carry last-bit differences out to U 3.9e-07 on the piston (converged: 1.6e-09); alpha 1.5e-12 and 1.0e-11, U 1.6e-09 and 1.1e-09, every solve below its tolerance in both codes, counts equal on short solves and within 2% on long ones (3 of 194 at worst). NOT CLAIMED: the device, which refuses the scheme by name -- its alpha mapping took it as linear until the host ported it. THE TWO MULTI-PADDLE waveMakers, `multiPiston` and `multiFlap` of the same script: AS SHIPPED on their own 448000-cell 3-D mesh, four paddles at 45 degrees, thirty steps of 0.01, GAMG as the solver of pcorr and p_rgh through `p_rgh { $pcorr; }`. MEASURED (piston, flap): all 90 p_rgh and all 31 pcorr iteration counts OpenFOAM's, alpha 5.7e-13 and 2.9e-12, p_rgh 5.6e-13 and 2.6e-12, U 2.2e-10 and 1.8e-09, the moved points 1.1e-16 of the extent; the control, OpenFOAM with its mesh held still, U 100%. BROKEN ONCE, the pattern lookup taken out of the dictionary reader: 48 of 90 p_rgh counts, alpha 9.7e-04, U 1.0e-01."
    note: "A PhiScheme (interfaceCompression.C:33-41), so the limiter reads the two cell values of the field and nothing else: clamp(1 - max(sqr(1 - 4 phiP (1 - phiP)), sqr(1 - 4 phiN (1 - phiN))), 0, 1), the quartic form -- 1 where both cells are half full, 0 where either is empty or full -- blended as limitedSurfaceInterpolationScheme::weights does, limiter*CDweight + (1 - limiter)*pos0(faceFlux), and 1 on an uncoupled patch (PhiScheme.C). alphaEqn.H applies it twice through fvc::flux(-fvc::flux(-phir, alpha2, alpharScheme), alpha1, alpharScheme): on alpha2 upwinded by -phir, then on alpha1 by the negated result."

  interFoam_pressureReference:
    openfoam:
      symbol: setRefCell
      file: src/finiteVolume/cfdTools/general/findRefCell/findRefCell.C
    classification: GPU_REQUIRED
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_case_cpp.cu
    validation: "tests/interfoam_moving_vs_openfoam.sh's `closedDamBreak`: laminar/damBreak with its atmosphere WALLED OFF (U fixedValue 0, p_rgh fixedFluxPressure, alpha zeroGradient) and PIMPLE naming `pRefPoint (0.292 0.292 0.0073); pRefValue 0;`, twenty of the tutorial's own steps against real OpenFOAM. MEASURED: 60 of 60 p_rgh iteration counts, initial residuals 2.0e-11 over the run, alpha 1.2e-14, p_rgh 9.5e-15, p 5.7e-15, U 8.1e-14. THE CONTROL: OpenFOAM's own closed dam with `pRefValue 1e5`, whose p is 89 times its magnitude away and whose U is 3.0e-11 away -- the reference moves the level and nothing else. BROKEN ONCE: the reference cell pinned at pRefValue rather than its current p_rgh (what this code did on a path no gated case had taken) reads 15 of 60 counts and U 4.4e-05 on the closed dam, 18 of 20 and 5.3e-07 on the moving tube. Every solid-body tutorial is a closed tank and takes this path -- and sloshingTank2D's pRefPoint (0 0 0.15) LIES ON A FACE: findCell takes the nearer of two centres 5e-16 apart, brae took the other one while its face centres differed from OpenFOAM's in the last bit, and read alpha 2.8e-06 and 18 of 20 counts for it. NOT CLAIMED: polyMesh::findCell's octree fallback when the face-plane test finds no cell (refused by name), and the device (refused: its reference is the pRefValue one)."
    note: "p_rgh.needReference() is `no patch fixes a value` (GeometricField.C:1068-1085). setRefCell (findRefCell.C:36-110) then reads pRefCell, or pRefPoint located by findCell(point, FACE_PLANES): the nearest cell centre if the point is inside that cell by every face plane -- (Sf & (p - Cf)) <= 0 with Sf flipped for a neighbour -- else the FIRST cell in index order that is; and pRefValue, mandatory. createFields.H:115-124 shifts p by pRefValue - p[refCell] and rebuilds p_rgh from it once at the start; pEqn.H:47 pins the reference cell at getRefCellValue(p_rgh, pRefCell), ITS CURRENT p_rgh -- not at pRefValue, which is p's level, applied again at pEqn.H:74-83 after the solve with p_rgh rebuilt from the shifted p. adjustPhi (adjustPhi.C) runs on such a case only: the outflow of every patch whose U does not fix a value (an inletOutlet counts as adjustable) is scaled to balance the inflow, and an imbalance no adjustable outflow can remove stops the run -- which is what a wall velocity with the wrong normal component does on a closed tank. brae's driver set needReference = false with a note that damBreak's atmosphere is a totalPressure; every case gated before this one had one."

  interFoam_vanLeerV:
    openfoam:
      symbol: vanLeerV
      file: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/vanLeer/vanLeer.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/limitedSchemes_cpp.cuh
    brae_target: src/cuda/device_fvm.cu
    validation: "tests/interfoam_dambreak_vs_openfoam.sh's `vanleerv` profile: laminar/damBreak at the big step with `div(rhoPhi,U) Gauss vanLeerV` in place of its linearUpwind, five steps against real OpenFOAM, host and device, with the big-step run as the control. MEASURED: alpha 1.2e-13, U 3.1e-13 on the host and alpha 3.8e-14, U 1.2e-11 on the device, all 15 p_rgh counts OpenFOAM's; the scheme moves OpenFOAM's own alpha by 2.0e-01. AND ON THE FIXTURE IT EXISTS FOR: tests/interfoam_moving_vs_openfoam.sh's testTubeMixer, whose own fvSchemes name it, now run as shipped there. BROKEN ONCE: vanLeer's limiter replaced by limitedLinear's clamp of 2r on the same r, host and device alike, alpha 2.1e-01 (45% of the change the scheme makes). A SECOND PROFILE, `linear`, holds `Gauss linear` on div(rhoPhi,U) on both paths (alpha 9.8e-14 host, 1.2e-13 device), for the reason in the note."
    note: "vanLeerV IS LimitedScheme<vector, vanLeerLimiter<NVDVTVDV>, null> (vanLeer.C:37): the r of the V schemes -- one per face, from the vector difference across it dotted with the upwind cell's gradient projected on d (NVDVTVDV.H) -- with vanLeer's (r + |r|)/(1 + |r|), which is not clamped and reaches 2. The gradient is fvc::grad(U) through the case's grad(U) entry (LimitedScheme::calcLimiter). brae already had both halves: rVector for limitedLinearV and vanLeerLimiter for div(phi,alpha); vanLeerVWeights is their product. On the device the V kernel selected its limiter by clamping alone, so the limiter selection was hoisted out of the scalar kernel into limiterOfR and both kernels take it, vanLeer chosen by the kVanLeerTwoByk sentinel. THE `linear` PROFILE EXISTS BECAUSE OF WHAT WAS FOUND WIRING THIS: interFoam's own scheme enum has `linear` (three shipped tutorials name it) and its device mapping had no case for it, so it fell through the switch's `default` to upwind -- a -device run would have convected upwind under the name `linear`. The shared cpu::DivScheme now has `linear` (deviceDivCentralCoeffs; the mesh's own weights on the host) and the mapping names every scheme with no default."

  interFoam_nonOrthCorrection:
    openfoam:
      symbol: correctedSnGrad
      file: src/finiteVolume/finiteVolume/snGradSchemes/correctedSnGrad/correctedSnGrad.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_peqn_cpp.cu
    validation: "tests/interfoam_moving_vs_openfoam.sh's two non-orthogonal tanks, against real OpenFOAM: laminar/sloshingTank2D as shipped but for p_rghFinal -- SDA motion, 44-degree chamfered cells, `Gauss linear corrected` and `corrected`, nAlphaSubCycles 3, cAlpha 1.5, 2-D -- ten of its own steps: 20 of 20 p_rgh counts, alpha 5.8e-15, p_rgh 3.2e-14, U 3.9e-13, the still tank 100% of U away; and laminar/sloshingCylinder -- a snappyHexMesh cylinder of polyhedra at 26 degrees, MULESCorr, nNonOrthogonalCorrectors 1, its oscillation's phase and vertical shifts zeroed because as shipped the mesh jumps 6.9 cm at the first update and OpenFOAM itself blows up at any fixed step -- ten steps of 0.001: 40 of 40 counts, alpha 6.9e-11, U 1.0e-08. BROKEN ONCE EACH (tank / cylinder): the pressure laplacian's explicit correction dropped from the source 8.7e-02 / 2.1e-01; its face flux dropped from p_rghEqn.flux() 9.5e-02 / 2.6e-01; the viscous laplacian orthogonal 6.4e-10 / 2.7e-04; the three snGrads orthogonal 1.3e-11 / 4.6e-04 (the tank's interface is horizontal; the cylinder is the fixture for that one). tests/interfoam_refusals.sh: `corrected` on a sheared damBreak RUNS on the host and is refused on the device; `uncorrected` on it is refused by name; and three gradSchemes arms. WHAT IT DOES NOT CLAIM: `uncorrected` on a mesh that is not orthogonal, any gradSchemes entry but `Gauss linear`, the device."
    note: "THE OPERATORS, from gaussLaplacianSchemes.C and correctedSnGrad.C: a corrected laplacian's matrix takes nonOrthDeltaCoeffs on the internal faces and the patch's own coefficients on the boundary; its source takes -V*div(gammaMagSf*snGradCorrection(vf)), the correction being nonOrthCorrectionVectors dotted with the linear interpolate of grad(vf) THROUGH vf's OWN gradSchemes entry, a vector field's by component and so through `default`; and because p_rgh is fluxRequired the same face field is kept as the matrix's faceFluxCorrection, which p_rghEqn.flux() adds back so `phi = phiHbyA - flux` stays conservative. A corrected snGrad is nonOrthDeltaCoeffs*(vfN - vfP) plus that correction. `limited <c>` caps the correction per face against the orthogonal part. brae had all of it (fvm.cuh, fvc.cu, addDivDevReff) from rhoSimpleFoam; interFoam refused every corrected scheme on a mesh that was not orthogonal and now passes the case's flags through the pressure equation, the viscous term and the three snGrads -- p_rgh in the predictor's force, rho in phig, alpha in the surface-tension force. `uncorrected` is NOT brae's orthogonal assembly: uncorrectedSnGrad takes nonOrthDeltaCoeffs, orthogonalSnGrad takes deltaCoeffs (uncorrectedSnGrad.H:91, orthogonalSnGrad.H:91), so it is refused on a mesh where they differ. gradSchemes WERE NEVER READ by this solver: 40 of the 44 tutorials write `default Gauss linear;` alone, and the four that limit a gradient (mixerVesselAMI, DTCHull, DTCHullMoving, electrostaticDeposition) would have run unlimited; every entry but `Gauss linear` is refused now. TWO FINDINGS ON THE WAY, both about a mesh that is not a mesh of rectangles: fv_geometry's face centres were (1/3)*(sumAc/sumA) where primitiveMeshTools.C computes (1/3)*sumAc/sumA, and a triangle's (a+b+c)/3 where OpenFOAM writes (1/3)*(a+b+c) -- with OpenFOAM's order V and C are OpenFOAM's to the bit on every mesh the motion gate runs (hex, chamfered, snappy), where they read 1e-14 before; and that last digit decided the pressure reference of sloshingTank2D, whose pRefPoint lies on a face (interFoam_pressureReference)."

  interFoam_vanLeer:
    openfoam:
      symbol: vanLeer
      file: src/finiteVolume/interpolation/surfaceInterpolation/limitedSchemes/vanLeer/vanLeer.C
    classification: SHARED_NUMERICAL
    brae_status: REIMPLEMENT
    brae_reference: src/cuda/device_fvm.cu
    brae_target: src/cuda/device_fvm.cu
    validation: "tests/test_scheme_blocks.cu -- the selector, with a fail-proof; and the limiter against vanLeer.H:70 directly. It asymptotes to 2, not 1: it is a Sweby TVD limiter, not a [0,1] blend, and writing the clamp limitedLinear needs would make it a different scheme."
    note: "EVERY interFoam tutorial uses `div(phi,alpha) Gauss vanLeer`. brae has limitedLinear/V, vanAlbada, LUST, linearUpwind/V -- not vanLeer. Small, and blocking."

  interFoam_alphaCourantNo:
    openfoam:
      symbol: alphaCourantNo
      file: applications/solvers/multiphase/VoF/alphaCourantNo.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/finiteVolume/cfdTools/general/time_controls.cuh
    brae_target: src/finiteVolume/cfdTools/general/device_alpha_courant.cu
    validation: "tests/test_alpha_courant_cpp.cu. Four fail-proofs: defaulting maxAlphaCo, pos for pos0, masking the mean's denominator, and dropping the alpha limit from setDeltaT. ON THE DEVICE, tests/test_device_alpha_courant.cu repeats three of them plus the boundary half of surfaceSum (0.0035 against 0.0043), with the fixture landing 40 cells EXACTLY on the band's edges so pos and pos0 differ. Agreement is 1e-14 relative and NOT bit-exact, and that is itself the measurement: a max over per-cell sums would be bit-identical if the sums were, so the one ULP proves sumPhi is a gather here and a scatter on the host."
    note: "A SECOND Courant number, over the interface cells only, because the ordinary one is a global max set by whatever corner runs fastest -- usually nowhere near the interface -- and MULES does not stop the interface being advected more than a cell per step. Landed alongside the existing time_controls, which already gives every transient solver CourantNo/setInitialDeltaT/setDeltaT (brae_pimpleFoam stopped refusing adjustTimeStep when that landed). Four things: maxAlphaCo is get<scalar> with NO default where maxCo defaults to 1, so the same controlDict is refused by one reader and not the other; nearInterface() is a 0/1 MASK over the CLOSED band [0.01, 0.99] (pos0 is 1 at exactly zero), so the two cells at its edges -- the ones an advancing interface is passing through -- are counted; meanAlphaCoNum divides by gSum(V) over the WHOLE mesh, not the interface volume; and with no interface alphaCoNum is exactly 0 so maxAlphaCo/(0+SMALL) lets maxCo alone set the step, which a differently-guarded division would turn into a freeze. FEEDING IT BACK INTO deltaT found two more things, both silent. Time::run() is `value() < endTime - 0.5*deltaT`, tested BEFORE setDeltaT with the previous step -- nothing in brae implemented it, brae_interFoam bounded its loop by a step COUNT computed from the initial deltaT, and damBreak at `endTime 0.004` ran out to t = 0.054, thirteen times past the end of the case, under a comment claiming the end time stopped it. And Time::setDeltaT takes `adjust = true` by default (Time.C:1178) and calls Time::adjustDeltaT, which under `writeControl adjustable` SHORTENS the step to land on the next write time: damBreak writes every 0.05, so OpenFOAM's first step is 0.05/417 = 0.000119904 where brae's unclamped setDeltaTVoF gave 0.00012. Both are ported (WriteCadence + adjustDeltaT in time_controls.cuh, and note that Time::writeControlNames tabulates wcAdjustableRunTime TWICE, as `adjustable` and as `adjustableRunTime` -- damBreak uses the short spelling and matching only the long one made the whole clamp a no-op on the very case it was measured against). tests/interfoam_dambreak_clock_vs_openfoam.sh now holds the clock against real OpenFOAM on the tutorial AS IT SHIPS: thirteen steps over one write interval, deltaT BIT-IDENTICAL, 0.000e+00 on every step at 17 digits, both landing exactly on 0.05 -- and `brae_interFoam -device`, which refused adjustTimeStep until this landed, is bit-identical too. Over those thirteen steps the Courant number never binds at maxCo 1, so this gate is the cap, adjustDeltaT and the loop bound; the Courant feedback is the device gate's adaptive arm at maxCo 0.0015. GETTING TO A TRUE NUMBER TOOK THREE PRINTFS: at OpenFOAM's default six figures it read 3.2e-06 (half an ULP of 0.00119047619 logged as 0.00119048); at writePrecision/timePrecision 14 it read 2.389e-09 and stayed there, identical on host and device, while the fields moved four orders closer -- which was brae's own `%.9g`; at 17 digits on both sides it is zero. A comment in the gate had explained the 2.389e-09 as field disagreement arriving through the Courant number. It was a printf."

  interFoam_createFields:
    openfoam:
      symbol: createFields
      file: applications/solvers/multiphase/interFoam/createFields.H
    classification: CONFIGURATION
    brae_status: REIMPLEMENT
    brae_reference: src/applications/solvers/interFoam/inter_case_cpp.cuh
    brae_target: src/applications/solvers/interFoam/device_inter_case.cu
    validation: "tests/interfoam_createfields_vs_openfoam.sh -- damBreak's OWN case, prepared the way the tutorial does. damBreak ships 0.orig and NO mesh, so the fixture is a PROCEDURE (blockMesh then setFields), not a directory this repo can check in; the gate runs OpenFOAM's own utilities and SKIPs where OpenFOAM is absent. 2268 cells, 5 patches, 324 water cells."
    note: "ONE translation from case to fields, shared by the gate and by the solver -- a private copy in the driver is the defect rhoSimpleFoam's mirror wrote down: the gate proves the step, the driver feeds it something else, nothing compares them. Three things: the alpha field's NAME comes from `phases (water air)`, so a hard-coded alpha1 finds no file on any shipped case; phi is READ when present (createAlphaFluxes.H) and only computed from U when it is not, so a restart continues from the written flux rather than discarding the continuity error the last pressure corrector drove down; and fvSchemes KEYS contain parentheses and commas, so FoamDict cannot look them up -- they are read as text through scheme_parse's fvSchemesBlock, the same route every other brae solver uses. simulationType RAS is read here and handed to interFoam_turbulence, which holds what is run (kEpsilon, both lineages) and what is refused. THIS NOTE USED TO SAY a non-laminar simulationType is refused because interFoam's turbulence is `a MIXTURE model handed the blended rho`; that was written from memory and is wrong for 15 of the 17 turbulent tutorials (incompressibleInterPhaseTransportModel.C:99-106 builds the ordinary single-phase model by default). solvers/p_rgh and p_rghFinal are read as the case names them: PCG with DIC, or GAMG with its controls (interFoam_GAMG); anything else still substitutes PBiCGStab under a notice. constant/dynamicMeshDict is read here too (interFoam_solidBodyMotion), and p_rgh's need for a reference (interFoam_pressureReference)."

